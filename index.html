<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>일대종사 一代宗師</title>
<!-- 본문 주력 서체는 첫 화면부터 전 표면을 그리므로, 스타일시트 파싱을 기다리지 않고 먼저 받는다 (REQ-803). -->
<link rel="preload" href="assets/fonts/NanumMyeongjo-subset-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/NanumMyeongjo-subset-800.woff2" as="font" type="font/woff2" crossorigin>
<!-- 한자 병기는 첫 화면부터 뜨므로 F2 도 함께 물린다 — 늦게 받으면 그 자리만 최대 block 기간 비어 보인다. -->
<link rel="preload" href="assets/fonts/NotoSerifKR-hanja-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/NotoSerifKR-hanja-800.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* 한글·라틴(F1)과 한자(F2)가 같은 패밀리 안에서 unicode-range 로 갈리므로, 한자 병기에 별도
   font-family 를 걸 자리가 없다 — 그래서 `font-display: block` 이 폴백 산세리프가 잠깐이라도
   표면에 뜨는 것을 막는 유일한 수단이다 (REQ-812). woff2 는 `scripts/subset-fonts.sh` 산출물. */
@font-face {
  font-family: 'Dojo'; src: url('assets/fonts/NanumMyeongjo-subset-400.woff2') format('woff2');
  font-weight: 400; font-display: block;
  unicode-range: U+0020-024F,U+1100-11FF,U+2000-206F,U+20A0-20BF,U+2190-21FF,U+25A0-25FF,U+3000-303F,U+3130-318F,U+AC00-D7AF,U+FF00-FFEF;
}
@font-face {
  font-family: 'Dojo'; src: url('assets/fonts/NanumMyeongjo-subset-800.woff2') format('woff2');
  font-weight: 800; font-display: block;
  unicode-range: U+0020-024F,U+1100-11FF,U+2000-206F,U+20A0-20BF,U+2190-21FF,U+25A0-25FF,U+3000-303F,U+3130-318F,U+AC00-D7AF,U+FF00-FFEF;
}
@font-face {
  font-family: 'Dojo'; src: url('assets/fonts/NotoSerifKR-hanja-400.woff2') format('woff2');
  font-weight: 400; font-display: block; unicode-range: U+3400-9FFF,U+F900-FAFF;
}
@font-face {
  font-family: 'Dojo'; src: url('assets/fonts/NotoSerifKR-hanja-800.woff2') format('woff2');
  font-weight: 800; font-display: block; unicode-range: U+3400-9FFF,U+F900-FAFF;
}

/* ══ 시각 토큰 원장 ══ 7화면·모든 컴포넌트가 상속하는 스타일 SoT 는 이 블록 하나이며,
   화면별 재정의를 두지 않는다 (spec § ①). 색·크기·타이밍의 수치는 전부 여기에만 있고
   아래 규칙과 JS 는 이름으로만 참조하므로, 튜닝이 이 한 곳에서 닫힌다.
   밸런스 tunable(`src/balance.data.json`)과는 다른 축이다 — 그쪽은 게임 규칙의 SoT 이고
   여기는 렌더 층의 SoT 다. 규칙 값이 렌더에 닿아야 하면 JS 가 변수로 주입한다(`--hit`·`--vd-dur`). */
:root {
  /* 색 9종 C1~C9 (REQ-810) — 화면·컴포넌트는 리터럴 색을 쓰지 않는다. */
  --c1: #12100e;  /* 먹 심 */
  --c2: #1e1a16;  /* 먹 중 */
  --c3: #e8dcc8;  /* 화선지 */
  --c4: #c9a227;  /* 금 */
  --c5: #a8332a;  /* 주사 — 막힘·경고 전용 (REQ-811) */
  --c6: #5fb3e8;  /* 쾌 */
  --c7: #e05a4d;  /* 강 */
  --c8: #4fbf7f;  /* 정 */
  --c9: #cdbb9c;  /* 화선지 면 */
  /* 그림자·스크림의 기준 — 팔레트의 색이 아니라 명도 축이라 C1~C9 와 별개로 둔다. */
  --shadow: #000;

  /* 역할 이름 — 규칙은 이쪽만 부르고, 어느 원장 색을 쓰는지는 이 표가 정한다. */
  --bg: var(--c1);
  --panel: var(--c2);
  --letterbox: color-mix(in srgb, var(--c1) 62%, var(--shadow));
  --fg: var(--c3);
  --dim: color-mix(in srgb, var(--c3) 55%, transparent);
  /* 규칙을 나르는 문구 (REQ-912) — 다음 계단 안내·판정 칩·상태 배지·지시 안내는 보조 설명이
     아니라 규칙 그 자체라 본문과 같은 대비에 선다. 넷을 한 이름 아래 모아 두는 것이 이 토큰의
     일이다: 가장 중요한 규칙이 가장 낮은 대비로 되돌아가는 회귀가 한 줄에서 막힌다. */
  --rule: var(--fg);
  --line: color-mix(in srgb, var(--c3) 12%, transparent);
  --gold: var(--c4);
  --sunken: color-mix(in srgb, var(--shadow) 55%, transparent);
  --raised: color-mix(in srgb, var(--c3) 8%, var(--c2));
  --hit: 56px;  /* 부팅 직후 app.mjs 가 BALANCE.buttonHitPx 로 덮는다 — 첫 페인트 폴백이다 */
  /* 히트 영역의 하한 (REQ-910) — `--hit` 는 십자 키가 겨냥하는 크기이고 이쪽은 **어떤 탭 대상도
     그 아래로 내려가지 않는다**는 바닥이다. 촘촘한 줄에서 `--hit` 만큼 넓히면 확장분이 이웃 줄의
     버튼을 덮으므로, 그 자리들은 이 하한까지만 넓힌다. */
  --hit-min: 44px;

  /* 서체 역할 (REQ-812·813) — 한 패밀리 'Dojo' 안에서 unicode-range 가 F1/F2 를 가른다. */
  --font-body: 15px/1.5 'Dojo', serif;
  --hj-size: 12px;
  --hj-tone: color-mix(in srgb, var(--c3) 34%, transparent);

  /* 6단 판정 4중 부호화 (REQ-814) — 크기·위치 두 축의 수치. 완파↔역파는 같은 값의 부호만
     달라 상하 대칭이 규칙으로 고정된다. 색·자형 축은 아래 .verdict.* 와 theme.mjs 가 진다. */
  --vd-size-extreme: 96px;  /* 완파·역파 */
  --vd-size-mid: 66px;      /* 우세·열세 */
  --vd-size-clash: 54px;    /* 상쇄 */
  --vd-size-struck: 80px;   /* 피격 */
  --vd-shift-extreme: 84px;
  --vd-shift-mid: 44px;
  --vd-shift-clash: 0px;
  --vd-shift-struck: 116px;
  --vd-mark-size: 26px;
  /* 색 축 (REQ-814) — 판정 오버레이와 결과 화면의 분포 칩이 같은 이름을 부른다 (REQ-872). */
  --vd-tone-crush: var(--c4);
  --vd-tone-advantage: var(--c6);
  --vd-tone-clash: color-mix(in srgb, var(--c3) 82%, transparent);
  --vd-tone-disadvantage: color-mix(in srgb, var(--c7) 80%, var(--c1));
  --vd-tone-reversal: var(--c7);
  --vd-tone-struck: color-mix(in srgb, var(--c7) 60%, var(--c1));

  /* juice — 극단 2등급(완파·역파)에만 배정된 축 (REQ-815). 히트스톱 80ms 는 실측 전 초기값이다. */
  --juice-hitstop: 80ms;
  --juice-shake: 420ms;
  /* 파해 유도 맥동 한 주기 (REQ-855) — 유도는 확정이 아니라 그 예고라 멈추지 않고 숨쉰다. */
  --beckon-dur: 1100ms;
  /* 확정 연출의 최소 표시 시간 (REQ-826) — 마지막 키가 「후보 1개 도달」과 「시퀀스 완주」를 겸하는
     초에만 물린다. 120ms 는 실측 전 초기값이고, 히트스톱과 함께 판정 재생 앞의 예산을 이룬다 —
     둘의 합이 재생을 남기는지는 app.mjs 부팅 단정이 문다. */
  --only-hold: 120ms;
  --slip-exit: 180ms;  /* 탈락 죽간의 가라앉기와 살아남은 매의 미끄러짐이 함께 쓰는 시간 (REQ-825) */

  /* 3단 고정 (REQ-820) — 시안 실측 초기값이며 S3 수련이 같은 좌표를 상속한다 (REQ-840). */
  --band-h: 50px;
  --scene-h: 440px;
  --input-h: 362px;

  /* 아레나 (REQ-821) — S4 파견이 그대로, S6 결과가 높이만 접어 물려받는다 (REQ-850·875). */
  --scene-sky: radial-gradient(125% 78% at 50% 26%,
    color-mix(in srgb, var(--c1) 86%, var(--c3)) 0%,
    color-mix(in srgb, var(--c1) 94%, var(--c3)) 42%,
    color-mix(in srgb, var(--c1) 98%, var(--c3)) 72%, var(--c1) 100%);
  --scene-ridge-far: color-mix(in srgb, var(--c1) 90%, var(--c3));
  --scene-ridge-near: color-mix(in srgb, var(--c1) 96%, var(--c3));
  --scene-bamboo: color-mix(in srgb, var(--c1) 84%, var(--shadow));
  --scene-ground-h: 112px;
  /* 미세 패럴랙스의 진폭 (REQ-914) — 원경이 덜 움직이는 것이 곧 깊이다. 두 값 모두 정경 SVG 가
     좌우로 10px 씩 물고 나가는 여유(viewBox -10~403) 안이라, 흔들려도 가장자리가 드러나지 않는다.
     끄는 스위치는 `.scene.flat` 하나이고 그 판정은 프레임률이 진다. */
  --px-ridge: 2px;
  --px-bamboo: 6px;
  --px-drift: 17s;
  --backlight: color-mix(in srgb, var(--c9) 30%, transparent);
  /* 역광이 닿지 않는 실루엣의 윤곽선 (REQ-875) — 빛이 아니라 선이 형태를 지는 자리다. */
  --paper-rim: color-mix(in srgb, var(--c3) 34%, transparent);
  /* 사람이 서는 두 자리 — 대각 대치가 성립하는 좌표다 (REQ-821). */
  --fig-far-x: 34px;
  --fig-far-y: 112px;
  --fig-far-w: 126px;
  --fig-near-x: 14px;
  --fig-near-y: 30px;
  --fig-near-w: 176px;
  --fig-prone-y: 48px;   /* 쓰러진 사람이 무대 바닥에서 뜨는 거리 */
  /* 역광은 실루엣보다 크고 어긋나 있다 — 뒤에서 비추는 빛이라 윤곽과 같은 상자가 아니다. */
  --glow-far-x: 22px;
  --glow-far-y: 112px;
  --glow-far-w: 170px;
  --glow-far-h: 200px;
  --glow-near-x: 2px;
  --glow-near-y: 34px;
  --glow-near-w: 220px;
  --glow-near-h: 238px;

  /* 죽간 (REQ-824·827) — 매수가 곧 폭이라 「좁혀진다」의 계단이 이 네 값이다. */
  --slip-w1: 172px;
  --slip-w2: 132px;
  --slip-w3: 104px;
  --slip-w4: 84px;
  --slip-h: 146px;
  --slip-gap: 7px;

  /* 키패드 (REQ-828·829) — 키 간격 대 되돌리기까지의 간격이 3배라 별개 그룹으로 읽힌다. */
  --key-w: 64px;
  --key-h: 58px;
  --key-gap: 7px;
  --key-sep: 21px;
  --trail-size: 28px;

  /* 성(成) 계단 (REQ-817) */
  --stair-h: 13px;
  --stair-gap: 2px;
  --stair-wall-gap: 7px;   /* 8성 벽이 앞 칸과 벌어지는 간격 */
  --stair-wall-w: 5px;     /* 그 사이에 서는 주사색 세로선의 두께 */
  --stair-glow: 7px;
  --visit-w: 22px;         /* 수련 회차 칸의 폭 (REQ-845) — 칸 수가 적어 늘리지 않고 못박는다 */

  /* 도장 정경 (REQ-837) — 무대가 아니라 홈의 머리 그림이라 아레나 좌표와 별개 축이다.
     성 축 정보에 세로를 넘기느라 무대(440)의 1/4 로 접혀 있다. */
  --dojo-banner-h: 108px;
  --dojo-floor: radial-gradient(66% 86% at 50% 30%,
    color-mix(in srgb, var(--c1) 82%, var(--c3)) 0%,
    color-mix(in srgb, var(--c1) 92%, var(--c3)) 54%, var(--c1) 100%);
  --dojo-master-x: 148px;
  --dojo-master-h: 96px;
  --dojo-pupil-x: 212px;
  --dojo-pupil-h: 78px;
  /* 유도 말풍선이 앉을 자리 — 행이 이만큼 비워 두므로 말풍선이 아래 블록을 덮지 않는다 (#50). */
  --tip-h: 22px;

  /* 수련장 (REQ-840·842) — 3단 좌표는 아레나와 같고 무대만 도장 안이다. */
  --hall-floor: radial-gradient(120% 74% at 50% 30%,
    color-mix(in srgb, var(--c1) 88%, var(--c3)) 0%,
    color-mix(in srgb, var(--c1) 93%, var(--c3)) 46%,
    color-mix(in srgb, var(--c1) 97%, var(--c3)) 76%, var(--c1) 100%);
  --fig-hall-y: 22px;
  --fig-hall-w: 156px;
  --glow-hall-y: 24px;
  --glow-hall-w: 206px;
  --glow-hall-h: 222px;
  /* 구결 족자 (REQ-841·842) — 화면에서 유일하게 밝은 면이라 여기만 C9 를 표면으로 쓴다. 창이
     3줄 상수라 행 높이 하나가 곧 키 한 번의 이동량이고, 창 바닥은 사부 머리 알파 경계 위에 선다 (#169). */
  --scroll-x: 16px;
  --scroll-y: 10px;
  --scroll-rod-h: 10px;
  --verse-row-h: 25px;
  --verse-line-h: 19px;
  --scroll-shift: 150ms;
  --seal-size: 26px;
  /* 지켜보는 사부 (REQ-854) — 무대 밖 앞 구석이라 좌표가 음수이고 그 잘림이 곧 사부의 시선이다. */
  --watch-x: -30px;
  --watch-y: -144px;
  --watch-w: 195px;

  /* 결과 (REQ-870·874) — 무대는 아레나를 접은 값이고 남는 세로가 정산부다. 낙인이 한 초의 판정
     오버레이(`--vd-size-extreme`)보다 커야 한 판의 결론이 한 수의 결론보다 무겁게 읽힌다. */
  --result-scene-h: 360px;
  --brand-y: 44px;
  --brand-size: 104px;
  --brand-mark: 26px;
  --act-h: 54px;

  /* 전수 (REQ-860~864) — 두 사람이 같은 방향을 보고 제자가 사부의 등 뒤에 선다. 팔 각도 하나가
     시범과 따라 하기를 가르므로 그 각도와 회전 중심이 이 무대의 유일한 연출 값이다. */
  --tm-fig-y: 34px;
  --tm-master-x: 36px;
  --tm-master-w: 150px;
  --tm-pupil-x: 34px;
  --tm-pupil-w: 108px;
  --tm-glow-master-x: 8px;
  --tm-glow-pupil-x: 22px;
  --tm-glow-y: 30px;
  --tm-glow-master-w: 186px;
  --tm-glow-master-h: 204px;
  --tm-glow-pupil-w: 146px;
  --tm-glow-pupil-h: 162px;
  /* 회전 중심은 제자 어깨다 — 실루엣 캔버스(512x1024) 안의 비율이라 폭·높이가 바뀌어도 따라가고,
     사부 어깨는 x·y 가 모두 달라 한 토큰을 나눠 쓸 수 없다 (#171). */
  --tm-pupil-arm-origin: 52% 28%;
  --tm-follow-angle: 26deg;
  /* 시범을 보는 시간과 팔이 맞아떨어지는 시간 — 한 연출의 두 구간이라 같은 자리에 둔다. */
  --tm-follow-delay: 1400ms;
  --tm-follow-dur: 640ms;
  --sigil-y: 26px;
  --sigil-size: 24px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* 세로 스크롤 컨테이너 공통 — 상시 스크롤 막대가 무협 톤을 깨므로 막대만 숨기고 스크롤은 남긴다 (#164). */
.screen-body, .transfer, .settle, .body-flow, .list, .slots { scrollbar-width: none; }
.screen-body::-webkit-scrollbar, .transfer::-webkit-scrollbar, .settle::-webkit-scrollbar,
.body-flow::-webkit-scrollbar, .list::-webkit-scrollbar, .slots::-webkit-scrollbar { display: none; }
html, body { margin: 0; height: 100dvh; overflow: hidden; }
body {
  background: var(--bg); color: var(--fg); font: var(--font-body);
  overscroll-behavior: none;
}
#frame {
  position: relative; width: 100vw; height: 100dvh; overflow: hidden;
  display: flex; flex-direction: column;
  background: var(--letterbox);
}
/* 검증 도구는 무대와 겹치지 않는 자기 띠에 산다 — 겹치면 여백 0 인 창에서 도달 불가이거나 무대 스크린샷에 섞인다. */
#tools {
  position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 8px;
}
#tools[hidden] { display: none; }
#tools button { padding: 4px 8px; font-size: 12px; }
/* 접근성 옵션은 게임 스테이지 밖에 산다 — 무대 안의 컨트롤은 시안이 자리를 지정한 것뿐이고,
   이 토글의 정착지는 M3 설정 화면이다 (#133). */
#tools label { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--dim); }
#tools button.urge { border-color: var(--gold); color: var(--gold); }
/* 치트 패널은 명시 토글로만 열리므로(REQ-781) 띠를 늘리지 않고 무대 위로 펼친다. */
#tools .cheat { position: absolute; top: 100%; left: 8px; z-index: 3; background: var(--c1); }

/* 스테이지 배율의 기준은 창이 아니라 이 상자다 — 도구 띠가 먹은 만큼은 무대가 쓸 수 없다. */
#stagebox { flex: 1; min-height: 0; display: grid; place-content: center; }
/* 논리 해상도를 393x852 로 못박고 상자에는 축소로만 맞춘다 — 내부 좌표가 창·기기와 무관해진다.
   배율은 부팅이 상자를 재서 `--k` 로 넣어 준다 (#187); 여기 적힌 1 은 그 주입 전의 무대 크기다. */
#stage {
  --k: 1;
  position: relative; width: 393px; height: 852px;
  transform: scale(var(--k)); transform-origin: center;
  background: var(--bg); border-radius: 18px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--line);
}
/* 모듈이 늦게 오면 배율 없는 무대가 먼저 그려져 잘린 채 보였다가 튄다 — 실측된 창이라, 잰
   배율이 붙기 전까지는 레터박스 색만 남긴다. 부팅이 첫 측정에서 `.fit` 을 준다 (#187). */
#stage:not(.fit) { visibility: hidden; }
/* 흔들림이 걸리는 유일한 노드 — 스테이지는 `transform: scale(var(--k))` 를 이미 쓰므로 거기 걸면
   완파·역파마다 그 배율이 날아가 화면이 100% 로 튄다 (REQ-816). */
.shell { position: relative; height: 100%; }
.shell.punch { animation: punch-shake var(--juice-shake) var(--juice-hitstop) cubic-bezier(.36, .07, .19, .97) both; }
@keyframes punch-shake {
  10% { transform: translate(-6px, 3px) } 22% { transform: translate(5px, -4px) }
  36% { transform: translate(-4px, -2px) } 52% { transform: translate(3px, 3px) }
  70% { transform: translate(-2px, 1px) } 100% { transform: translate(0, 0) }
}
/* 화면이 통째로 소유하는 자리 — 전역 여백이 없어야 어떤 화면이든 y=0 부터 깔 수 있다 (REQ-802). */
#app { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
/* 플렉스 자식의 기본 min-width:auto 가 긴 한글 줄을 뷰포트 밖으로 밀어낸다. */
#app, .screen-body, .card, .row, .row-head, .row-name, .head, .meter-line > *, .tip-anchor { min-width: 0; }
/* 낭독 전용 층 — 스테이지 직속이라 화면이 파괴돼도 판정이 침묵하지 않는다 (REQ-807). */
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}

/* 실전 4화면의 `.stage-band` 와 한 토큰 한 값을 쓴다 — 두 값 클래스가 있으면 시안 대조가
   화면마다 갈린다. 띠가 확장 상자를 자기 높이로 자르므로 이 줄이 보장하는 것은 `--hit-min` 까지이고,
   그보다 큰 `--hit` 을 요구하는 물러나기는 띠 높이에서 멈춘다 — REQ-910 하한은 넘는다 (#133). */
.top-band {
  display: flex; align-items: center;
  height: var(--band-h); padding: 0 14px; border-bottom: 1px solid var(--line); font-size: 13px;
  overflow: hidden;
}
.top-row { display: flex; gap: 10px; align-items: center; min-width: 0; white-space: nowrap; flex: 1; }
.top-row > * { overflow: hidden; text-overflow: ellipsis; }
/* 위 말줄임 규칙은 이름·재화가 넘칠 때를 위한 것인데 컨트롤에도 걸려 **확장 히트 상자를 자른다**
   — 잘린 확장은 아무 일도 하지 않는다. 컨트롤만 되돌린다 (REQ-910). */
.top-row > .leave, .top-row > .mute { overflow: visible; }
.top-band .mute { position: relative; }
.top-band .mute::after {
  content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 100%; height: var(--hit-min); min-width: var(--hit-min);
}
/* 물러나기는 띠를 쓰는 화면의 좌측 첫 자리에 고정된다 (REQ-897) — 시각 크기는 두고 히트 영역만
   최소치까지 넓혀, 조판을 흔들지 않으면서 손가락에 닿는다. */
.leave {
  position: relative; flex: none; width: 28px; height: 28px; padding: 0;
  border: 0; background: none; color: var(--dim); font-size: 19px; line-height: 1;
}
.leave::after {
  content: ''; position: absolute; left: 50%; top: 50%;
  width: var(--hit); height: var(--hit); transform: translate(-50%, -50%);
}
/* 음소거 (REQ-926) — 싸우는 중이 아니라 들어가기 전에 정하는 설정이라 이 줄에 산다. 상태를
   색이 아니라 문면으로도 말해야 낭독에서 「지금 켜져 있는가」가 읽힌다. */
.top-band .mute {
  flex: none; padding: 2px 8px;
  font-size: 11px; border-radius: 4px; color: var(--dim);
}
.top-band .mute.off { color: var(--c5); border-color: color-mix(in srgb, var(--c5) 45%, transparent); }
.top-band .top-label { font-weight: 700; color: var(--gold); }
.top-band .top-coins { margin-left: auto; }

/* 본문 여백은 화면이 고른다 — 풀블리드 레이어가 y=0 에서 시작하려면 전역 규칙이 없어야 한다 (REQ-802). */
.screen-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.screen-body.padded { padding: 12px; gap: 12px; }

/* 바닥 밴드의 주인과 높이는 화면이 정한다 — 쓰지 않는 화면은 만들지 않으므로 자리도 남지 않는다. */
.bottom-band {
  position: relative; border-top: 1px solid var(--line); background: var(--panel);
  padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;
}
/* 밴드는 화면 맨 아래라 말풍선을 위로 띄우고, 기준 상자를 밴드로 올려 좁은 칸에서 접히지 않게 한다. */
.bottom-band .tip-anchor { position: static; }
.bottom-band .tip { top: auto; bottom: calc(100% + 4px); }
.band-actions { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.band-cell { display: flex; flex-direction: column; gap: 4px; }
.band-actions button { width: 100%; min-height: var(--hit); padding: 8px 4px; font-weight: 700; }
/* 흐림 하나는 「아직 안 눌렀다」로도 읽혀 잠김을 말하지 못한다 — 자물쇠가 그 기호를 진다 (REQ-836).
   흐림을 `opacity` 가 아니라 색으로 거는 것은 그 그룹 투명도가 `::after` 까지 함께 지우기 때문이다. */
.band-actions button.locked {
  position: relative; opacity: 1;
  color: color-mix(in srgb, var(--fg) 35%, var(--panel));
  border-color: color-mix(in srgb, var(--line) 35%, transparent);
  background: color-mix(in srgb, var(--raised) 35%, var(--panel));
}
/* 우상단 모서리 — 라벨이 2글자라 가운데를 내주면 글자 위에 겹친다. 마스크 색은 막힘의 주사다 (REQ-811). */
.band-actions button.locked::after {
  content: ''; position: absolute; top: 4px; right: 4px; width: 15px; height: 15px;
  background: var(--c5);
}
/* 부제는 잠금 여부와 무관하게 한 줄을 차지한다 — 밴드가 높이를 바꾸면 위 스크롤 영역이 함께 흔들린다. */
.band-sub {
  height: 16px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font-size: 11px; line-height: 16px; color: var(--dim); text-align: center;
}
.band-sim { width: 100%; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.card h2 { margin: 0 0 8px; font-size: 15px; }
.card p { margin: 6px 0; }
.head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.head button { margin-left: auto; }
.dim { color: var(--dim); font-size: 12px; }
/* 한자는 어디서나 한글 옆의 보조 표기다 (REQ-813). 화면의 한자 조판이 이 한 규칙에만 있어
   「한자 전면 제거」가 규칙 하나의 변경으로 닫힌다. */
.hj { font-size: var(--hj-size); font-weight: 400; color: var(--hj-tone); letter-spacing: 2px; }
/* 간격은 부모의 flex gap 이 짓는다 — .hj 에 margin 을 달면 이미 gap 을 가진 나머지 병기 자리에서
   이중으로 붙는다 (#159). */
.hj-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 7px; }
/* 한글 우측 세로열 — 높이가 모자라면 조용히 2열로 접히므로 nowrap·overflow 가 한 세트다. */
.hj.stacked {
  writing-mode: vertical-rl; text-orientation: upright;
  white-space: nowrap; overflow: hidden; letter-spacing: 1px;
}
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--gold); color: var(--gold); font-size: 12px;
}
.badge.max { background: var(--gold); color: var(--c1); font-weight: 700; }
.tag { font-size: 11px; color: var(--rule); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

button {
  font: inherit; color: var(--fg); background: var(--raised); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px; cursor: pointer;
}
button:disabled { opacity: .35; cursor: default; }
button.primary { width: 100%; padding: 12px; font-weight: 700; }
button.small { padding: 5px 10px; font-size: 13px; }
button.ghost { background: transparent; }
.actions { display: flex; flex-direction: column; gap: 8px; }

.rows { display: flex; flex-direction: column; gap: 8px; }
.row {
  /* 말풍선의 기준 상자 — 행 바닥에 확보한 여백이 그 자리라, 헤더에 걸면 기준이 그 위로 올라간다. */
  position: relative;
  border: 1px solid var(--line); border-left: 3px solid var(--attr); border-radius: 8px; padding: 6px 8px;
}
/* 잠김 표현은 행의 **내용**에만 걸린다 — 행 상자에 걸면 유도 말풍선이 그 opacity 를 상속해
   반투명해지고, 자식은 부모의 불투명도를 넘지 못하므로 되돌릴 방법이 없다 (#50). */
.row.locked .row-name, .row.locked > .rank-next { opacity: .55; }
.row-head { display: flex; gap: 6px; align-items: center; min-height: var(--hit-min); }
.row-head button { min-height: 40px; }
/* 히트 영역 확장 (REQ-910) — 시각 크기는 그대로 두고 의사요소가 손가락 몫을 진다. 버튼 자체를
   키우면 줄 높이가 함께 자라 도장 본문의 스크롤 경계가 밀린다. */
.row-head button, .band-sim { position: relative; }
.row-head button::after, .band-sim::after {
  content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 100%; height: var(--hit-min); min-width: var(--hit-min);
}
.row-name {
  flex: 1; display: flex; gap: 6px; align-items: center;
  /* 아래에서 이름·한자가 압축을 거부하므로, 폭이 모자라면 흘러넘쳐 우측 액션 버튼을 덮는다 — 행 안에서 잘린다. */
  overflow: hidden;
}
/* 4자 초식명·한자 병기는 이 게임의 고유명사라 폭을 양보하지 않는다 — 양보는 아래 배지·태그가
   말줄임으로 지고, 그래서 성이 올라도 행 높이가 자라지 않는다 (#139). */
.row-name > b, .row-name > .hj { white-space: nowrap; flex-shrink: 0; }
/* `min-width` 는 위 상자와 같은 이유다 — 그것이 auto 면 nowrap 텍스트가 줄지 않아 말줄임이 발화하지 않는다. */
.row-name > .badge, .row-name > .tag {
  min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.meter-line { display: flex; gap: 8px; align-items: center; }
.meter-line .meter { flex: 1; }

/* 흐름 밖 말풍선을 담을 뿐이라 앵커 자신의 크기는 안내 유무로 변하지 않는다. */
.tip-anchor { position: relative; display: flex; }
.row .tip-anchor { position: static; }
.tip {
  /* 아래 형제 위로 겹치므로, 포인터를 통과시켜야 그 형제의 탭을 가로채지 않는다. */
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 1;
  pointer-events: none; font-size: 12px;
  color: var(--gold); background: color-mix(in srgb, var(--c4) 14%, var(--c1)); border: 1px solid var(--gold);
  border-radius: 6px; padding: 2px 8px;
}
/* 말풍선은 흐름 밖 층이라 자리를 만들지 못한다 — 행이 그만큼을 미리 비워, 안내가 아래 블록을
   덮지 않고 그 안에 앉는다. 자리가 없는 바닥 밴드만 겹침 배치를 그대로 쓴다 (#50). */
.row:has(.tip) { padding-bottom: calc(var(--tip-h) + 8px); }
.row .tip { top: auto; bottom: 4px; }
/* 지목의 주 신호 — 말풍선이 가려져도 어느 버튼을 누르라는 것인지는 테두리로 읽힌다. */
.tip-target { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.meter { height: 5px; background: var(--sunken); border-radius: 3px; margin: 6px 0; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--gold); }
/* 성(成) 계단 (REQ-817) — 화면마다 계단을 다시 짜면 같은 규칙이 화면 수만큼 갈라진다. */
.rank-gauge { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
.steps { flex: 1; display: flex; gap: var(--stair-gap); height: var(--stair-h); }
.st {
  /* 네 상태의 테두리·발광·벽을 이름으로 조립한다 — 조합 규칙이 어느 조각을 잃지 않게 (REQ-818). */
  --st-ring: 0 0 0 1px var(--line) inset;
  --st-lit: 0 0 0 1px color-mix(in srgb, var(--c4) 45%, transparent) inset;
  --st-glow: 0 0 0 1px var(--c4) inset, 0 0 var(--stair-glow) var(--c4);
  --st-wall: calc(-1 * var(--stair-wall-w)) 0 0 0 var(--c5);
  position: relative; flex: 1; background: var(--sunken); overflow: hidden;
  box-shadow: var(--st-ring);
}
/* 계단의 색 축 (REQ-864) — 번 값은 금, 이관에서 새로 시작하는 값은 청. 칸 규격은 공유한다. */
.steps.tone-gained { --stair-fill: var(--c4); }
.steps.tone-transferred { --stair-fill: var(--c6); }
.st > .fill {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0;
  background: linear-gradient(180deg, var(--stair-fill, var(--c4)),
    color-mix(in srgb, var(--stair-fill, var(--c4)) 60%, var(--c1)));
}
.st.on { box-shadow: var(--st-lit); }
/* 이번 판에 오른 칸 — 결과 화면이 「무엇이 올랐는가」를 이 발광 하나로 말한다. */
.st.gain { box-shadow: var(--st-glow); }
/* 8성 벽 — 수련이 끊기고 실전만 남는 경계라 C5(주사)가 맡는 막힘의 하나다 (REQ-706·811). */
.st.wall { margin-left: var(--stair-wall-gap); box-shadow: var(--st-ring), var(--st-wall); }
/* 벽 칸이 점등·발광 칸을 겸할 때 한쪽 box-shadow 가 다른 쪽을 통째로 덮으므로 둘을 합친다 (REQ-818). */
.st.on.wall { box-shadow: var(--st-lit), var(--st-wall); }
.st.gain.wall { box-shadow: var(--st-glow), var(--st-wall); }
/* 11·12 칸은 적립이 아니라 결정타·완파로 열린다 — 서브셋 밖 글리프(◆✦)가 두부가 되지 않도록
   같은 형태를 CSS 도형으로 그린다 (REQ-817). */
.st > .mk { position: absolute; inset: 0; margin: auto; color: var(--hj-tone); background: currentColor; }
.st.on > .mk { color: var(--c1); }
.st > .mk.finish { width: 5px; height: 5px; transform: rotate(45deg); }
.st > .mk.crush {
  width: 7px; height: 7px;
  clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
}
.cheat { margin-top: 6px; padding: 8px; border: 1px dashed var(--line); border-radius: 6px; background: var(--sunken); max-width: 320px; }
.cheat-rows { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.cheat-row { display: flex; gap: 6px; align-items: center; font-size: 12px; }
.cheat-row input { width: 56px; background: var(--c1); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }

/* 아이콘은 id 로 참조된다 — 코드는 `icon-<id>` 클래스만 알고 파일 경로는 이 표에만 있어,
   후속 아트 개선이 파일 스왑으로 닫힌다 (REQ-931). 마스크로 그리므로 색은 글자색을 따라간다. */
.icon { flex: none; display: inline-block; width: 22px; height: 22px; background: currentColor; }
.icon-reset {
  mask: url('assets/icons/reset.svg') center / contain no-repeat;
  -webkit-mask: url('assets/icons/reset.svg') center / contain no-repeat;
}
/* 자물쇠는 오버레이(`::after`)로 서지만 경로는 이 표 하나에 둔다 — 그래서 선택자를 여기에 함께 묶는다. */
.icon-lock, .band-actions button.locked::after {
  mask: url('assets/icons/lock.svg') center / contain no-repeat;
  -webkit-mask: url('assets/icons/lock.svg') center / contain no-repeat;
}

/* 도형은 접근성 트리 밖이고 그 옆의 `.sr-only` 이름이 낭독을 진다 (#48 · REQ-911) — 시각은
   그대로라 색·형태 2축이 줄지 않는다. */
.mark { display: inline-flex; align-items: center; font-size: 15px; line-height: 1; }
.mark .glyph { font-style: normal; }
.mark.big { font-size: 24px; }
.arrows { display: flex; gap: 6px; margin: 4px 0; }
.arrows i { font-style: normal; font-size: 20px; width: 24px; text-align: center; color: color-mix(in srgb, var(--c3) 22%, transparent); }
.arrows i.on { color: var(--gold); }
.arrows i.hint { color: var(--dim); animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }

/* ══ 아레나 (REQ-821) ══ 이식된 무대. 상속이 곧 서사이므로(REQ-850·875) 화면이 갈아 끼우는
   축은 무대 높이·사람이 서는 자리·그 사람의 자세 셋뿐이고, 나머지 좌표는 여기 고정이다. */
/* 무대 공통 층 — 아레나(`.scene`)와 수련장(`.hall`)이 같은 정경 문법을 쓰므로, 자리만 각자
   정하고 재료는 여기 한 벌이다. */
.layer, .scenery { position: absolute; inset: 0; pointer-events: none; }
.mist {
  background: linear-gradient(180deg, transparent 34%,
    color-mix(in srgb, var(--c3) 9%, transparent) 50%, transparent 66%);
}
.vignette {
  background: radial-gradient(118% 80% at 50% 44%, transparent 34%,
    color-mix(in srgb, var(--shadow) 72%, transparent) 100%);
}
.ground {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--scene-ground-h); pointer-events: none;
  background: linear-gradient(180deg, transparent,
    color-mix(in srgb, var(--shadow) 50%, transparent) 55%,
    color-mix(in srgb, var(--shadow) 86%, transparent));
}
/* 역광 — 이것이 없으면 먹 실루엣이 어두운 배경에서 사라진다 (REQ-821). */
.backlight {
  position: absolute; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, var(--backlight), transparent 72%);
}
/* 실루엣은 납품된 투명 PNG 다 (REQ-932) — 코드는 에셋 id·자세만 알고, 그 이름에서 파일로 가는
   표는 여기 한 곳뿐이라 후속 아트 개선이 파일 스왑으로 닫힌다 (REQ-931). */
.fig {
  position: absolute; pointer-events: none; aspect-ratio: 512 / 1024;
  /* 배치는 개별 속성으로만 쓴다 — `background` 단축은 자세마다 선언된 이미지를 none 으로 되돌린다 (#137). */
  background-position: center bottom; background-size: contain; background-repeat: no-repeat;
}
.fig.sil_master_stance { background-image: url('assets/art/silhouettes/sil_master_stance.png'); }
.fig.sil_challenger_stance { background-image: url('assets/art/silhouettes/sil_challenger_stance.png'); }
.fig.sil_disciple_stance { background-image: url('assets/art/silhouettes/sil_disciple_stance.png'); }
.fig.sil_master_watch { background-image: url('assets/art/silhouettes/sil_master_watch.png'); }
.fig.sil_master_dojo { background-image: url('assets/art/silhouettes/sil_master_dojo.png'); }
.fig.sil_disciple_dojo { background-image: url('assets/art/silhouettes/sil_disciple_dojo.png'); }
.fig.sil_master_prone { background-image: url('assets/art/silhouettes/sil_master_prone.png'); }
.fig.sil_challenger_prone { background-image: url('assets/art/silhouettes/sil_challenger_prone.png'); }
/* 전수의 두 사람만 몸통·팔이 나뉘어 납품된다 — 각도 하나로 시범/따라 하기가 갈리기 때문이다 (REQ-861). */
.part.sil_master_demo_body { background-image: url('assets/art/silhouettes/sil_master_demo_body.png'); }
.part.sil_master_demo_arm { background-image: url('assets/art/silhouettes/sil_master_demo_arm.png'); }
.part.sil_disciple_follow_body { background-image: url('assets/art/silhouettes/sil_disciple_follow_body.png'); }
.part.sil_disciple_follow_arm { background-image: url('assets/art/silhouettes/sil_disciple_follow_arm.png'); }
/* 엎드린 쪽에는 역광이 없다 — 형태를 지는 것이 뒤에서 오는 빛이 아니라 윤곽선이다 (REQ-875). */
.backlight.off { display: none; }
.fig.sil_master_prone, .fig.sil_challenger_prone {
  filter: drop-shadow(0 0 1px var(--paper-rim)) drop-shadow(0 0 1px var(--paper-rim))
    drop-shadow(0 0 2px var(--paper-rim));
}
/* 응수 창 (REQ-823) — 무대 하단 가장자리 전폭 게이지. 시간 압박은 무대에 속한 정보라
   실루엣을 보는 동안 주변시로 읽혀야 하고, 숫자 초로는 표기하지 않는다(초(招)↔초(秒) 충돌). */
.gauge { position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; height: 6px; background: var(--sunken); }
.gauge i {
  display: block; height: 100%; background: linear-gradient(90deg, var(--c5), var(--c4));
  box-shadow: 0 0 14px color-mix(in srgb, var(--c4) 55%, transparent);
}

.scene { position: relative; flex: none; height: var(--scene-h); overflow: hidden; }
.scene .sky { background: var(--scene-sky); }
.scene .ridge, .scene .bamboo { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .ridge .far { fill: var(--scene-ridge-far); }
.scene .ridge .near { fill: var(--scene-ridge-near); }
.scene .bamboo g { fill: none; stroke: var(--scene-bamboo); stroke-linecap: round; }
.scene .bamboo .stalk { stroke-width: 8; }
.scene .bamboo .leaf { stroke-width: 4; }
/* 미세 패럴랙스 (REQ-914) — 합성 프로퍼티만 흔들어 레이아웃·페인트가 다시 돌지 않는다.
   50fps 미만에서는 `app.mjs` 가 `.flat` 을 붙여 그 합성 비용마저 없앤다. */
.scene .ridge { animation: drift-ridge calc(var(--px-drift) * 1.6) ease-in-out infinite alternate; }
.scene .bamboo { animation: drift-bamboo var(--px-drift) ease-in-out infinite alternate; }
@keyframes drift-ridge {
  from { transform: translate3d(calc(-1 * var(--px-ridge)), 0, 0) }
  to { transform: translate3d(var(--px-ridge), 0, 0) }
}
@keyframes drift-bamboo {
  from { transform: translate3d(var(--px-bamboo), 0, 0) }
  to { transform: translate3d(calc(-1 * var(--px-bamboo)), 0, 0) }
}
.scene.flat .ridge, .scene.flat .bamboo { animation: none; transform: none; }
/* 움직임에 민감한 사용자에게는 프레임률과 무관하게 처음부터 없다. */
@media (prefers-reduced-motion: reduce) {
  .scene .ridge, .scene .bamboo { animation: none; transform: none; }
}
.scene .backlight.far { left: var(--glow-far-x); top: var(--glow-far-y); width: var(--glow-far-w); height: var(--glow-far-h); }
.scene .backlight.near { right: var(--glow-near-x); bottom: var(--glow-near-y); width: var(--glow-near-w); height: var(--glow-near-h); }
.scene .fig.far { left: var(--fig-far-x); top: var(--fig-far-y); width: var(--fig-far-w); }
.scene .fig.near { right: var(--fig-near-x); bottom: var(--fig-near-y); width: var(--fig-near-w); }
/* 쓰러진 쪽만 바닥 기준이다 — 서 있는 쪽처럼 바닥에 묶여야 무대를 접어도 몸이 표찰 위에 남는다 (#161). */
.scene .fig.far.sil_master_prone, .scene .fig.far.sil_challenger_prone {
  top: auto; bottom: var(--fig-prone-y);
}
/* 지켜보는 사부는 무대 밖 앞 구석에 서고 그 잘림이 카메라가 곧 사부의 시선임을 말한다
   (REQ-854). 판정 오버레이(z 8)보다 아래인 것은 관객이 판정을 가리면 안 되기 때문이다. */
.scene .fig.watcher { left: var(--watch-x); bottom: var(--watch-y); width: var(--watch-w); z-index: 4; }

/* 기력 (REQ-850) — 누가 누구인지를 색 그라디언트에만 맡기지 않는다 (REQ-856). */
.scene .vital { position: absolute; z-index: 5; display: flex; align-items: center; gap: 8px; }
.scene .vital .lbl { font-size: 12px; font-weight: 800; letter-spacing: 1px; color: var(--dim); }
.scene .vital .track {
  position: relative; flex: 1; height: 6px; overflow: hidden;
  background: var(--sunken); box-shadow: 0 0 0 1px var(--line) inset;
}
.scene .vital .fill { position: absolute; top: 0; bottom: 0; width: 100%; transition: width .25s; }
.scene .vital.far { left: 14px; top: 82px; width: 196px; }
.scene .vital.far .fill { left: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--c7) 55%, var(--c1)), var(--c7)); }
.scene .vital.near { right: 14px; bottom: 18px; width: 216px; flex-direction: row-reverse; }
.scene .vital.near .fill { right: 0; background: linear-gradient(270deg, color-mix(in srgb, var(--c4) 55%, var(--c1)), var(--c4)); }

/* 상대 예고 (REQ-822) — 아레나 최상단 가로 스트립. 중앙은 판정 오버레이의 자리라 비워 둔다. */
.scene .tele-slot { position: absolute; left: 12px; right: 12px; top: 10px; z-index: 6; }
.tele {
  display: flex; align-items: stretch; height: 62px; overflow: hidden;
  background: linear-gradient(90deg, color-mix(in srgb, var(--attr) 14%, transparent),
    color-mix(in srgb, var(--c1) 86%, transparent) 42%);
  border: 1px solid color-mix(in srgb, var(--attr) 50%, transparent);
  box-shadow: 0 0 22px color-mix(in srgb, var(--attr) 16%, transparent), 0 6px 18px var(--sunken);
  animation: tele-in .8s ease-out both;
}
@keyframes tele-in { from { opacity: 0; transform: translateY(-10px) } to { opacity: 1; transform: none } }
.tele.open { border-color: var(--gold); color: var(--gold); align-items: center; justify-content: center; font-weight: 700; }
.tele-attr {
  flex: 0 0 var(--hit-min); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; border-right: 1px solid color-mix(in srgb, var(--attr) 32%, transparent);
}
.tele-attr .an { font-size: 11px; font-weight: 800; color: var(--attr); }
.tele-id { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 12px; }
.tele-id .kr { font-size: 19px; font-weight: 800; letter-spacing: .5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tele-id .sub { display: flex; align-items: baseline; gap: 7px; }
.tele-win {
  flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 0 13px; border-left: 1px solid var(--line);
  background: color-mix(in srgb, var(--attr) 7%, transparent);
}
.tele-win .cap { font-size: 9px; letter-spacing: 2px; color: var(--dim); }
.tele-win .val { display: flex; align-items: center; gap: 5px; color: var(--attr); }
.tele-win b { font-size: 17px; font-weight: 800; }

/* 성장 고지는 판정 자리를 비켜 응수 창 바로 위에 앉는다 — 중앙에 두면 판정과 겹쳐 읽힌다. */
.scene .toast { position: absolute; left: 12px; right: 12px; bottom: 40px; z-index: 6; }

/* 무대 띠 (REQ-820·840·897) — 3단의 첫 칸을 쓰는 화면(대련·수련·파견)이 공유한다. 실전 중
   상황은 「누구와 몇 초째인가」뿐이라 재화·접근성 토글은 이 띠에 없다. */
.stage-band {
  flex: none; height: var(--band-h); display: flex; align-items: center; gap: 10px;
  padding: 0 14px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--c1) 70%, var(--shadow));
}
.stage-name { display: flex; align-items: baseline; gap: 7px; flex: 1; min-width: 0; }
.stage-name b { font-size: 16px; font-weight: 800; letter-spacing: .5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 상대가 아닌 것을 이름 자리에 세우는 화면만 갈래를 앞에 붙인다 (수련). */
.stage-name .cap { flex: none; font-size: 12px; letter-spacing: 1px; color: var(--dim); }
/* 차수 낙관 — 낙관은 주사(C5)의 자리다 (REQ-811). */
.stage-band .seal {
  flex: none; height: 24px; padding: 0 6px; border-radius: 2px;
  background: var(--c5); color: var(--c3); font-size: 12px; font-weight: 800;
  display: flex; align-items: center;
}
.exch { display: flex; align-items: baseline; gap: 1px; white-space: nowrap; }
.exch-n { font-size: 16px; font-weight: 800; color: color-mix(in srgb, var(--c3) 80%, transparent); }
.exch-u { font-size: 13px; font-weight: 800; color: var(--dim); }

.icons { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
.cand {
  display: flex; gap: 6px; align-items: center; padding: 8px 10px; min-height: var(--hit-min);
  border: 2px solid var(--attr); border-radius: 10px; background: var(--c2); color: var(--fg);
}
.cand.top { background: var(--raised); box-shadow: 0 0 0 2px var(--attr) inset; }
.cand.mini, .cand.big-icon { pointer-events: none; }
.cand.big-icon { font-size: 18px; padding: 14px 18px; }
.cand.picked { outline: 2px solid var(--gold); }
.cand.lit { animation: pop .3s ease-out; }
.cand-name { font-size: 13px; }

/* ══ S5 전수 (REQ-860~866) ══ 대치가 아니라 시범과 따라 하기라 무대가 아레나가 아닌 도장이고,
   둘 다 같은 방향을 본다 — 제자는 사부의 등 뒤에서 같은 자세를 잡는다 (REQ-860). */
.hall.transmit .fig, .hall.transmit .backlight { left: auto; transform: none; }
.hall.transmit .fig { transform: scaleX(-1); bottom: var(--tm-fig-y); }
.hall.transmit .fig.master { left: var(--tm-master-x); width: var(--tm-master-w); }
.hall.transmit .fig.pupil { right: var(--tm-pupil-x); width: var(--tm-pupil-w); }
.hall.transmit .backlight { bottom: var(--tm-glow-y); }
.hall.transmit .backlight.master {
  left: var(--tm-glow-master-x); width: var(--tm-glow-master-w); height: var(--tm-glow-master-h);
}
.hall.transmit .backlight.pupil {
  right: var(--tm-glow-pupil-x); width: var(--tm-glow-pupil-w); height: var(--tm-glow-pupil-h);
}
/* 몸통과 팔은 같은 캔버스를 겹쳐 쓴다 — 그래야 회전이 어깨에서 일어난 것으로 읽힌다 (REQ-861). */
.fig > .part {
  position: absolute; inset: 0;
  /* 배치는 개별 속성으로만 쓴다 — `background` 단축은 파츠마다 선언된 이미지를 none 으로 되돌린다 (#137). */
  background-position: center bottom; background-size: contain; background-repeat: no-repeat;
}
.fig.pupil > .part.arm { transform-origin: var(--tm-pupil-arm-origin); transition: transform var(--tm-follow-dur) ease-out; }
.fig.pupil.following > .part.arm { transform: rotate(var(--tm-follow-angle)); }

/* 무공 인장 (REQ-862·863) — 화면에서 유일하게 빛나는 것이고, 세로 조판이라 아래 목록이 부속이 된다. */
.sigil {
  position: absolute; left: 0; right: 0; top: var(--sigil-y); z-index: 4;
  display: flex; justify-content: center; align-items: flex-start; gap: 8px;
}
.sigil .kr {
  writing-mode: vertical-rl; text-orientation: upright; white-space: nowrap;
  font-size: var(--sigil-size); font-weight: 800; letter-spacing: 5px;
  text-shadow: 0 0 22px color-mix(in srgb, var(--c4) 50%, transparent), 0 3px 0 var(--sunken);
}
.sigil .hj.stacked { font-size: 13px; letter-spacing: 5px; padding-top: 4px; }

/* 이관 명세 (REQ-864) — 두 컬럼 diff 가 아니라 초식마다 한 줄이다. */
.transfer { flex: 1; min-height: 0; overflow-y: auto; padding: 11px 13px; }
.moves { display: flex; flex-direction: column; gap: 8px; }
.mv {
  padding: 9px 10px; background: var(--raised);
  border: 1px solid var(--line); border-left: 3px solid var(--attr);
}
.mv-top { display: flex; align-items: center; gap: 8px; }
.mv-bot { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.mv .nm { font-size: 15px; font-weight: 800; white-space: nowrap; }
.mv .rk { margin-left: auto; display: flex; align-items: baseline; gap: 7px; white-space: nowrap; }
.mv .seq { flex: none; display: flex; gap: 9px; font-size: 15px; line-height: 1; color: var(--dim); }
.mv .seq i { font-style: normal; }
.mv .steps { flex: 1; }
/* 사부의 성은 금, 제자의 성은 쾌의 청 — 건너간 값과 새로 시작하는 값이 색으로 갈린다 (REQ-864). */
.mv .from { font-size: 13px; font-weight: 800; color: var(--gold); }
.mv .arrow { font-size: 13px; color: var(--dim); }
.mv .to { font-size: 13px; font-weight: 800; color: var(--c6); }

/* ══ S6 결과 (REQ-870~878·892) ══ 상단 띠를 쓰지 않는 유일한 화면이라 무대가 y=0 에서 시작한다.
   정산부만 스크롤하고 확정 버튼은 그 패널 **밖**의 형제라, 유일한 출구가 잘리지 않는다 (REQ-878). */
.scene .brand {
  position: absolute; left: 0; right: 0; top: var(--brand-y); z-index: 6;
  text-align: center; pointer-events: none;
}
.scene .brand .hj {
  display: block; font-size: var(--brand-mark); font-weight: 800;
  color: currentColor; opacity: .5; letter-spacing: 8px; text-indent: 8px;
}
.scene .brand .word {
  display: block; margin: 0; font-size: var(--brand-size); font-weight: 800; line-height: .94;
  letter-spacing: 8px; text-indent: 8px;
  text-shadow: 0 0 52px color-mix(in srgb, currentColor 55%, transparent), 0 6px 0 var(--sunken);
}
.scene .brand.win { color: var(--gold); }
/* 패배는 막힘이라 C5(주사)를 쓴다 (REQ-811). */
.scene .brand.lose { color: var(--c5); }
/* 표찰에는 이름·한자·초 수만 싣는다 — 남은 기력은 끝난 판의 정보가 아니다 (REQ-878). */
.scene .foe-tag {
  position: absolute; left: 0; right: 0; bottom: 14px; z-index: 6;
  justify-content: center; text-align: center; font-size: 12px; color: var(--dim);
}
.scene .foe-tag b { font-size: 15px; font-weight: 800; color: var(--fg); }
.scene .foe-tag .sub { color: var(--hj-tone); }

.settle {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 12px 13px; display: flex; flex-direction: column; gap: 9px;
}
.settle .k { flex: none; font-size: 10px; letter-spacing: 3px; color: var(--dim); }
.settle .blk, .settle .ln {
  flex: none; padding: 9px 11px; background: var(--raised); border: 1px solid var(--line);
}
.settle .blk { display: flex; flex-direction: column; gap: 7px; }
.settle .ln { display: flex; align-items: center; gap: 9px; }
.settle .ln .v { margin-left: auto; font-size: 15px; font-weight: 800; text-align: right; }
.settle .ln .v .u { font-size: 11px; font-weight: 400; color: var(--dim); margin-left: 3px; }
.settle .ln.coin .v { color: var(--gold); }
/* 규칙을 빈칸이 아니라 문장으로 말하는 줄 — 값의 무게를 접어 문장으로 읽히게 한다 (REQ-876·877). */
.settle .ln.none .v { font-size: 12px; font-weight: 400; color: var(--dim); }

/* 판정 분포 6열 1행 (REQ-872) — 색 부호화는 S1 과 같은 이름을 부른다. */
.chips { display: grid; grid-template-columns: repeat(var(--chips, 6), 1fr); gap: 4px; }
.chips .c {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 2px;
  font-size: 10px; letter-spacing: -.2px; color: var(--rule);
  box-shadow: 0 0 0 1px var(--line) inset;
}
.chips .c.on { color: var(--fg); box-shadow: 0 0 0 1px color-mix(in srgb, var(--tone) 45%, transparent) inset; }
.chips .c b { font-size: 15px; font-weight: 800; line-height: 1; color: var(--tone); }
.chips .c.crush { --tone: var(--vd-tone-crush); }
.chips .c.advantage { --tone: var(--vd-tone-advantage); }
.chips .c.clash { --tone: var(--vd-tone-clash); }
.chips .c.disadvantage { --tone: var(--vd-tone-disadvantage); }
.chips .c.reversal { --tone: var(--vd-tone-reversal); }
.chips .c.struck { --tone: var(--vd-tone-struck); }

/* 결정타 (REQ-708) — 11·12성 계단의 유일한 인과라, 없는 판에서도 자리를 비우지 않는다. */
.settle .finish {
  flex: none; display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  border: 1px solid color-mix(in srgb, var(--c4) 34%, transparent);
  border-left: 3px solid var(--gold);
  background: linear-gradient(90deg, color-mix(in srgb, var(--c4) 13%, transparent), transparent);
}
.settle .finish .nm { font-size: 17px; font-weight: 800; }
.settle .finish.empty { border-color: var(--line); border-left-color: var(--line); background: var(--raised); }
.settle .finish.empty .nm { font-size: 15px; font-weight: 400; color: var(--dim); }

/* 성 변화 (REQ-873) — 발광한 칸이 이 판에서 번 것의 전부이자 정확한 양이다. */
.ranks { display: flex; flex-direction: column; gap: 6px; }
.ranks .rk {
  padding: 8px 10px; background: var(--raised);
  border: 1px solid var(--line); border-left: 3px solid var(--attr);
}
.rk-top { display: flex; align-items: center; gap: 8px; }
.rk-top .nm { font-size: 14px; font-weight: 800; }
.rk-top .move { margin-left: auto; display: flex; align-items: baseline; gap: 7px; white-space: nowrap; }
.rk-top .from, .rk-top .arrow { font-size: 13px; color: var(--dim); }
.rk-top .to { font-size: 16px; font-weight: 800; color: var(--gold); }
.ranks .rk .steps { margin-top: 8px; }

/* 고정 3블록과 조건부 블록의 경계 — 위는 늘 있고 아래는 있을 때만 있다 (REQ-871). */
.cond { display: flex; flex-direction: column; gap: 8px; padding-top: 9px; border-top: 1px solid var(--line); }
.loot .items { display: flex; flex-wrap: wrap; gap: 6px; }
.loot .it {
  display: flex; align-items: baseline; gap: 5px; padding: 3px 8px; font-size: 12px;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--c4) 35%, transparent) inset;
}
.loot .it b { font-size: 13px; font-weight: 800; color: var(--gold); }

/* 하단 확정 버튼 (REQ-865·878) — 스크롤 흐름 밖의 형제라 연출 중에도 정산이 길어도 늘 보인다. */
.acts {
  flex: none; display: flex; gap: 8px; padding: 11px 13px 13px;
  border-top: 1px solid var(--line); background: var(--panel);
}
.acts button {
  flex: 1; width: auto; height: var(--act-h); padding: 0;
  font-size: 16px; font-weight: 800; letter-spacing: 2px;
}
.acts button.primary { border-color: var(--gold); background: color-mix(in srgb, var(--c4) 15%, transparent); color: var(--gold); }
/* 연출 중의 건너뛰기는 출구가 아니라 대기의 단축이라, 금테를 쓰지 않는다 (REQ-865). */
.acts button.primary.weak { border-color: var(--line); background: var(--raised); color: var(--dim); }

/* 죽간과 그 곁판이 나눠 쓰는 행 — 죽간이 1매뿐인 화면에서 비는 자리가 곁판의 것이다 (REQ-843·844).
   흐름에서 뺀 매의 기준 상자이기도 하다 — 매수가 변해도 이 행의 폭·원점은 그대로다 (#138). */
.slip-row {
  position: relative;
  /* 가라앉는 매가 내려갈 음수 z 의 바닥 — 이 문맥이 없으면 그 매가 곁판 배경 아래로 빠진다 (#152). */
  isolation: isolate;
  flex: none; height: var(--slip-h); display: flex; align-items: stretch;
  justify-content: center; gap: var(--slip-gap);
}

/* 죽간 줄 (REQ-824) — 매수가 곧 폭이고, 그 계단이 「후보가 좁혀진다」의 표현이다. 그래서 이 줄은
   기준 상자가 될 수 없다 — 스스로 줄어들며 원점이 함께 움직인다 (#138). */
.tablets {
  flex: none; display: flex; justify-content: center; align-items: stretch;
  gap: var(--slip-gap); height: var(--slip-h);
}
.slip {
  position: relative; flex: none; width: var(--slip-w4); height: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 3px 7px; border: 1px solid var(--line); color: var(--fg);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c2) 88%, var(--c4)), var(--c2));
  transition: width .18s, transform .18s, box-shadow .18s, border-color .18s;
}
.tablets[data-n="1"] .slip { width: var(--slip-w1); }
.tablets[data-n="2"] .slip { width: var(--slip-w2); }
.tablets[data-n="3"] .slip { width: var(--slip-w3); }
/* 곁판이 선 줄에는 후보 계단이 없어 1매가 늘 최대 폭이 된다 — 정보를 싣지 않는 그 폭을 대련이
   가장 오래 머무는 4매 폭으로 되돌리고, 남는 자리는 곁판이 받는다 (REQ-843·844). */
.tablets[data-n="1"]:has(+ .detail) .slip { width: var(--slip-w4); }
.slip-head { flex: none; display: flex; align-items: center; gap: 5px; }
/* 탈락한 매의 성은 회색으로 죽고 살아있는 후보의 성만 금색으로 남는다 (REQ-827). */
.slip-rank { font-size: 11px; font-weight: 800; color: var(--gold); }
.slip.out .slip-rank { color: var(--dim); }
.slip-body { flex: 1; min-height: 0; display: flex; justify-content: center; gap: 2px; overflow: hidden; }
/* 한글이 주 표기이고 한자는 그 우측 세로열이라, 매 하나에 둘이 나란히 선다 (REQ-813·827). */
.slip-name {
  writing-mode: vertical-rl; text-orientation: upright; white-space: nowrap;
  font-size: 17px; font-weight: 800; letter-spacing: 2px;
}
.slip .hj.stacked { font-size: 9px; }
/* 꼬리표가 있고 없고에 따라 본문 높이가 달라지면 매수가 바뀔 때마다 이름이 위아래로 튄다. */
.slip-tags { flex: none; display: flex; gap: 3px; min-height: 14px; }
.slip.top { border-color: color-mix(in srgb, var(--attr) 45%, transparent); }
.slip.picked { outline: 2px solid var(--gold); }
/* 파해 유도 (REQ-855) — 금은 달성·확정의 색이고 유도는 그 예고라, 굳은 금테(`.picked` = 지시)와
   맥동으로 갈린다. 속성색을 쓰면 그 죽간의 속성 표시와 겹쳐 유도로 읽히지 않는다. */
/* 맥동은 그 초 내내 도는 애니메이션이라 `box-shadow` 를 흔들면 매 프레임 페인트가 다시 돈다.
   테두리를 지는 의사요소를 하나 두고 그 **불투명도만** 흔들면 합성만으로 끝난다 (REQ-913). */
.slip.beckon::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  box-shadow: 0 0 0 2px var(--gold) inset, 0 0 24px color-mix(in srgb, var(--c4) 50%, transparent);
  animation: beckon var(--beckon-dur) ease-in-out infinite;
}
@keyframes beckon { 0%, 100% { opacity: .3 } 50% { opacity: 1 } }
/* 1매 = 확정이라 그 순간이 화면에서 가장 큰 사건이 되게 한다 (REQ-824·826). */
.slip.only {
  border-color: var(--gold); transform: translateY(-3px) scale(1.05);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c4) 22%, var(--c1)), var(--c2));
  box-shadow: 0 0 0 1px var(--gold) inset, 0 0 26px color-mix(in srgb, var(--c4) 40%, transparent);
}
.slip.only .slip-name { font-size: 19px; }
/* 등장·탈락 (REQ-825) — 탈락한 매를 즉시 지우면 필터링 과정이 화면에서 사라진다. */
.slip.enter { animation: slip-in var(--slip-exit) ease-out both; }
/* 가라앉는 매는 흐름 밖으로 나간다 — 줄에 남으면 살아남은 매가 새 폭 계단으로 자랄 때 줄이
   넘쳐 금테 매가 중앙에서 밀린다. 좌표·폭은 떼어내는 순간 JS 가 인라인으로 박고, 그 좌표가
   서는 자리는 매수와 무관하게 불변인 `.slip-row` 다 (#138). */
.slip.out {
  position: absolute; top: 0; pointer-events: none;
  /* 사라지는 것은 항상 살아남은 것 아래다 — 문서 순서에 맡기면 탈락 매가 확정 매를 덮는다 (#152). */
  z-index: -1;
  animation: slip-out var(--slip-exit) ease-in forwards;
}
@keyframes slip-in { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
@keyframes slip-out {
  from { opacity: .45; filter: grayscale(1); transform: translateY(0) }
  to { opacity: 0; filter: grayscale(1) blur(1px); transform: translateY(10px) }
}

.toast { min-height: 20px; text-align: center; color: var(--gold); opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }

/* ══ 수련장 (REQ-840·842) ══ 3단 좌표는 아레나와 픽셀 단위로 같고, 무대만 산중이 아니라
   도장 안이다 — 전이를 만드는 것은 규칙의 동일함이 아니라 좌표의 동일함이다. */
.hall { position: relative; flex: none; height: var(--scene-h); overflow: hidden; }
.hall .floor { background: var(--hall-floor); }
/* 사부는 무대 정중앙에 선다 — 마주 설 상대가 없으므로 대각 대치의 두 자리가 성립하지 않는다. */
.hall .backlight {
  left: 50%; transform: translateX(-50%); bottom: var(--glow-hall-y);
  width: var(--glow-hall-w); height: var(--glow-hall-h);
}
.hall .fig { left: 50%; transform: translateX(-50%); bottom: var(--fig-hall-y); width: var(--fig-hall-w); }

/* ══ 구결 족자 (REQ-841·842) ══ 화면에서 유일하게 밝은 면이다 — 화선지(C9)를 글자색이 아니라
   표면으로 쓰는 유일한 자리이고, 상하 축과 주사 낙관이 그것을 족자로 만든다. */
.scroll { position: absolute; left: var(--scroll-x); right: var(--scroll-x); top: var(--scroll-y); z-index: 5; }
.scroll .rod {
  height: var(--scroll-rod-h); margin: 0 -6px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c9) 24%, var(--c1)), var(--c1) 60%, var(--shadow));
  box-shadow: 0 1px 0 color-mix(in srgb, var(--c3) 16%, transparent) inset, 0 3px 8px var(--sunken);
}
.scroll .silk {
  position: relative; padding: 12px calc(var(--seal-size) + 20px) 11px 14px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c3) 42%, var(--c9)), var(--c9));
  box-shadow: 0 8px 22px var(--sunken);
}
/* 창은 세 줄이고 그 안에서 목록만 흐른다 — 족자 높이가 구절 수를 따라가면 사부를 덮는다. */
.scroll .verse-win { height: calc(var(--verse-row-h) * 3); overflow: hidden; }
/* 화면은 몇 줄을 올릴지만 넘기고 픽셀 환산은 원장이 진다 — 행 높이와 이동량이 한 토큰이라 어긋날 수 없다. */
.scroll .verse-list {
  transform: translateY(calc(var(--verse-row-h) * var(--verse-shift, 1)));
  transition: transform var(--scroll-shift) ease;
}
/* 구절 하나가 방향 하나다 — 직전에 친 한 줄만 점등되고 앞으로 칠 구절은 흐리다 (REQ-841). */
.verse {
  display: flex; align-items: baseline; gap: 11px; height: var(--verse-row-h);
  font-size: 15px; line-height: var(--verse-line-h); font-weight: 800; color: var(--c1); opacity: .32;
}
/* 행이 상수 높이라 워드랩은 아래 행을 침범한다 — 넘치는 구절은 #168 해설과 같은 말줄임으로 접는다. */
.verse span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.verse.lit { opacity: 1; }
/* 흐르는 글을 못 읽는 손에는 줄 배정만 남기고 이동을 즉시 끝낸다. 미디어 쿼리는 위 전이 선언과
   특이도가 같아 순서로만 이기므로 블록을 앞으로 옮기면 조용히 진다. `.flat` 은 저프레임 강등
   스위치가 `.scene` 에만 붙어 수련 무대(`.hall`)에는 아직 닿지 않는, 그 스위치가 넓어질 때의 선언이다. */
.flat .scroll .verse-list { transition: none; }
@media (prefers-reduced-motion: reduce) {
  .scroll .verse-list { transition: none; }
}
.verse-dir { flex: none; width: 17px; text-align: center; font-style: normal; font-size: 16px; color: var(--c5); }
/* 낙관은 주사(C5)의 자리다 (REQ-811). */
.scroll .stamp {
  position: absolute; right: 12px; bottom: 10px;
  width: var(--seal-size); height: var(--seal-size); background: var(--c5);
  display: flex; align-items: center; justify-content: center;
}
.scroll .stamp .hj { color: var(--c3); font-size: 9px; letter-spacing: 0; }

/* ══ 수련 진척 (REQ-845) ══ S2 도장의 계단 언어를 상속한다 — 세는 것만 성이 아니라 그 성까지의
   완주 횟수다. 칸 수는 계단 비용이 정하므로 폭만 여기서 못박는다. */
.progress { position: absolute; left: var(--scroll-x); bottom: 22px; z-index: 5; display: flex; align-items: center; gap: 8px; }
.steps.visits { flex: none; }
.steps.visits .st { flex: none; width: var(--visit-w); }
.progress .cap { font-size: 11px; color: var(--rule); }
.progress .cap b { color: var(--gold); font-weight: 800; }

/* ══ 초식 해설 (REQ-844) ══ 파해 1:1 대응이 그동안 비급 구결에만 있었고, 수련은 그 초식만 보는
   유일한 화면이라 해설의 제자리다. 죽간이 1매뿐이라 비는 그 옆에 선다. */
.detail {
  /* 높이는 죽간 줄이 못박고 창안 줄은 접혀 자라므로, 넘치는 초는 테두리 밖이 아니라 안에서 잘린다. */
  flex: 1; min-width: 0; overflow: hidden; padding: 10px 11px;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c2) 92%, var(--c3)), var(--c2));
  display: flex; flex-direction: column; justify-content: center; gap: 8px;
}
.detail .ln { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
.detail .k { flex: none; width: 26px; font-size: 10px; letter-spacing: 2px; color: var(--hj-tone); }
.detail .v {
  min-width: 0; display: flex; align-items: baseline; gap: 3px;
  white-space: nowrap; overflow: hidden; font-size: 13px;
}
.detail .v b { font-weight: 800; }
/* 값이 넘칠 때 「잘렸다」가 아니라 「더 있다」로 읽히게 한다 (REQ-844). */
.detail .v > :not(.mark) { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
/* 속성 표식은 글자가 아니라 고정 크기 도형이라, 옆 값이 넘쳐도 그 몫을 내주지 않는다. */
.detail .v > .mark { flex: none; }
/* 창안자 이름과 유파명은 길이를 통제할 수 없어 한 줄에 담긴다는 보장이 없다 — 이 줄만 접히고,
   먼저 내려가는 것은 부제다 (REQ-844). */
.detail .v.wrap { flex-wrap: wrap; white-space: normal; }
.detail .sub { font-weight: 400; font-size: 11px; color: var(--dim); }

/* ══ 관전 손자리 (REQ-851·852·857) ══ 십자가 있던 자리를 비우고 제자의 판단으로 채운다 —
   빈자리가 결손이 아니라 의미인 유일한 화면이다. */
.judge {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 7px; text-align: center; padding: 0 8px;
}
.judge-cap { font-size: 10px; letter-spacing: 3px; color: var(--dim); }
.judge-now { margin: 0; font-size: 15px; font-weight: 800; }
.judge-now b { color: var(--gold); }
.judge-now .mark { margin-left: 4px; }
/* 지난 초는 자리를 늘 차지한다 — 첫 초에만 비면 그 아래 안내가 한 번 튄다. */
.judge-prev { margin: 0; min-height: 16px; font-size: 11px; color: var(--hj-tone); }
/* 선택이라는 사실은 바닥에 조용히 있어야 관전을 재촉하지 않는다 (REQ-857 · REQ-407). */
.handoff {
  flex: none; height: 32px; display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--rule); border-top: 1px solid var(--line);
}
.handoff b { color: var(--c6); font-weight: 800; }

/* 판정은 흐름 밖에서 뜬다 — 자리를 차지하면 문구 등장마다 아래 형제가 밀린다 (#40).
   오버레이·스크림·낙관은 화면과 함께 **1회 생성**되고 그 뒤로는 `.on` 하나로만 켜진다
   (REQ-913) — 판정마다 노드를 새로 만들면 그 생성·레이아웃이 판정 프레임에 겹친다. */
.verdict-overlay { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
/* 판정 스크림 (REQ-913·915) — 낙관 뒤를 눌러 글자를 무대에서 떼어낸다. 저사양 프레임 예산의
   측정 대상이 「흔들림 + 96px 글로우 + 스크림」이 겹치는 프레임이라, 이것이 그 세 번째 항이다. */
.vscrim {
  position: absolute; inset: 0; opacity: 0;
  background: radial-gradient(58% 34% at 50% 46%,
    color-mix(in srgb, var(--shadow) 80%, transparent), transparent 72%);
}
.verdict-overlay.on .vscrim { animation: verdict-scrim var(--vd-dur, .5s) ease-out forwards; }
@keyframes verdict-scrim { 0% { opacity: 0 } 20% { opacity: 1 } 70% { opacity: 1 } 100% { opacity: 0 } }
/* 위치가 승패 축이다 (REQ-814) — 오버레이 중심이 상쇄이고, 등급마다 그만큼 위·아래로 민다. */
.verdict-pop {
  position: absolute; left: 0; right: 0; top: 50%; padding: 0 12px; text-align: center;
  transform: translateY(calc(-50% + var(--vd-shift, 0px)));
  text-shadow: 0 2px 16px var(--shadow), 0 0 32px var(--shadow);
  /* 상주 노드라 평시에는 그리지 않는다 — 재생은 `.on` 이 붙는 동안만 있다. */
  opacity: 0;
}
.verdict-overlay.on .verdict-pop { animation: verdict-pop var(--vd-dur, .5s) ease-out forwards; }
/* 히트스톱 — 충격 순간 문자가 늦게 뜨는 것이 그 정지다. 늦은 만큼 재생을 줄여 총 길이가
   `--vd-dur` 를 넘지 않게 한다: 넘기면 판정이 다음 예고 위로 흘러든다 (spec § build-Plan 결정 사항). */
.verdict-overlay.on .verdict-pop.punched {
  animation-delay: var(--juice-hitstop);
  animation-duration: calc(var(--vd-dur, .5s) - var(--juice-hitstop));
}
/* 한글이 주 표기이고 한자는 그 위 낙관 격이라 크기·농도가 함께 내려간다 (REQ-813). */
.verdict-pop .hj {
  display: block; font-size: var(--vd-mark-size); font-weight: 800;
  letter-spacing: 6px; text-indent: 6px; color: inherit; opacity: .55;
}
/* 낙관이 없는 판정도 있다 (#46) — 상주 노드라 지우는 대신 감추므로, `display:block` 이
   기본 `[hidden]` 규칙을 이기지 않게 여기서 되돌린다. */
.verdict-pop .hj[hidden] { display: none; }
.verdict-label {
  display: block; font-size: var(--vd-size, var(--vd-size-clash)); font-weight: 800;
  line-height: .98; letter-spacing: 4px; text-indent: 4px;
}
/* 크기·색·위치의 3축을 등급마다 갈라 두는 자리 — 자형(한자) 축은 theme.mjs 의 마크가 진다.
   완파↔역파는 같은 수치의 부호만 달라 상하 대칭이 규칙으로 고정된다 (REQ-814). */
.verdict-pop.crush { --vd-size: var(--vd-size-extreme); --vd-shift: calc(-1 * var(--vd-shift-extreme)); color: var(--vd-tone-crush); }
.verdict-pop.advantage { --vd-size: var(--vd-size-mid); --vd-shift: calc(-1 * var(--vd-shift-mid)); color: var(--vd-tone-advantage); }
.verdict-pop.clash { --vd-size: var(--vd-size-clash); --vd-shift: var(--vd-shift-clash); color: var(--vd-tone-clash); }
.verdict-pop.disadvantage { --vd-size: var(--vd-size-mid); --vd-shift: var(--vd-shift-mid); color: var(--vd-tone-disadvantage); }
.verdict-pop.reversal { --vd-size: var(--vd-size-extreme); --vd-shift: var(--vd-shift-extreme); color: var(--vd-tone-reversal); }
.verdict-pop.struck { --vd-size: var(--vd-size-struck); --vd-shift: var(--vd-shift-struck); color: var(--vd-tone-struck); }
/* 수련 성공에는 등급이 없다 — 마크를 빌리면 「우세 판정」으로 오학습되므로 자리와 색만 상속한다 (#46). */
.verdict-pop.train-done { --vd-size: var(--vd-size-struck); --vd-shift: 0px; color: var(--c8); }
/* 위 .5s 는 폴백이고 실제 재생 시간은 show 가 인라인으로 덮는다 — 주입이 비어도 판정은 보여야 한다. */
@keyframes verdict-pop {
  0% { opacity: 0; transform: translateY(calc(-50% + var(--vd-shift, 0px))) scale(.6) }
  20% { opacity: 1; transform: translateY(calc(-50% + var(--vd-shift, 0px))) scale(1.1) }
  36% { transform: translateY(calc(-50% + var(--vd-shift, 0px))) scale(1) }
  100% { opacity: 0; transform: translateY(calc(-50% + var(--vd-shift, 0px))) scale(1); visibility: hidden }
}

/* 3단의 마지막 칸 (REQ-820·851) — 대련·수련은 여기에 손을 놓고(`.pad`), 파견은 손을 빼고
   제자의 판단을 놓는다(`.deck`). 껍데기가 같아야 그 비움이 결손이 아니라 의미로 읽힌다. */
.pad, .deck {
  flex: none; height: var(--input-h); border-top: 1px solid var(--line);
  padding: 0 13px 12px; display: flex; flex-direction: column;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 70%, var(--shadow)), var(--panel) 40%, var(--c1));
}
.pad.idle { opacity: .4; }
.pad.idle .cross button, .pad.idle .undo { pointer-events: none; }
/* 봇 점유 중 사람 입력은 무시되므로, 눌러도 되는 것처럼 보이지 않게 한다. */
.pad.bot { box-shadow: inset 0 2px 0 var(--gold); }
.pad.bot .cross button, .pad.bot .undo, .pad.bot .tablets { pointer-events: none; opacity: .6; }
/* 진행형 후보 색 — 입력부 상단 전폭 발광 띠 (REQ-828). JS 는 `color` 하나만 주고 발광은 그 파생이다. */
.pad-color {
  flex: none; height: 3px; margin: 0 -13px 11px;
  background: currentColor; box-shadow: 0 0 18px 1px currentColor; transition: color .18s;
}
.pad-color.none { color: var(--line); box-shadow: none; }
/* 입력 트레일 (REQ-828) — 「몇 번째 글자를 받고 있는가」가 화면에서 가장 중요한 피드백이다. */
.pad-trail { flex: none; height: 38px; margin-top: 11px; display: flex; align-items: center; justify-content: center; }
.pad-trail .arrows { gap: 16px; margin: 0; }
.pad-trail .arrows i { font-size: var(--trail-size); width: auto; }
/* 키패드는 화면 정중앙 (REQ-829) — 되돌리기는 이 십자 밖에 선다. */
.keys { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; }
.cross {
  display: grid; grid-template-columns: repeat(3, var(--key-w));
  grid-template-rows: repeat(2, var(--key-h)); gap: var(--key-gap);
}
.cross .key { width: 100%; height: 100%; min-width: var(--hit); min-height: var(--hit); padding: 0; font-size: 22px; }
.cross [data-dir="U"] { grid-area: 1 / 2; }
.cross [data-dir="L"] { grid-area: 2 / 1; }
.cross [data-dir="D"] { grid-area: 2 / 2; }
.cross [data-dir="R"] { grid-area: 2 / 3; }
/* 되돌리기는 오른쪽 화살표와 같은 행·같은 크기이고, 키 간격의 3배만큼 떨어져 별개 그룹으로
   읽힌다 — 오조작 비용이 정반대인 두 조작을 한 flex 행에 묶지 않는다 (REQ-829). */
.undo {
  position: absolute; top: calc(50% + var(--key-gap) / 2);
  left: calc(50% + (var(--key-w) * 3 + var(--key-gap) * 2) / 2 + var(--key-sep));
  width: var(--key-w); height: var(--key-h); min-width: var(--hit); min-height: var(--hit);
  padding: 0; display: flex; align-items: center; justify-content: center;
}
/* 무시가 쌓이면 되돌리기를 지목한다 — 유도가 아니라 막힘의 해소라 속성색으로 숨쉰다. */
.undo.urge { border-color: var(--gold); color: var(--gold); animation: urge .8s ease-in-out infinite; }
@keyframes urge { 0%, 100% { box-shadow: none } 50% { box-shadow: 0 0 14px 3px var(--gold) } }
.cross button.down, .undo:active { background: color-mix(in srgb, var(--c3) 14%, var(--c2)); transform: scale(.96); }
.shake { animation: shake .2s linear 1; }
@keyframes shake {
  0%, 100% { transform: translateX(0) } 25% { transform: translateX(-5px) }
  75% { transform: translateX(5px) }
}

/* ══ 도장 (REQ-830~837) ══ 홈은 「지금 무엇을 할 수 있나」의 요약이라 무대가 없다 — 정경은
   스크롤 밖 배너 한 장이고, 그 아래 본문만 넘친다. */
.dojo-banner {
  position: relative; flex: none; height: var(--dojo-banner-h); overflow: hidden;
  border-bottom: 1px solid var(--line);
}
.dojo-banner .floor { background: var(--dojo-floor); }
/* 배너는 무대보다 낮아 폭을 주면 머리가 잘린다 — 높이가 폭을 정하게 뒤집는다. */
.dojo-banner .fig { bottom: 0; width: auto; }
.dojo-banner .fig.master { left: var(--dojo-master-x); height: var(--dojo-master-h); }
.dojo-banner .fig.pupil { left: var(--dojo-pupil-x); height: var(--dojo-pupil-h); }
.plaque { position: absolute; left: 14px; top: 11px; display: flex; flex-direction: column; }
.plaque b { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
.pupil-tag {
  position: absolute; right: 12px; bottom: 8px; display: flex; align-items: baseline; gap: 5px;
  padding: 2px 8px; background: var(--sunken); box-shadow: 0 0 0 1px var(--line) inset; font-size: 12px;
}
.pupil-tag b { color: var(--gold); }
/* 잘림 대신 스크롤 (REQ-837) — 문구가 2줄로 접혀도 아래 블록이 조용히 잘리지 않는다. */
.body-flow {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; gap: 10px; padding: 11px 12px 12px;
}
/* 목록을 감싼 카드는 목록을 또 하나의 패널로 만든다 — 머리글 한 줄이 그 자리를 대신한다 (REQ-832). */
.art-head { display: flex; gap: 8px; align-items: baseline; }
.art-head .kr { font-size: 17px; letter-spacing: .5px; }
/* 다음 계단 안내 (REQ-830) — 적립 수단이 구간마다 바뀌는 규칙이 눈금 옆에서 읽힌다. */
.rank-next { margin: 5px 0 0; font-size: 11px; color: var(--rule); }
.rank-next.wall { color: color-mix(in srgb, var(--c5) 80%, var(--c3)); }

/* 제자 블록 (REQ-833) — 존재·정서는 정경 실루엣이 지고 여기는 조작·수치만 진다. */
.pupil-block {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px 11px;
  display: flex; flex-direction: column; gap: 8px;
}
.pb-head { display: flex; gap: 7px; align-items: baseline; }
.pb-head .ttl { font-size: 15px; letter-spacing: 1px; }
.pb-head .dim { margin-left: auto; }
.pb-train { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.pb-train .who { flex: none; color: var(--dim); white-space: nowrap; }
.pb-train .who b { color: var(--fg); font-weight: 700; }
.pb-train .meter { flex: 1; margin: 0; }
.pb-train .left { flex: none; color: var(--dim); white-space: nowrap; }
/* 넷을 붙여 놓아야 어느 초식이 뒤처졌는지 보이고, 그 비교가 곧 지정의 근거다. */
.pb-cols { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.pcol {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  min-height: var(--hit); padding: 6px 2px 5px; border: 0; border-top: 2px solid var(--attr);
  border-radius: 0; background: color-mix(in srgb, var(--c3) 3%, transparent);
}
.pcol .nm { font-size: 11px; color: var(--dim); letter-spacing: -.3px; }
.pcol .rk { font-size: 15px; font-weight: 700; }
/* 권장 성 미달 = 파견을 잠근 초식 — 막힘의 색이 잠금 사유와 같은 축을 쓴다 (REQ-811·836). */
.pcol.low { background: color-mix(in srgb, var(--c5) 13%, transparent); }
.pcol.low .rk { color: var(--c5); }
.pcol.training .nm { color: var(--c6); }

/* ══ 도전자 공개 (REQ-882~887) ══ S7 의 목록 행과 브리핑이 같은 조각을 쓴다 (REQ-835). */
.attrs { display: flex; flex-wrap: wrap; gap: 5px; }
.at {
  display: flex; align-items: center; gap: 4px; padding: 2px 7px; font-size: 11px;
  color: var(--dim); box-shadow: 0 0 0 1px var(--line) inset; border-radius: 4px;
}
/* 절초는 존재만으로 난이도 신호라 금색을 받는다 — 도전자 성은 어디에도 숫자로 뜨지 않는다 (REQ-887). */
.at.ult { color: var(--gold); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c4) 55%, transparent) inset; }
.at.unseen { letter-spacing: 1px; }
/* 절초 공개 3층 — 층마다 다른 것은 이 테두리 색 하나이고 문구는 theme.mjs 가 진다 (REQ-882~884). */
.tell {
  margin: 0; padding: 8px 10px; font-size: 12px; line-height: 1.5; color: var(--dim);
  background: color-mix(in srgb, var(--c3) 2%, transparent); border-left: 3px solid var(--line);
}
.tell b { color: var(--fg); font-weight: 700; }
.tell.rumor { background: color-mix(in srgb, var(--c5) 10%, transparent); border-left-color: var(--c5); }
.tell.rumor b { color: color-mix(in srgb, var(--c5) 70%, var(--c3)); }
.tell.tell-open { background: color-mix(in srgb, var(--c4) 9%, transparent); border-left-color: var(--gold); }
.tell.tell-open b { color: var(--gold); }

/* ══ S7 도전자 선택 (REQ-880·881) ══ 목록만 스크롤하고 브리핑·「대련 시작」은 바닥에 고정된다. */
.list {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; gap: 7px; padding: 11px 12px 12px;
}
.foe {
  position: relative; display: flex; gap: 11px; align-items: center; text-align: left;
  padding: 10px 12px; border-radius: 8px; border-left: 3px solid var(--line);
}
.foe.on { border-color: var(--gold); background: color-mix(in srgb, var(--c4) 9%, transparent); }
.foe .id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.foe .nm { display: flex; gap: 7px; align-items: baseline; min-width: 0; }
.foe .nm b { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.foe .state { flex: none; text-align: right; white-space: nowrap; }
.foe .state .t { display: block; font-size: 12px; font-weight: 700; }
.foe .state .s { display: block; margin-top: 2px; font-size: 11px; color: var(--rule); }
/* 이미 이긴 상대는 회색 보통 굵기다 — 주사색은 막힘 전용이라 여기 오지 않는다 (REQ-811·887). */
.foe .state.beat .t { font-weight: 400; color: var(--dim); }
.foe .state.now .t { color: var(--gold); }

.brief {
  flex: none; display: flex; flex-direction: column; gap: 8px;
  padding: 11px 12px 12px; border-top: 1px solid var(--line); background: var(--panel);
}
.brief .cap { font-size: 10px; letter-spacing: 3px; color: var(--dim); }
/* 첫 대면에는 브리핑이 설 자리에 「왜 없는가」가 대신 선다 (REQ-882). */
.unknown {
  padding: 12px; text-align: center; border: 1px dashed var(--line); border-radius: 8px;
}
.unknown .t { display: block; font-size: 14px; font-weight: 700; }
.unknown .s { display: block; margin-top: 5px; font-size: 11px; line-height: 1.5; color: var(--dim); }
/* 상대 초식과 내 슬롯은 나란히 설 뿐 선으로 이어지지 않는다 — 대응표는 만들지 않는다 (REQ-885). */
.foe-styles { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.fs {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 9px 4px 8px; border: 0; border-top: 2px solid var(--attr); border-radius: 0;
  background: color-mix(in srgb, var(--c3) 3%, transparent);
}
.fs .n { font-size: 14px; font-weight: 700; }
.fs .tag { border: 0; color: var(--gold); letter-spacing: 2px; }
.fs.ult { background: color-mix(in srgb, var(--c4) 10%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c4) 35%, transparent) inset; }
/* 슬롯은 대련 죽간과 같은 세로 카드로 서고, 칸이 늘면 폭이 아니라 스크롤이 받는다 (REQ-886·824).
   3칸은 한 줄에 들어가고 그 이상부터 마지막 매가 잘려 보이는 것이 스크롤 단서다. */
.slots {
  flex: none; display: flex; gap: var(--slip-gap); height: var(--slip-h);
  overflow-x: auto; scroll-snap-type: x mandatory;
}
.slots .slip { scroll-snap-align: start; }
/* 빈 칸도 같은 규격을 지켜야 칸 수가 카드 폭으로 읽힌다 — 비었다는 사실만 점선으로 갈린다. */
.slots .slip.empty { border-style: dashed; color: var(--dim); }
.slots .slip.empty .slip-name { font-size: 13px; font-weight: 400; letter-spacing: 1px; }
/* 경고 줄은 유무와 무관하게 한 줄을 차지한다 — 바닥 시트가 높이를 바꾸면 위 목록이 함께 흔들린다. */
.brief .warn { margin: 0; min-height: 17px; font-size: 11px; line-height: 17px; color: var(--dim); }
/* 슬롯 부족은 「없으면 무슨 일이 나는지」로 경고하고, 교체가 그것을 금색 확인으로 바꾼다 (REQ-886). */
.brief .warn.risk { color: color-mix(in srgb, var(--c5) 75%, var(--c3)); }
.brief .warn.ok { color: var(--gold); }
.brief .go {
  flex: none; min-height: var(--hit); border-color: var(--gold); color: var(--gold);
  background: color-mix(in srgb, var(--c4) 15%, transparent);
  font-size: 17px; font-weight: 700; letter-spacing: 4px;
}
</style>
</head>
<body>
<div id="frame">
  <div id="tools">
    <button id="exportBtn" class="ghost">로그 내보내기</button>
    <button id="botBtn" class="ghost">봇 v2 실행</button>
    <button id="cheatBtn" class="ghost" aria-pressed="false" aria-controls="cheat">개발자 치트</button>
    <!-- 폼 상태 복원이 새로고침 뒤 표시를 켜 두면 세션 값과 갈린다 — 그 값은 kill 판독 모집단을 가른다. -->
    <label><input id="a11y-window" type="checkbox" autocomplete="off"><span>응수 창 ×1.3 (쉬움)</span></label>
    <section id="cheat" class="cheat" hidden aria-label="개발자 치트"></section>
  </div>

  <div id="stagebox">
    <div id="stage">
      <div id="shell" class="shell"><div id="app"></div></div>
      <div id="live" class="sr-only" role="status" aria-live="polite"></div>
      <!-- 전환 낭독은 판정 낭독(#live)과 **다른** 리전이다 (#102) — 한 리전을 나눠 쓰면 같은
           프레임에 겹친 두 낭독 중 뒤가 앞을 덮는다. -->
      <div id="nav-live" class="sr-only" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>
<script>
// 모듈 그래프 로드 실패(밸런스 JSON 구문 오류·검증 throw)는 화면에 백지로만 드러나므로 문면을 남긴다.
(() => {
  function showFatal(text) {
    // 부팅에 성공한 뒤의 런타임 예외까지 덮으면 플레이 중 화면이 통째로 날아간다 — 백지일 때만 쓴다.
    const el = document.getElementById('app');
    if (!el || el.childNodes.length > 0) return;
    // 배율이 붙기 전의 무대는 감춰져 있고, 부팅이 죽으면 그 배율은 영영 안 붙는다 — 문면을
    // 남기려면 이 경로가 직접 걷어야 한다. 잘린 크기로 보이더라도 백지보다 낫다 (#187).
    const stage = document.getElementById('stage');
    if (stage) stage.style.visibility = 'visible';
    el.style.whiteSpace = 'pre-wrap';
    el.style.padding = '16px';
    el.textContent = text;
  }
  addEventListener('error', (e) => showFatal(e.error ? e.error.message
    : `모듈 로드 실패 — ${(e.target && e.target.src) || location.href}\n의존 모듈이 원인일 수 있다 — 로컬 서버로 열었는지, .json 이 application/json 으로 오는지 확인한다.`), true);
  addEventListener('unhandledrejection', (e) => showFatal(String((e.reason && e.reason.message) || e.reason)));
})();
</script>
<script type="module" src="src/ui/app.mjs"></script>
</body>
</html>
