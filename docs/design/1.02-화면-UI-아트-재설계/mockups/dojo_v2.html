<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>도장 v2 — 일대종사</title>
<style>
/* ── 서체 (S1 대련과 동일 계약) ── */
@font-face{font-family:'Dojo';src:url('assets/fonts/NanumMyeongjo-Regular.ttf') format('truetype');
  font-weight:400;font-display:block;
  unicode-range:U+0020-024F,U+2000-206F,U+20A0-20BF,U+1100-11FF,U+2190-21FF,U+3130-318F,U+AC00-D7AF,U+FF00-FFEF}
@font-face{font-family:'Dojo';src:url('assets/fonts/NanumMyeongjo-ExtraBold.ttf') format('truetype');
  font-weight:800;font-display:block;
  unicode-range:U+0020-024F,U+2000-206F,U+20A0-20BF,U+1100-11FF,U+2190-21FF,U+3130-318F,U+AC00-D7AF,U+FF00-FFEF}
@font-face{font-family:'Dojo';src:url('assets/fonts/NotoSerifKR-hanja-400.woff2') format('woff2');
  font-weight:400;font-display:block;unicode-range:U+3400-9FFF,U+F900-FAFF}
@font-face{font-family:'Dojo';src:url('assets/fonts/NotoSerifKR-hanja-800.woff2') format('woff2');
  font-weight:800;font-display:block;unicode-range:U+3400-9FFF,U+F900-FAFF}

:root{
  --ink-deep:#12100e; --ink-mid:#1e1a16; --paper:#e8dcc8;
  --gold:#c9a227; --seal:#a8332a;
  --swift:#5fb3e8; --force:#e05a4d; --still:#4fbf7f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#3a3632;display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:24px 0;font-family:'Dojo',serif}
.phone{position:relative;width:393px;height:852px;overflow:hidden;
  background:var(--ink-deep);color:var(--paper);
  box-shadow:0 18px 60px rgba(0,0,0,.55);display:flex;flex-direction:column}

/* 한자는 어디서나 보조 (횡단 결정 D-2) */
.hj{font-size:11px;font-weight:400;color:rgba(232,220,200,.32);letter-spacing:2px}
.spacer{flex:1}

/* ══ E1 상단 띠 ══ */
.topband{flex:0 0 50px;display:flex;align-items:center;gap:9px;padding:0 14px;
  background:#0a0908;border-bottom:1px solid rgba(232,220,200,.07);z-index:6}
.rank{display:flex;align-items:baseline;gap:6px}
.rank .stage{font-size:16px;font-weight:800;color:var(--gold);letter-spacing:.5px}
.rank .art{font-size:12px;color:rgba(232,220,200,.5)}
.coin{display:flex;align-items:baseline;gap:5px}
.coin .n{font-size:17px;font-weight:800}
.coin .u{font-size:11px;color:rgba(232,220,200,.45)}

/* ══ E2 도장 정경 배너 (v1 136 → 108, 성 축 정보에 세로를 넘긴다) ══ */
.banner{position:relative;flex:0 0 108px;overflow:hidden;
  border-bottom:1px solid rgba(232,220,200,.09)}
.banner .layer{position:absolute;inset:0;pointer-events:none}
.banner .sky{background:linear-gradient(180deg,#241d16 0%,#191410 58%,#100d0b 100%)}
.banner .glow{background:radial-gradient(58% 76% at 50% 34%, rgba(214,196,164,.20), rgba(214,196,164,0) 70%)}
.banner .vig{background:radial-gradient(110% 92% at 50% 40%, rgba(0,0,0,0) 42%, rgba(0,0,0,.7) 100%)}
.bfig{position:absolute;bottom:0;pointer-events:none}
.bfig svg{display:block;width:100%;height:auto}
.bfig .body{fill:#070605;stroke:rgba(232,220,200,.15);stroke-width:1}
.bfig.master{left:126px;width:74px}
.bfig.pupil{left:206px;width:56px;opacity:.92}
.pupil-tag{position:absolute;left:198px;bottom:8px;display:flex;align-items:baseline;gap:5px;
  padding:2px 7px;background:rgba(10,9,8,.72);box-shadow:0 0 0 1px rgba(232,220,200,.16) inset}
.pupil-tag .t{font-size:11px;color:rgba(232,220,200,.6)}
.pupil-tag b{font-size:13px;font-weight:800;color:var(--gold)}
.plaque{position:absolute;left:14px;top:11px;display:flex;flex-direction:column;gap:2px}
.plaque .t{font-size:15px;font-weight:800;letter-spacing:2px}
.plaque .s{font-size:10px;color:rgba(232,220,200,.42);letter-spacing:2px}

/* ══ 본문 ══ */
.body-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:11px 13px 0;display:flex;flex-direction:column;gap:9px}

/* E3 무공 머리글 — v1 의 카드 크롬을 벗겼다 (목록은 목록으로) */
.art-head{display:flex;align-items:baseline;gap:8px;padding:0 1px 1px}
.art-head .kr{font-size:17px;font-weight:800;letter-spacing:.5px}

/* E4 초식 목록 */
.moves{display:flex;flex-direction:column;gap:7px}
.move{position:relative;padding:8px 9px 8px 12px;background:rgba(232,220,200,.028);
  border:1px solid rgba(232,220,200,.08)}
.move::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.move.swift::before{background:var(--swift)}
.move.force::before{background:var(--force)}
.move.still::before{background:var(--still)}
.move.lock{opacity:.42}
.move.done{background:rgba(201,162,39,.045);border-color:rgba(201,162,39,.2)}
.move.done .rank-line,.move.lock .rank-line{display:none}
.move.done .rank-next{display:none}
.move-top .rank-badge{margin-left:2px}
.move-top{display:flex;align-items:center;gap:8px}
.move-top .nm{font-size:16px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.move-top .hj,.move-top .slot{white-space:nowrap}
.slot{padding:1px 6px;font-size:10px;letter-spacing:1px;color:rgba(232,220,200,.62);
  box-shadow:0 0 0 1px rgba(232,220,200,.2) inset}
.btns{margin-left:auto;display:flex;gap:6px}
.btn{position:relative;min-width:52px;height:30px;padding:0 9px;border:1px solid rgba(232,220,200,.18);
  background:rgba(232,220,200,.05);color:var(--paper);font-family:'Dojo',serif;
  font-size:13px;font-weight:800;cursor:pointer}
.btn::after{content:'';position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}
.btn.primary{border-color:var(--gold);background:rgba(201,162,39,.16);color:var(--gold)}
.btn.ghost{opacity:.4}
.seq{display:flex;gap:13px;margin-top:7px;padding-left:1px}
.seq span{font-size:18px;color:rgba(232,220,200,.42)}

/* 속성 기호 */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.gl{display:inline-block;flex:0 0 auto}
.gl.swift{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid var(--swift)}
.gl.force{width:13px;height:13px;border-radius:50%;background:var(--force)}
.gl.still{width:12px;height:12px;background:var(--still)}

/* ── E4-10 성 게이지 — 연속 막대 + 계단 눈금 12 (REQ-707) ── */
.rank-line{display:flex;align-items:center;gap:8px;margin-top:8px}
.rank-badge{flex:0 0 auto;min-width:38px;text-align:center;padding:2px 5px;
  font-size:13px;font-weight:800;color:var(--gold);
  box-shadow:0 0 0 1px rgba(201,162,39,.45) inset}
.rank-badge.max{background:var(--gold);color:#1a1408;box-shadow:none}
.steps{flex:1;display:flex;gap:2px;height:13px}
.st{position:relative;flex:1;background:rgba(0,0,0,.55);
  box-shadow:0 0 0 1px rgba(232,220,200,.1) inset;overflow:hidden}
.st i{position:absolute;left:0;top:0;bottom:0;width:0;
  background:linear-gradient(180deg,#e0bb3e,#9b7714)}
/* 8성 벽 — 수련이 끊기고 실전만 남는 경계 (REQ-706) */
.st.wall{margin-left:7px;
  box-shadow:0 0 0 1px rgba(232,220,200,.1) inset, -5px 0 0 0 var(--seal)}
/* 11·12 눈금은 형태를 달리한다 — 규칙이 화면에서 읽히게 (REQ-707) */
/* B5 — ◆✦ 는 서브셋 밖 글리프라 저가 기기에서 두부가 된다. 도형으로 그린다 */
.mk-d,.mk-s{display:block;background:currentColor}
.mk-d{width:5px;height:5px;transform:rotate(45deg)}
.mk-s{width:7px;height:7px;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)}
.st .mk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:9px;line-height:1;color:rgba(232,220,200,.34);z-index:1}
.st.on .mk{color:#1a1408}
.rank-next{margin-top:5px;font-size:11px;color:rgba(232,220,200,.66);letter-spacing:.2px}
.rank-next b{color:var(--gold);font-weight:800}
.rank-next.wallmsg b{color:var(--seal)}

/* ── E9 제자 블록 (전수 후) ── */
.pupil-block{background:linear-gradient(180deg,#1d1811,#151110);
  border:1px solid rgba(232,220,200,.12);padding:10px 11px 11px}
.pb-head{display:flex;align-items:baseline;gap:7px;margin-bottom:8px}
.pb-head .ttl{font-size:15px;font-weight:800;letter-spacing:1px}
.pb-train{display:flex;align-items:center;gap:8px}
.pb-train .who{font-size:12px;color:rgba(232,220,200,.62);white-space:nowrap}
.pb-train .who b{color:var(--paper);font-weight:800}
.pbar{flex:1;height:8px;background:rgba(0,0,0,.6);box-shadow:0 0 0 1px rgba(232,220,200,.12) inset}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#2f6f9c,var(--swift))}
.pb-train .left{font-size:11px;color:rgba(232,220,200,.45);white-space:nowrap}
.pb-cols{display:flex;gap:6px;margin-top:10px}
.pcol{flex:1;padding:6px 4px 5px;text-align:center;background:rgba(232,220,200,.03);
  border-top:2px solid rgba(232,220,200,.14)}
.pcol.swift{border-top-color:var(--swift)}
.pcol.force{border-top-color:var(--force)}
.pcol.still{border-top-color:var(--still)}
.pcol.low{background:rgba(168,51,42,.13)}
.pcol .nm{display:block;font-size:11px;color:rgba(232,220,200,.6);letter-spacing:-.3px}
.pcol .rk{display:block;font-size:15px;font-weight:800;margin-top:2px}
.pcol.low .rk{color:var(--seal)}
.pcol.training .nm{color:var(--swift)}

/* ── E10 다음 상대 ── */
.foe{background:linear-gradient(180deg,#1d1811,#151110);
  border:1px solid rgba(232,220,200,.12);padding:10px 11px}
.foe-head{display:flex;align-items:baseline;gap:7px}
.foe-head .ttl{font-size:12px;color:rgba(232,220,200,.5);letter-spacing:1px}
.foe-head .nm{font-size:16px;font-weight:800}
.rematch{margin-left:auto;padding:2px 7px;font-size:11px;font-weight:800;color:var(--seal);
  box-shadow:0 0 0 1px rgba(168,51,42,.55) inset}
.foe-arts{display:flex;gap:7px;align-items:center;margin-top:8px}
.foe-arts .a{display:flex;align-items:center;gap:5px;padding:3px 8px;
  background:rgba(232,220,200,.04);box-shadow:0 0 0 1px rgba(232,220,200,.1) inset;font-size:12px}
.foe-arts .a.ult{box-shadow:0 0 0 1px rgba(201,162,39,.5) inset;background:rgba(201,162,39,.1)}
.foe-note{margin-top:8px;font-size:11px;color:rgba(232,220,200,.5)}
.foe-note b{color:var(--gold);font-weight:800}

/* E6 유도 툴팁 */
.hint{flex:0 0 auto;margin:9px 13px 8px;padding:8px 11px;
  background:rgba(201,162,39,.1);border-left:3px solid var(--gold);
  font-size:12px;font-weight:800;color:var(--gold);letter-spacing:.3px}
.hint.warn{background:rgba(168,51,42,.13);border-left-color:var(--seal);color:#e3897f}

/* E7 하단 액션 바 */
.actions{flex:0 0 auto;display:flex;gap:7px;padding:0 13px 13px}
.act{flex:1;height:72px;border:1px solid rgba(232,220,200,.14);background:rgba(232,220,200,.04);
  color:var(--paper);font-family:'Dojo',serif;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 4px}
.act .t{font-size:18px;font-weight:800;letter-spacing:2px}
.act .c{font-size:10px;color:rgba(232,220,200,.42);letter-spacing:.2px;text-align:center;line-height:1.3}
.act.on{border-color:var(--gold);background:rgba(201,162,39,.14)}
.act.on .t{color:var(--gold)}
.act.off{opacity:.46}
.act.locked{border-color:rgba(168,51,42,.5)}
.act.locked .t{color:rgba(232,220,200,.45)}
.act.locked .c{color:#c4756c}

/* ── UI 요소 ID 주석 레이어 (/gamedev-ui v0.5 공용 스니펫) ── */
.ui-annotate-toggle{position:fixed;top:14px;right:14px;z-index:9999;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:13px;font-weight:700;color:#fff;background:#2563eb;border:none;border-radius:8px;padding:9px 14px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.ui-annotate-toggle:hover{background:#1d4ed8}
.ui-annotate-overlay{position:absolute;inset:0;z-index:999;pointer-events:none;display:none}
.ui-annotate-on .ui-annotate-overlay{display:block}
.ui-annotate-box{position:absolute;border:1.5px solid #2563eb;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.55)}
.ui-annotate-chip{position:absolute;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:11px;font-weight:800;line-height:1;color:#fff;background:#2563eb;border:1px solid rgba(255,255,255,.75);border-radius:4px;padding:3px 5px}
.ui-annotate-box.sub{border-color:#60a5fa;border-width:1px;border-style:dashed}
.ui-annotate-chip.sub{background:#60a5fa;font-size:9px;padding:2px 4px}
.ui-annotate-legend{margin-top:16px;width:393px;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:12px;color:#333;background:rgba(255,255,255,.72);border:1px solid #bbb;border-radius:10px;padding:10px 14px;display:none;column-count:2;column-gap:18px}
.ui-annotate-on-page .ui-annotate-legend{display:block}
.ui-annotate-legend div{break-inside:avoid;padding:2px 0}
.ui-annotate-legend b{color:#2563eb}
.ui-annotate-legend .sub b{color:#60a5fa}
.ui-annotate-legend .sub{padding-left:12px}
.ui-annotate-legend h4{column-span:all;font-size:11px;letter-spacing:1px;color:#888;margin:8px 0 4px;border-bottom:1px solid #ccc;padding-bottom:3px}
.ui-annotate-legend h4:first-child{margin-top:0}
.ui-annotate-swatch{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.2);vertical-align:-2px;margin-right:4px}
.ui-annotate-legend code{font-size:11px;color:#666}
body.ui-capture .ui-annotate-toggle,body.ui-capture .ui-annotate-legend{display:none!important}
body.ui-capture{display:block;min-height:0;padding:0}
body.ui-capture [data-artboard]{box-shadow:none}
</style>
</head>
<body>

<div class="phone" data-artboard id="phone">

  <!-- ══ E1 ══ -->
  <div class="topband" data-ui="E1:상단 띠">
    <div class="rank" data-ui="E1-1:단계 표기">
      <span class="stage" id="stageLbl">문하생</span>
      <span class="art" id="artLbl">유운검법</span>
    </div>
    <div class="spacer"></div>
    <div class="coin" data-ui="E1-2:재화">
      <span class="n" id="coinN">130</span><span class="u">냥</span>
    </div>
  </div>

  <!-- ══ E2 도장 정경 ══ -->
  <div class="banner" data-ui="E2:도장 정경">
    <div class="layer sky"></div>
    <svg class="layer" data-ui="E2-1:도장 내부 레이어" viewBox="0 0 393 118" preserveAspectRatio="none">
      <path d="M0 0 L393 0 L393 12 L0 12 Z" fill="#0b0907"/>
      <path d="M-6 12 L399 12 L369 22 L24 22 Z" fill="#0f0c0a"/>
      <rect x="8" y="20" width="15" height="98" fill="#0b0907"/>
      <rect x="370" y="20" width="15" height="98" fill="#0b0907"/>
      <g stroke="#1d1812" stroke-width="2" fill="none">
        <rect x="146" y="28" width="102" height="52"/>
        <path d="M180 28 V80 M214 28 V80 M146 45 H248 M146 63 H248"/>
      </g>
      <g stroke="#0b0907" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M42 78 H96 M46 78 V58 M92 78 V58"/>
        <path d="M52 60 L60 34 M68 60 L74 32 M84 60 L88 36"/>
      </g>
      <rect x="300" y="25" width="34" height="58" fill="#191410"/>
      <rect x="298" y="23" width="38" height="5" fill="#0b0907"/>
      <rect x="298" y="81" width="38" height="5" fill="#0b0907"/>
      <path d="M0 99 H393" stroke="#0a0807" stroke-width="2"/>
    </svg>
    <div class="layer glow"></div>

    <div class="bfig master" data-ui="E2-2:사부 실루엣">
      <svg viewBox="0 0 96 130">
        <circle class="body" cx="48" cy="21" r="10"/>
        <path class="body" d="M44 9 C 45 1, 52 1, 53 9 Z"/>
        <path class="body" d="M38 30 C 29 40, 26 66, 24 92 C 22 110, 18 120, 14 128
                               L 46 128 L 50 106 L 56 128 L 86 128
                               C 80 110, 76 84, 72 60 C 68 42, 62 34, 58 30 Z"/>
        <path class="body" d="M40 38 C 32 52, 28 70, 26 86 L 34 88 C 38 72, 44 54, 50 42 Z"/>
      </svg>
    </div>
    <div class="bfig pupil" data-ui="E2-3:제자 실루엣" id="pupilFig" style="display:none">
      <svg viewBox="0 0 74 104">
        <circle class="body" cx="37" cy="17" r="8"/>
        <path class="body" d="M30 24 C 23 32, 21 52, 19 72 C 18 86, 15 96, 12 102
                               L 35 102 L 38 84 L 43 102 L 66 102
                               C 62 88, 59 66, 56 48 C 53 34, 48 27, 45 24 Z"/>
      </svg>
    </div>

    <div class="layer vig"></div>
    <div class="plaque" data-ui="E2-4:도장 현판">
      <span class="t">도장</span><span class="s hj">道場</span>
    </div>
    <div class="pupil-tag" id="pupilTag" data-ui="E2-5:제자 상태" style="display:none">
      <span class="t">제자</span><b>수련 중</b>
    </div>
  </div>

  <!-- ══ 본문 ══ -->
  <div class="body-scroll">

    <div class="art-head" data-ui="E3:무공 머리글">
      <span class="kr" data-ui="E3-1:무공명">유운검법</span>
      <span class="hj">流雲劍法</span>
    </div>

    <div class="moves" data-ui="E4:초식 목록">

      <div class="move swift" data-ui="E4-1:초식 행" data-rank="8" data-prog=".45">
        <div class="move-top">
          <i class="gl swift" data-ui="E4-2:속성 기호"></i>
          <span class="nm" data-ui="E4-3:초식명">유운보</span><span class="hj">流雲步</span>
          <span class="slot" data-ui="E4-4:슬롯 배지">슬롯 1</span>
          <div class="btns">
            <button class="btn ghost" data-ui="E4-7:수련 버튼">수련</button>
            <button class="btn" data-ui="E4-8:장착·해제">해제</button>
          </div>
        </div>
        <div class="rank-line">
          <span class="rank-badge" data-ui="E4-12:성 배지">8성</span>
          <span class="steps" data-ui="E4-10:성 게이지"></span>
        </div>
        <div class="rank-next" data-ui="E4-11:다음 계단"></div>
        <div class="seq" data-ui="E4-9:시퀀스 (펼침)">
          <span>↓</span><span>→</span><span>↑</span>
        </div>
      </div>

      <div class="move force" data-rank="5" data-prog=".2">
        <div class="move-top">
          <i class="gl force"></i><span class="nm">적운압정</span><span class="hj">積雲壓頂</span>
          <span class="slot">슬롯 2</span>
          <div class="btns">
            <button class="btn primary">수련</button><button class="btn">해제</button>
          </div>
        </div>
        <div class="rank-line">
          <span class="rank-badge">5성</span><span class="steps"></span>
        </div>
        <div class="rank-next"></div>
      </div>

      <div class="move still" data-rank="4" data-prog=".7">
        <div class="move-top">
          <i class="gl still"></i><span class="nm">행운유수</span><span class="hj">行雲流水</span>
          <span class="slot">슬롯 3</span>
          <div class="btns">
            <button class="btn primary">수련</button><button class="btn">해제</button>
          </div>
        </div>
        <div class="rank-line">
          <span class="rank-badge">4성</span><span class="steps"></span>
        </div>

<script>
/* 성 계단 문구 — 「다음에 무엇이 열리는가」를 화면에 되돌린다 (v1 진단의 최대 결손) */
function nextStep(rank){
  if (rank === 0) return { t:'직전 초식 <b>5성</b>에서 열린다', warn:false };
  if (rank === 12) return { t:'<b>완벽히 깨달음</b> — 전수할 수 있다', warn:false };
  if (rank === 11) return { t:'다음 <b>12성</b> — 이 초식으로 완파 1회', warn:false };
  if (rank === 10) return { t:'다음 <b>11성</b> — 이 초식으로 결정타 1회', warn:false };
  if (rank >= 8)  return { t:'다음 <b>' + (rank+1) + '성</b> — 대련 유효 성공', warn:false };
  if (rank === 7) return { t:'다음 <b>8성</b> — 수련은 여기까지, 대련으로만', warn:true };
  if (rank === 6) return { t:'다음 <b>7성</b> — 원터치가 열린다', warn:false };
  if (rank === 4) return { t:'다음 <b>5성</b> — 파운현월이 열린다', warn:false };
  if (rank === 1) return { t:'다음 <b>2성</b> — 실전에 장착할 수 있다', warn:false };
  return { t:'다음 <b>' + (rank+1) + '성</b> — 수련·대련', warn:false };
}

/* E4-10 — 연속 막대 + 계단 눈금 12 (REQ-707). 8성 벽·11·12 눈금은 형태가 다르다 */
function paintSteps(el, rank, prog){
  var html = '';
  for (var i = 1; i <= 12; i++){
    var cls = 'st';
    if (i === 8) cls += ' wall';
    if (i <= rank) cls += ' on';
    var w = i <= rank ? 100 : (i === rank + 1 ? prog * 100 : 0);
    var mk = i === 11 ? '<i class="mk-d"></i>' : (i === 12 ? '<i class="mk-s"></i>' : '');
    html += '<span class="' + cls + '"><i style="width:' + w + '%"></i>' +
            (mk ? '<span class="mk" aria-hidden="true">' + mk + '</span>' : '') + '</span>';
  }
  el.innerHTML = html;
}

(function(){
  document.querySelectorAll('.move').forEach(function(m){
    var rank = parseInt(m.dataset.rank, 10);
    var prog = parseFloat(m.dataset.prog) || 0;
    paintSteps(m.querySelector('.steps'), rank, prog);
    var n = nextStep(rank);
    var nx = m.querySelector('.rank-next');
    nx.innerHTML = n.t;
    if (n.warn) nx.classList.add('wallmsg');
    if (rank === 12) m.classList.add('done');
    var b = m.querySelector('.rank-badge');
    if (rank === 12) b.classList.add('max');
    if (rank === 0) m.querySelector('.hj').after(b);
  });
})();
</script>

<script>
/* ?state=growth|disciple — 성장 중 (기본) / 전수 후 제자 수련 */
(function(){
  var st = new URLSearchParams(location.search).get('state') || 'growth';
  if (st !== 'disciple') return;

  document.getElementById('stageLbl').textContent = '고수';

    m.classList.remove('lock');

    if (i === 3 && !m.querySelector('.slot')){
      var s = document.createElement('span');
      s.className = 'slot'; s.textContent = '대기';
      m.querySelector('.hj').after(s);
    }
  });

  var h = document.getElementById('hint');
  h.className = 'hint warn';
  h.textContent = '행운유수가 뒤처졌다 — 5성이 되면 임무가 열린다';

  document.querySelector('.foe-head .hj').textContent = '月影門';

  document.querySelector('.foe-arts').innerHTML =

    '<span class="a"><i class="gl swift" style="border-left-width:5px;border-right-width:5px;border-bottom-width:9px"></i>쾌</span>' +
    '<span class="a ult">절초 월영자</span>';
  document.getElementById('foeNote').innerHTML =
    '절초는 <b>파운현월</b>로만 파해된다 — 다른 초식을 내면 역파를 맞는다';
  var duel = document.getElementById('actDuel');
  duel.querySelector('.c').textContent = '월영문 계승자';
  var tr = document.getElementById('actTransmit');
  tr.className = 'act off'; tr.disabled = true; tr.setAttribute('aria-disabled','true'); tr.querySelector('.c').textContent = '전수 완료';
  var dp = document.getElementById('actDispatch');

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var captureMode = params.has('capture');
  var startOn = params.has('annotate');
  if (captureMode) document.body.classList.add('ui-capture');

  var board = document.querySelector('[data-artboard]');
  var overlay = document.createElement('div');
  overlay.className = 'ui-annotate-overlay';
  board.appendChild(overlay);

  function buildBadges() {
    overlay.innerHTML = '';
    var legend = document.getElementById('uiLegend');
    legend.innerHTML = '';
    var h = document.createElement('h4'); h.textContent = 'UI 요소'; legend.appendChild(h);
    var boardRect = board.getBoundingClientRect();
    document.querySelectorAll('[data-ui]').forEach(function (el) {
      var parts = el.getAttribute('data-ui').split(':');
      var id = parts[0], name = parts[1] || '';
      var isSub = id.indexOf('-') > -1;
      var r = el.getBoundingClientRect();
      var top = r.top - boardRect.top, left = r.left - boardRect.left;
      var box = document.createElement('div');
      box.className = 'ui-annotate-box' + (isSub ? ' sub' : '');
      box.style.cssText = 'top:'+top+'px;left:'+left+'px;width:'+r.width+'px;height:'+r.height+'px;';
      overlay.appendChild(box);
      var chip = document.createElement('div');
      chip.className = 'ui-annotate-chip' + (isSub ? ' sub' : '');
      chip.textContent = id; chip.title = name;
      chip.style.cssText = 'top:'+Math.max(2,top-8)+'px;left:'+Math.max(2,left-6)+'px;';
      overlay.appendChild(chip);
      var row = document.createElement('div');
      if (isSub) row.className = 'sub';
      row.innerHTML = '<b>'+id+'</b> '+name;
      legend.appendChild(row);
    });
    var ledgerEl = document.getElementById('uiStyleLedger');
    if (ledgerEl) {
      var ledger = JSON.parse(ledgerEl.textContent);
      if (ledger.colors && ledger.colors.length) {
        var hc = document.createElement('h4'); hc.textContent = '배경·색상'; legend.appendChild(hc);
        ledger.colors.forEach(function (c) {
          var row = document.createElement('div');
          row.innerHTML = '<b>'+c.id+'</b> <span class="ui-annotate-swatch" style="background:'+c.value+'"></span>'+c.name+' <code>'+c.value+'</code>';
          legend.appendChild(row);
        });
      }
      if (ledger.fonts && ledger.fonts.length) {
        var hf = document.createElement('h4'); hf.textContent = '폰트'; legend.appendChild(hf);
        ledger.fonts.forEach(function (f) {
          var row = document.createElement('div');
          row.innerHTML = '<b>'+f.id+'</b> '+f.name+' — '+f.surface;
          legend.appendChild(row);
        });
      }
    }
  }

  var btn = document.createElement('button');
  btn.className = 'ui-annotate-toggle';
  function setState(on) {
    document.body.classList.toggle('ui-annotate-on', on);
    document.body.classList.toggle('ui-annotate-on-page', on);
    btn.textContent = on ? '요소 번호 숨기기' : '요소 번호 표시';
    btn.dataset.on = on ? '1' : '0';
  }
  btn.addEventListener('click', function () { setState(btn.dataset.on !== '1'); });
  document.body.appendChild(btn);

  window.addEventListener('load', function () { buildBadges(); setState(startOn); });
})();
</script>
