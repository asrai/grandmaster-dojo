<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>일대종사 一代宗師</title>
<!-- 본문 주력 서체는 첫 화면부터 전 표면을 그리므로, 스타일시트 파싱을 기다리지 않고 먼저 받는다 (REQ-803). -->
<link rel="preload" href="assets/fonts/NanumMyeongjo-subset-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/NanumMyeongjo-subset-800.woff2" as="font" type="font/woff2" crossorigin>
<!-- 한자 병기는 첫 화면부터 뜨므로 F2 도 함께 물린다 — 늦게 받으면 그 자리만 최대 block 기간 비어 보인다. -->
<link rel="preload" href="assets/fonts/NotoSerifKR-hanja-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/NotoSerifKR-hanja-800.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* 한글·라틴(F1)과 한자(F2)가 같은 패밀리 안에서 unicode-range 로 갈리므로, 한자 병기에 별도
   font-family 를 걸 자리가 없다 — 그래서 `font-display: block` 이 폴백 산세리프가 잠깐이라도
   표면에 뜨는 것을 막는 유일한 수단이다 (REQ-812). woff2 는 `scripts/subset-fonts.sh` 산출물. */
@font-face {
  font-family: 'Dojo'; src: url('assets/fonts/NanumMyeongjo-subset-400.woff2') format('woff2');
  font-weight: 400; font-display: block;
  unicode-range: U+0020-024F,U+1100-11FF,U+2000-206F,U+20A0-20BF,U+2190-21FF,U+25A0-25FF,U+3000-303F,U+3130-318F,U+AC00-D7AF,U+FF00-FFEF;
}
@font-face {
  font-family: 'Dojo'; src: url('assets/fonts/NanumMyeongjo-subset-800.woff2') format('woff2');
  font-weight: 800; font-display: block;
  unicode-range: U+0020-024F,U+1100-11FF,U+2000-206F,U+20A0-20BF,U+2190-21FF,U+25A0-25FF,U+3000-303F,U+3130-318F,U+AC00-D7AF,U+FF00-FFEF;
}
@font-face {
  font-family: 'Dojo'; src: url('assets/fonts/NotoSerifKR-hanja-400.woff2') format('woff2');
  font-weight: 400; font-display: block; unicode-range: U+3400-9FFF,U+F900-FAFF;
}
@font-face {
  font-family: 'Dojo'; src: url('assets/fonts/NotoSerifKR-hanja-800.woff2') format('woff2');
  font-weight: 800; font-display: block; unicode-range: U+3400-9FFF,U+F900-FAFF;
}

/* ══ 시각 토큰 원장 ══ 7화면·모든 컴포넌트가 상속하는 스타일 SoT 는 이 블록 하나이며,
   화면별 재정의를 두지 않는다 (spec § ①). 색·크기·타이밍의 수치는 전부 여기에만 있고
   아래 규칙과 JS 는 이름으로만 참조하므로, 튜닝이 이 한 곳에서 닫힌다.
   밸런스 tunable(`src/balance.data.json`)과는 다른 축이다 — 그쪽은 게임 규칙의 SoT 이고
   여기는 렌더 층의 SoT 다. 규칙 값이 렌더에 닿아야 하면 JS 가 변수로 주입한다(`--hit`·`--vd-dur`). */
:root {
  /* 색 9종 C1~C9 (REQ-810) — 화면·컴포넌트는 리터럴 색을 쓰지 않는다. */
  --c1: #12100e;  /* 먹 심 */
  --c2: #1e1a16;  /* 먹 중 */
  --c3: #e8dcc8;  /* 화선지 */
  --c4: #c9a227;  /* 금 */
  --c5: #a8332a;  /* 주사 — 막힘·경고 전용 (REQ-811) */
  --c6: #5fb3e8;  /* 쾌 */
  --c7: #e05a4d;  /* 강 */
  --c8: #4fbf7f;  /* 정 */
  --c9: #cdbb9c;  /* 화선지 면 */
  /* 그림자·스크림의 기준 — 팔레트의 색이 아니라 명도 축이라 C1~C9 와 별개로 둔다. */
  --shadow: #000;

  /* 역할 이름 — 규칙은 이쪽만 부르고, 어느 원장 색을 쓰는지는 이 표가 정한다. */
  --bg: var(--c1);
  --panel: var(--c2);
  --letterbox: color-mix(in srgb, var(--c1) 62%, var(--shadow));
  --fg: var(--c3);
  --dim: color-mix(in srgb, var(--c3) 55%, transparent);
  --line: color-mix(in srgb, var(--c3) 12%, transparent);
  --gold: var(--c4);
  --sunken: color-mix(in srgb, var(--shadow) 55%, transparent);
  --raised: color-mix(in srgb, var(--c3) 8%, var(--c2));
  --hit: 56px;  /* 부팅 직후 app.mjs 가 BALANCE.buttonHitPx 로 덮는다 — 첫 페인트 폴백이다 */

  /* 서체 역할 (REQ-812·813) — 한 패밀리 'Dojo' 안에서 unicode-range 가 F1/F2 를 가른다. */
  --font-body: 15px/1.5 'Dojo', serif;
  --hj-size: 12px;
  --hj-tone: color-mix(in srgb, var(--c3) 34%, transparent);

  /* 6단 판정 4중 부호화 (REQ-814) — 크기·위치 두 축의 수치. 완파↔역파는 같은 값의 부호만
     달라 상하 대칭이 규칙으로 고정된다. 색·자형 축은 아래 .verdict.* 와 theme.mjs 가 진다. */
  --vd-size-extreme: 96px;  /* 완파·역파 */
  --vd-size-mid: 66px;      /* 우세·열세 */
  --vd-size-clash: 54px;    /* 상쇄 */
  --vd-size-struck: 80px;   /* 피격 */
  --vd-shift-extreme: 84px;
  --vd-shift-mid: 44px;
  --vd-shift-clash: 0px;
  --vd-shift-struck: 116px;
  --vd-mark-size: 26px;

  /* juice — 극단 2등급(완파·역파)에만 배정된 축 (REQ-815). 히트스톱 80ms 는 실측 전 초기값이다. */
  --juice-hitstop: 80ms;
  --juice-shake: 420ms;
  /* 파해 유도 맥동 한 주기 (REQ-855) — 유도는 확정이 아니라 그 예고라 멈추지 않고 숨쉰다. */
  --beckon-dur: 1100ms;
  /* 확정 연출의 최소 표시 시간 (REQ-826) — 마지막 키가 「후보 1개 도달」과 「시퀀스 완주」를 겸하는
     초에만 물린다. 120ms 는 실측 전 초기값이고, 히트스톱과 함께 판정 재생 앞의 예산을 이룬다 —
     둘의 합이 재생을 남기는지는 app.mjs 부팅 단정이 문다. */
  --only-hold: 120ms;
  --slip-exit: 180ms;  /* 탈락 죽간이 흐려지며 가라앉는 시간 (REQ-825) */

  /* 3단 고정 (REQ-820) — 시안 실측 초기값이며 S3 수련이 같은 좌표를 상속한다 (REQ-840). */
  --band-h: 50px;
  --scene-h: 440px;
  --input-h: 362px;

  /* 아레나 (REQ-821) — S4 파견이 그대로, S6 결과가 높이만 접어 물려받는다 (REQ-850·875). */
  --scene-sky: radial-gradient(125% 78% at 50% 26%,
    color-mix(in srgb, var(--c1) 86%, var(--c3)) 0%,
    color-mix(in srgb, var(--c1) 94%, var(--c3)) 42%,
    color-mix(in srgb, var(--c1) 98%, var(--c3)) 72%, var(--c1) 100%);
  --scene-ridge-far: color-mix(in srgb, var(--c1) 90%, var(--c3));
  --scene-ridge-near: color-mix(in srgb, var(--c1) 96%, var(--c3));
  --scene-bamboo: color-mix(in srgb, var(--c1) 84%, var(--shadow));
  --scene-ground-h: 112px;
  --backlight: color-mix(in srgb, var(--c9) 30%, transparent);
  /* 사람이 서는 두 자리 — 대각 대치가 성립하는 좌표다 (REQ-821). */
  --fig-far-x: 34px;
  --fig-far-y: 112px;
  --fig-far-w: 126px;
  --fig-near-x: 14px;
  --fig-near-y: 30px;
  --fig-near-w: 176px;
  /* 역광은 실루엣보다 크고 어긋나 있다 — 뒤에서 비추는 빛이라 윤곽과 같은 상자가 아니다. */
  --glow-far-x: 22px;
  --glow-far-y: 112px;
  --glow-far-w: 170px;
  --glow-far-h: 200px;
  --glow-near-x: 2px;
  --glow-near-y: 34px;
  --glow-near-w: 220px;
  --glow-near-h: 238px;

  /* 죽간 (REQ-824·827) — 매수가 곧 폭이라 「좁혀진다」의 계단이 이 네 값이다. */
  --slip-w1: 172px;
  --slip-w2: 132px;
  --slip-w3: 104px;
  --slip-w4: 84px;
  --slip-h: 146px;
  --slip-gap: 7px;

  /* 키패드 (REQ-828·829) — 키 간격 대 되돌리기까지의 간격이 3배라 별개 그룹으로 읽힌다. */
  --key-w: 64px;
  --key-h: 58px;
  --key-gap: 7px;
  --key-sep: 21px;
  --trail-size: 28px;

  /* 성(成) 계단 (REQ-817) */
  --stair-h: 13px;
  --stair-gap: 2px;
  --stair-wall-gap: 7px;   /* 8성 벽이 앞 칸과 벌어지는 간격 */
  --stair-wall-w: 5px;     /* 그 사이에 서는 주사색 세로선의 두께 */
  --stair-glow: 7px;
  --visit-w: 22px;         /* 수련 회차 칸의 폭 (REQ-845) — 칸 수가 적어 늘리지 않고 못박는다 */

  /* 수련장 (REQ-840·842) — 3단 좌표는 아레나와 같고 무대만 도장 안이다. */
  --hall-floor: radial-gradient(120% 74% at 50% 30%,
    color-mix(in srgb, var(--c1) 88%, var(--c3)) 0%,
    color-mix(in srgb, var(--c1) 93%, var(--c3)) 46%,
    color-mix(in srgb, var(--c1) 97%, var(--c3)) 76%, var(--c1) 100%);
  --fig-hall-y: 22px;
  --fig-hall-w: 156px;
  --glow-hall-y: 24px;
  --glow-hall-w: 206px;
  --glow-hall-h: 222px;
  /* 구결 족자 (REQ-841·842) — 화면에서 유일하게 밝은 면이라 여기만 C9 를 표면으로 쓴다. */
  --scroll-x: 16px;
  --scroll-y: 12px;
  --scroll-rod-h: 10px;
  --seal-size: 26px;
  /* 지켜보는 사부 (REQ-854) — 무대 밖 앞 구석이라 좌표가 음수이고 그 잘림이 곧 사부의 시선이다. */
  --watch-x: -30px;
  --watch-y: -144px;
  --watch-w: 195px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100dvh; overflow: hidden; }
body {
  background: var(--bg); color: var(--fg); font: var(--font-body);
  overscroll-behavior: none;
}
#frame {
  position: relative; width: 100vw; height: 100dvh; overflow: hidden;
  display: flex; flex-direction: column;
  background: var(--letterbox);
}
/* 검증 도구는 무대와 겹치지 않는 자기 띠에 산다 — 겹치면 여백 0 인 창에서 도달 불가이거나 무대 스크린샷에 섞인다. */
#tools {
  position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 8px;
}
#tools[hidden] { display: none; }
#tools button { padding: 4px 8px; font-size: 12px; }
#tools button.urge { border-color: var(--gold); color: var(--gold); }
/* 치트 패널은 명시 토글로만 열리므로(REQ-781) 띠를 늘리지 않고 무대 위로 펼친다. */
#tools .cheat { position: absolute; top: 100%; left: 8px; z-index: 3; background: var(--c1); }

/* 스테이지 배율의 기준은 창이 아니라 이 상자다 — 도구 띠가 먹은 만큼은 무대가 쓸 수 없다. */
#stagebox { flex: 1; min-height: 0; container-type: size; display: grid; place-content: center; }
/* 논리 해상도를 393x852 로 못박고 상자에는 축소로만 맞춘다 — 내부 좌표가 창·기기와 무관해진다.
   무단위 배율이 필요한데 min() 은 길이와 수를 못 섞으므로 tan(atan2()) 로 길이비를 수로 환산한다. */
#stage {
  --k: min(tan(atan2(100cqw, 393px)), tan(atan2(100cqh, 852px)), 1);
  position: relative; width: 393px; height: 852px;
  transform: scale(var(--k)); transform-origin: center;
  background: var(--bg); border-radius: 18px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--line);
}
/* 흔들림이 걸리는 유일한 노드 — 스테이지는 `transform: scale(var(--k))` 를 이미 쓰므로 거기 걸면
   완파·역파마다 그 배율이 날아가 화면이 100% 로 튄다 (REQ-816). */
.shell { position: relative; height: 100%; }
.shell.punch { animation: punch-shake var(--juice-shake) var(--juice-hitstop) cubic-bezier(.36, .07, .19, .97) both; }
@keyframes punch-shake {
  10% { transform: translate(-6px, 3px) } 22% { transform: translate(5px, -4px) }
  36% { transform: translate(-4px, -2px) } 52% { transform: translate(3px, 3px) }
  70% { transform: translate(-2px, 1px) } 100% { transform: translate(0, 0) }
}
/* 화면이 통째로 소유하는 자리 — 전역 여백이 없어야 어떤 화면이든 y=0 부터 깔 수 있다 (REQ-802). */
#app { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
/* 플렉스 자식의 기본 min-width:auto 가 긴 한글 줄을 뷰포트 밖으로 밀어낸다. */
#app, .screen-body, .card, .row, .row-head, .row-name, .head, .meter-line > *, .tip-anchor { min-width: 0; }
/* 낭독 전용 층 — 스테이지 직속이라 화면이 파괴돼도 판정이 침묵하지 않는다 (REQ-807). */
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}

/* 폭에 따라 줄 수가 바뀌면 띠 높이가 흔들리므로 2줄 구조를 조립부에서 못박는다. */
.top-band {
  display: flex; flex-direction: column; justify-content: center; gap: 3px;
  height: 56px; padding: 0 14px; border-bottom: 1px solid var(--line); font-size: 13px;
  overflow: hidden;
}
.top-row { display: flex; gap: 10px; align-items: center; min-width: 0; white-space: nowrap; }
.top-row > * { overflow: hidden; text-overflow: ellipsis; }
/* 물러나기는 띠를 쓰는 화면의 좌측 첫 자리에 고정된다 (REQ-897) — 시각 크기는 두고 히트 영역만
   최소치까지 넓혀, 조판을 흔들지 않으면서 손가락에 닿는다. */
.leave {
  position: relative; flex: none; width: 28px; height: 28px; padding: 0;
  border: 0; background: none; color: var(--dim); font-size: 19px; line-height: 1;
}
.leave::after {
  content: ''; position: absolute; left: 50%; top: 50%;
  width: var(--hit); height: var(--hit); transform: translate(-50%, -50%);
}
.top-band .top-label { font-weight: 700; color: var(--gold); }
.top-band .top-coins { margin-left: auto; }
.top-band label { display: flex; gap: 4px; align-items: center; color: var(--dim); }

/* 본문 여백은 화면이 고른다 — 풀블리드 레이어가 y=0 에서 시작하려면 전역 규칙이 없어야 한다 (REQ-802). */
.screen-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.screen-body.padded { padding: 12px; gap: 12px; }

/* 바닥 밴드의 주인과 높이는 화면이 정한다 — 쓰지 않는 화면은 만들지 않으므로 자리도 남지 않는다. */
.bottom-band {
  position: relative; border-top: 1px solid var(--line); background: var(--panel);
  padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;
}
/* 밴드는 화면 맨 아래라 말풍선을 위로 띄우고, 기준 상자를 밴드로 올려 좁은 칸에서 접히지 않게 한다. */
.bottom-band .tip-anchor { position: static; }
.bottom-band .tip { top: auto; bottom: calc(100% + 4px); }
.band-actions { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.band-cell { display: flex; flex-direction: column; gap: 4px; }
.band-actions button { width: 100%; min-height: var(--hit); padding: 8px 4px; font-weight: 700; }
/* 부제는 잠금 여부와 무관하게 한 줄을 차지한다 — 밴드가 높이를 바꾸면 위 스크롤 영역이 함께 흔들린다. */
.band-sub {
  height: 16px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font-size: 11px; line-height: 16px; color: var(--dim); text-align: center;
}
.band-sim { width: 100%; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.card h2 { margin: 0 0 8px; font-size: 15px; }
.card p { margin: 6px 0; }
.head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.head button { margin-left: auto; }
.dim { color: var(--dim); font-size: 12px; }
/* 한자는 어디서나 한글 옆의 보조 표기다 (REQ-813). 화면의 한자 조판이 이 한 규칙에만 있어
   「한자 전면 제거」가 규칙 하나의 변경으로 닫힌다. */
.hj { font-size: var(--hj-size); font-weight: 400; color: var(--hj-tone); letter-spacing: 2px; }
/* 한글 우측 세로열 — 높이가 모자라면 조용히 2열로 접히므로 nowrap·overflow 가 한 세트다. */
.hj.stacked {
  writing-mode: vertical-rl; text-orientation: upright;
  white-space: nowrap; overflow: hidden; letter-spacing: 1px;
}
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--gold); color: var(--gold); font-size: 12px;
}
.badge.max { background: var(--gold); color: var(--c1); font-weight: 700; }
.tag { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

button {
  font: inherit; color: var(--fg); background: var(--raised); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px; cursor: pointer;
}
button:disabled { opacity: .35; cursor: default; }
button.primary { width: 100%; padding: 12px; font-weight: 700; }
button.small { padding: 5px 10px; font-size: 13px; }
button.ghost { background: transparent; }
.actions { display: flex; flex-direction: column; gap: 8px; }

.rows { display: flex; flex-direction: column; gap: 8px; }
.row {
  /* 말풍선의 기준 상자 — 헤더에 걸면 말풍선이 바로 아래 시퀀스 화살표를 덮는다. */
  position: relative;
  border: 1px solid var(--line); border-left: 3px solid var(--attr); border-radius: 8px; padding: 6px 8px;
}
.row.locked { opacity: .55; }
.row-head { display: flex; gap: 6px; align-items: center; min-height: 44px; }
.row-head button { min-height: 40px; }
/* 접기 토글은 진짜 버튼이라야 키보드로 닿는다 — 줄 이름 전체가 그 히트 영역이다. */
.row-name {
  flex: 1; display: flex; gap: 6px; align-items: center;
  text-align: left; background: transparent; border: 0; padding: 0;
}
/* 서브셋 원본인 나눔명조에 작은 삼각(U+25B8/25BE)이 없어 큰 삼각을 쓰고 크기로 줄인다 (REQ-804). */
.row-name::before { content: '\25B6'; color: var(--dim); font-size: 11px; }
.row.open .row-name::before { content: '\25BC'; }
.meter-line { display: flex; gap: 8px; align-items: center; }
.meter-line .meter { flex: 1; }

/* 흐름 밖 말풍선을 담을 뿐이라 앵커 자신의 크기는 안내 유무로 변하지 않는다. */
.tip-anchor { position: relative; display: flex; }
.row .tip-anchor { position: static; }
.tip {
  /* 아래 형제 위로 겹치므로, 포인터를 통과시켜야 그 형제의 탭을 가로채지 않는다. */
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 1;
  pointer-events: none; font-size: 12px;
  color: var(--gold); background: color-mix(in srgb, var(--c4) 14%, var(--c1)); border: 1px solid var(--gold);
  border-radius: 6px; padding: 2px 8px;
}
/* 지목의 주 신호 — 말풍선이 가려져도 어느 버튼을 누르라는 것인지는 테두리로 읽힌다. */
.tip-target { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.meter { height: 5px; background: var(--sunken); border-radius: 3px; margin: 6px 0; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--gold); }
/* 성(成) 계단 (REQ-817) — 화면마다 계단을 다시 짜면 같은 규칙이 화면 수만큼 갈라진다. */
.rank-gauge { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.steps { flex: 1 1 100%; display: flex; gap: var(--stair-gap); height: var(--stair-h); }
.st {
  /* 네 상태의 테두리·발광·벽을 이름으로 조립한다 — 조합 규칙이 어느 조각을 잃지 않게 (REQ-818). */
  --st-ring: 0 0 0 1px var(--line) inset;
  --st-lit: 0 0 0 1px color-mix(in srgb, var(--c4) 45%, transparent) inset;
  --st-glow: 0 0 0 1px var(--c4) inset, 0 0 var(--stair-glow) var(--c4);
  --st-wall: calc(-1 * var(--stair-wall-w)) 0 0 0 var(--c5);
  position: relative; flex: 1; background: var(--sunken); overflow: hidden;
  box-shadow: var(--st-ring);
}
.st > .fill {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0;
  background: linear-gradient(180deg, var(--c4), color-mix(in srgb, var(--c4) 60%, var(--c1)));
}
.st.on { box-shadow: var(--st-lit); }
/* 이번 판에 오른 칸 — 결과 화면이 「무엇이 올랐는가」를 이 발광 하나로 말한다. */
.st.gain { box-shadow: var(--st-glow); }
/* 8성 벽 — 수련이 끊기고 실전만 남는 경계라 C5(주사)가 맡는 막힘의 하나다 (REQ-706·811). */
.st.wall { margin-left: var(--stair-wall-gap); box-shadow: var(--st-ring), var(--st-wall); }
/* 벽 칸이 점등·발광 칸을 겸할 때 한쪽 box-shadow 가 다른 쪽을 통째로 덮으므로 둘을 합친다 (REQ-818). */
.st.on.wall { box-shadow: var(--st-lit), var(--st-wall); }
.st.gain.wall { box-shadow: var(--st-glow), var(--st-wall); }
/* 11·12 칸은 적립이 아니라 결정타·완파로 열린다 — 서브셋 밖 글리프(◆✦)가 두부가 되지 않도록
   같은 형태를 CSS 도형으로 그린다 (REQ-817). */
.st > .mk { position: absolute; inset: 0; margin: auto; color: var(--hj-tone); background: currentColor; }
.st.on > .mk { color: var(--c1); }
.st > .mk.finish { width: 5px; height: 5px; transform: rotate(45deg); }
.st > .mk.crush {
  width: 7px; height: 7px;
  clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
}
.cheat { margin-top: 6px; padding: 8px; border: 1px dashed var(--line); border-radius: 6px; background: var(--sunken); max-width: 320px; }
.cheat-rows { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
.cheat-row { display: flex; gap: 6px; align-items: center; font-size: 12px; }
.cheat-row input { width: 56px; background: var(--c1); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }

/* 아이콘은 id 로 참조된다 — 코드는 `icon-<id>` 클래스만 알고 파일 경로는 이 표에만 있어,
   후속 아트 개선이 파일 스왑으로 닫힌다 (REQ-931). 마스크로 그리므로 색은 글자색을 따라간다. */
.icon { flex: none; display: inline-block; width: 22px; height: 22px; background: currentColor; }
.icon-reset {
  mask: url('assets/icons/reset.svg') center / contain no-repeat;
  -webkit-mask: url('assets/icons/reset.svg') center / contain no-repeat;
}

.mark { font-size: 15px; line-height: 1; }
.mark.big { font-size: 24px; }
.arrows { display: flex; gap: 6px; margin: 4px 0; }
.arrows i { font-style: normal; font-size: 20px; width: 24px; text-align: center; color: color-mix(in srgb, var(--c3) 22%, transparent); }
.arrows i.on { color: var(--gold); }
.arrows i.hint { color: var(--dim); animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }

/* ══ 아레나 (REQ-821) ══ 이식된 무대. 상속이 곧 서사이므로(REQ-850·875) 화면이 갈아 끼우는
   축은 무대 높이·사람이 서는 자리·그 사람의 자세 셋뿐이고, 나머지 좌표는 여기 고정이다. */
/* 무대 공통 층 — 아레나(`.scene`)와 수련장(`.hall`)이 같은 정경 문법을 쓰므로, 자리만 각자
   정하고 재료는 여기 한 벌이다. */
.layer, .scenery { position: absolute; inset: 0; pointer-events: none; }
.mist {
  background: linear-gradient(180deg, transparent 34%,
    color-mix(in srgb, var(--c3) 9%, transparent) 50%, transparent 66%);
}
.vignette {
  background: radial-gradient(118% 80% at 50% 44%, transparent 34%,
    color-mix(in srgb, var(--shadow) 72%, transparent) 100%);
}
.ground {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--scene-ground-h); pointer-events: none;
  background: linear-gradient(180deg, transparent,
    color-mix(in srgb, var(--shadow) 50%, transparent) 55%,
    color-mix(in srgb, var(--shadow) 86%, transparent));
}
/* 역광 — 이것이 없으면 먹 실루엣이 어두운 배경에서 사라진다 (REQ-821). */
.backlight {
  position: absolute; border-radius: 50%; pointer-events: none;
  background: radial-gradient(closest-side, var(--backlight), transparent 72%);
}
/* 실루엣은 납품된 투명 PNG 다 (REQ-932) — 코드는 에셋 id·자세만 알고, 그 이름에서 파일로 가는
   표는 여기 한 곳뿐이라 후속 아트 개선이 파일 스왑으로 닫힌다 (REQ-931). */
.fig {
  position: absolute; pointer-events: none; aspect-ratio: 512 / 1024;
  background: center bottom / contain no-repeat;
}
.fig.sil_master_stance { background-image: url('assets/art/silhouettes/sil_master_stance.png'); }
.fig.sil_challenger_stance { background-image: url('assets/art/silhouettes/sil_challenger_stance.png'); }
.fig.sil_disciple_stance { background-image: url('assets/art/silhouettes/sil_disciple_stance.png'); }
.fig.sil_master_watch { background-image: url('assets/art/silhouettes/sil_master_watch.png'); }
/* 응수 창 (REQ-823) — 무대 하단 가장자리 전폭 게이지. 시간 압박은 무대에 속한 정보라
   실루엣을 보는 동안 주변시로 읽혀야 하고, 숫자 초로는 표기하지 않는다(초(招)↔초(秒) 충돌). */
.gauge { position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; height: 6px; background: var(--sunken); }
.gauge i {
  display: block; height: 100%; background: linear-gradient(90deg, var(--c5), var(--c4));
  box-shadow: 0 0 14px color-mix(in srgb, var(--c4) 55%, transparent);
}

.scene { position: relative; flex: none; height: var(--scene-h); overflow: hidden; }
.scene .sky { background: var(--scene-sky); }
.scene .ridge, .scene .bamboo { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .ridge .far { fill: var(--scene-ridge-far); }
.scene .ridge .near { fill: var(--scene-ridge-near); }
.scene .bamboo g { fill: none; stroke: var(--scene-bamboo); stroke-linecap: round; }
.scene .bamboo .stalk { stroke-width: 8; }
.scene .bamboo .leaf { stroke-width: 4; }
.scene .backlight.far { left: var(--glow-far-x); top: var(--glow-far-y); width: var(--glow-far-w); height: var(--glow-far-h); }
.scene .backlight.near { right: var(--glow-near-x); bottom: var(--glow-near-y); width: var(--glow-near-w); height: var(--glow-near-h); }
.scene .fig.far { left: var(--fig-far-x); top: var(--fig-far-y); width: var(--fig-far-w); }
.scene .fig.near { right: var(--fig-near-x); bottom: var(--fig-near-y); width: var(--fig-near-w); }
/* 지켜보는 사부는 무대 밖 앞 구석에 서고 그 잘림이 카메라가 곧 사부의 시선임을 말한다
   (REQ-854). 판정 오버레이(z 8)보다 아래인 것은 관객이 판정을 가리면 안 되기 때문이다. */
.scene .fig.watcher { left: var(--watch-x); bottom: var(--watch-y); width: var(--watch-w); z-index: 4; }

/* 기력 (REQ-850) — 누가 누구인지를 색 그라디언트에만 맡기지 않는다 (REQ-856). */
.scene .vital { position: absolute; z-index: 5; display: flex; align-items: center; gap: 8px; }
.scene .vital .lbl { font-size: 12px; font-weight: 800; letter-spacing: 1px; color: var(--dim); }
.scene .vital .track {
  position: relative; flex: 1; height: 6px; overflow: hidden;
  background: var(--sunken); box-shadow: 0 0 0 1px var(--line) inset;
}
.scene .vital .fill { position: absolute; top: 0; bottom: 0; width: 100%; transition: width .25s; }
.scene .vital.far { left: 14px; top: 82px; width: 196px; }
.scene .vital.far .fill { left: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--c7) 55%, var(--c1)), var(--c7)); }
.scene .vital.near { right: 14px; bottom: 18px; width: 216px; flex-direction: row-reverse; }
.scene .vital.near .fill { right: 0; background: linear-gradient(270deg, color-mix(in srgb, var(--c4) 55%, var(--c1)), var(--c4)); }

/* 상대 예고 (REQ-822) — 아레나 최상단 가로 스트립. 중앙은 판정 오버레이의 자리라 비워 둔다. */
.scene .tele-slot { position: absolute; left: 12px; right: 12px; top: 10px; z-index: 6; }
.tele {
  display: flex; align-items: stretch; height: 62px; overflow: hidden;
  background: linear-gradient(90deg, color-mix(in srgb, var(--attr) 14%, transparent),
    color-mix(in srgb, var(--c1) 86%, transparent) 42%);
  border: 1px solid color-mix(in srgb, var(--attr) 50%, transparent);
  box-shadow: 0 0 22px color-mix(in srgb, var(--attr) 16%, transparent), 0 6px 18px var(--sunken);
  animation: tele-in .8s ease-out both;
}
@keyframes tele-in { from { opacity: 0; transform: translateY(-10px) } to { opacity: 1; transform: none } }
.tele.open { border-color: var(--gold); color: var(--gold); align-items: center; justify-content: center; font-weight: 700; }
.tele-attr {
  flex: 0 0 44px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; border-right: 1px solid color-mix(in srgb, var(--attr) 32%, transparent);
}
.tele-attr .an { font-size: 11px; font-weight: 800; color: var(--attr); }
.tele-id { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 12px; }
.tele-id .kr { font-size: 19px; font-weight: 800; letter-spacing: .5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tele-id .sub { display: flex; align-items: baseline; gap: 7px; }
.tele-win {
  flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; padding: 0 13px; border-left: 1px solid var(--line);
  background: color-mix(in srgb, var(--attr) 7%, transparent);
}
.tele-win .cap { font-size: 9px; letter-spacing: 2px; color: var(--dim); }
.tele-win .val { display: flex; align-items: center; gap: 5px; color: var(--attr); }
.tele-win b { font-size: 17px; font-weight: 800; }

/* 성장 고지는 판정 자리를 비켜 응수 창 바로 위에 앉는다 — 중앙에 두면 판정과 겹쳐 읽힌다. */
.scene .toast { position: absolute; left: 12px; right: 12px; bottom: 40px; z-index: 6; }

/* 무대 띠 (REQ-820·840·897) — 3단의 첫 칸을 쓰는 화면(대련·수련·파견)이 공유한다. 실전 중
   상황은 「누구와 몇 초째인가」뿐이라 재화·접근성 토글은 이 띠에 없다. */
.stage-band {
  flex: none; height: var(--band-h); display: flex; align-items: center; gap: 10px;
  padding: 0 14px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--c1) 70%, var(--shadow));
}
.stage-name { display: flex; align-items: baseline; gap: 7px; flex: 1; min-width: 0; }
.stage-name b { font-size: 16px; font-weight: 800; letter-spacing: .5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 상대가 아닌 것을 이름 자리에 세우는 화면만 갈래를 앞에 붙인다 (수련). */
.stage-name .cap { flex: none; font-size: 12px; letter-spacing: 1px; color: var(--dim); }
/* 차수 낙관 — 낙관은 주사(C5)의 자리다 (REQ-811). */
.stage-band .seal {
  flex: none; height: 24px; padding: 0 6px; border-radius: 2px;
  background: var(--c5); color: var(--c3); font-size: 12px; font-weight: 800;
  display: flex; align-items: center;
}
.exch { display: flex; align-items: baseline; gap: 1px; white-space: nowrap; }
.exch-n { font-size: 16px; font-weight: 800; color: color-mix(in srgb, var(--c3) 80%, transparent); }
.exch-u { font-size: 13px; font-weight: 800; color: var(--dim); }

.icons { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
.cand {
  display: flex; gap: 6px; align-items: center; padding: 8px 10px; min-height: 44px;
  border: 2px solid var(--attr); border-radius: 10px; background: var(--c2); color: var(--fg);
}
.cand.top { background: var(--raised); box-shadow: 0 0 0 2px var(--attr) inset; }
.cand.mini, .cand.big-icon { pointer-events: none; }
.cand.big-icon { font-size: 18px; padding: 14px 18px; }
.cand.picked { outline: 2px solid var(--gold); }
.cand.lit { animation: pop .3s ease-out; }
.cand-name { font-size: 13px; }

.transmit .sides { display: flex; gap: 10px; }
.transmit .side { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.transmit .side.dark { opacity: .25; transition: opacity .6s; }
.transmit .side.dark.arrived { opacity: 1; border-color: var(--gold); }
/* 결과는 상단 띠가 없는 유일한 화면이라 무대가 스테이지 y=0 에서 곧장 시작한다 (REQ-802·870). */
.result-stage {
  padding: 28px 12px; text-align: center;
  background: var(--c2); border-bottom: 1px solid var(--line);
}
.result-stage h2 { margin: 0; font-size: 28px; }
.result-stage h2.win { color: var(--gold); }
/* 패배는 막힘이라 C5(주사)를 쓴다 (REQ-811). */
.result-stage h2.lose { color: var(--c5); }
.result-stage p { margin: 6px 0 0; }
.result-ledger { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.result-ledger ul { margin: 0; padding-left: 18px; }

/* 죽간과 그 곁판이 나눠 쓰는 행 — 죽간이 1매뿐인 화면에서 비는 자리가 곁판의 것이다 (REQ-843·844). */
.slip-row {
  flex: none; height: var(--slip-h); display: flex; align-items: stretch;
  justify-content: center; gap: var(--slip-gap);
}

/* 죽간 줄 (REQ-824) — 매수가 곧 폭이고, 그 계단이 「후보가 좁혀진다」의 표현이다. */
.tablets {
  position: relative; flex: none; display: flex; justify-content: center; align-items: stretch;
  gap: var(--slip-gap); height: var(--slip-h);
}
.slip {
  position: relative; flex: none; width: var(--slip-w4); height: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 3px 7px; border: 1px solid var(--line); color: var(--fg);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c2) 88%, var(--c4)), var(--c2));
  transition: width .18s, transform .18s, box-shadow .18s, border-color .18s;
}
.tablets[data-n="1"] .slip { width: var(--slip-w1); }
.tablets[data-n="2"] .slip { width: var(--slip-w2); }
.tablets[data-n="3"] .slip { width: var(--slip-w3); }
.slip-head { flex: none; display: flex; align-items: center; gap: 5px; }
/* 탈락한 매의 성은 회색으로 죽고 살아있는 후보의 성만 금색으로 남는다 (REQ-827). */
.slip-rank { font-size: 11px; font-weight: 800; color: var(--gold); }
.slip.out .slip-rank { color: var(--dim); }
.slip-body { flex: 1; min-height: 0; display: flex; justify-content: center; gap: 2px; overflow: hidden; }
/* 한글이 주 표기이고 한자는 그 우측 세로열이라, 매 하나에 둘이 나란히 선다 (REQ-813·827). */
.slip-name {
  writing-mode: vertical-rl; text-orientation: upright; white-space: nowrap;
  font-size: 17px; font-weight: 800; letter-spacing: 2px;
}
.slip .hj.stacked { font-size: 9px; }
/* 꼬리표가 있고 없고에 따라 본문 높이가 달라지면 매수가 바뀔 때마다 이름이 위아래로 튄다. */
.slip-tags { flex: none; display: flex; gap: 3px; min-height: 14px; }
.slip.top { border-color: color-mix(in srgb, var(--attr) 45%, transparent); }
.slip.picked { outline: 2px solid var(--gold); }
/* 파해 유도 (REQ-855) — 금은 달성·확정의 색이고 유도는 그 예고라, 굳은 금테(`.picked` = 지시)와
   맥동으로 갈린다. 속성색을 쓰면 그 죽간의 속성 표시와 겹쳐 유도로 읽히지 않는다. */
.slip.beckon { animation: beckon var(--beckon-dur) ease-in-out infinite; }
@keyframes beckon {
  0%, 100% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--c4) 35%, transparent) inset }
  50% { box-shadow: 0 0 0 2px var(--gold) inset, 0 0 24px color-mix(in srgb, var(--c4) 50%, transparent) }
}
/* 1매 = 확정이라 그 순간이 화면에서 가장 큰 사건이 되게 한다 (REQ-824·826). */
.slip.only {
  border-color: var(--gold); transform: translateY(-3px) scale(1.05);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c4) 22%, var(--c1)), var(--c2));
  box-shadow: 0 0 0 1px var(--gold) inset, 0 0 26px color-mix(in srgb, var(--c4) 40%, transparent);
}
.slip.only .slip-name { font-size: 19px; }
/* 등장·탈락 (REQ-825) — 탈락한 매를 즉시 지우면 필터링 과정이 화면에서 사라진다. */
.slip.enter { animation: slip-in var(--slip-exit) ease-out both; }
/* 가라앉는 매는 흐름 밖으로 나간다 — 줄에 남으면 살아남은 매가 새 폭 계단으로 자랄 때 줄이
   넘쳐 금테 매가 중앙에서 밀린다. 좌표·폭은 떼어내는 순간 JS 가 인라인으로 박는다. */
.slip.out {
  position: absolute; top: 0; pointer-events: none;
  animation: slip-out var(--slip-exit) ease-in forwards;
}
@keyframes slip-in { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
@keyframes slip-out {
  from { opacity: .45; filter: grayscale(1); transform: translateY(0) }
  to { opacity: 0; filter: grayscale(1) blur(1px); transform: translateY(10px) }
}

.toast { min-height: 20px; text-align: center; color: var(--gold); opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }

/* ══ 수련장 (REQ-840·842) ══ 3단 좌표는 아레나와 픽셀 단위로 같고, 무대만 산중이 아니라
   도장 안이다 — 전이를 만드는 것은 규칙의 동일함이 아니라 좌표의 동일함이다. */
.hall { position: relative; flex: none; height: var(--scene-h); overflow: hidden; }
.hall .floor { background: var(--hall-floor); }
/* 사부는 무대 정중앙에 선다 — 마주 설 상대가 없으므로 대각 대치의 두 자리가 성립하지 않는다. */
.hall .backlight {
  left: 50%; transform: translateX(-50%); bottom: var(--glow-hall-y);
  width: var(--glow-hall-w); height: var(--glow-hall-h);
}
.hall .fig { left: 50%; transform: translateX(-50%); bottom: var(--fig-hall-y); width: var(--fig-hall-w); }

/* ══ 구결 족자 (REQ-841·842) ══ 화면에서 유일하게 밝은 면이다 — 화선지(C9)를 글자색이 아니라
   표면으로 쓰는 유일한 자리이고, 상하 축과 주사 낙관이 그것을 족자로 만든다. */
.scroll { position: absolute; left: var(--scroll-x); right: var(--scroll-x); top: var(--scroll-y); z-index: 5; }
.scroll .rod {
  height: var(--scroll-rod-h); margin: 0 -6px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c9) 24%, var(--c1)), var(--c1) 60%, var(--shadow));
  box-shadow: 0 1px 0 color-mix(in srgb, var(--c3) 16%, transparent) inset, 0 3px 8px var(--sunken);
}
.scroll .silk {
  position: relative; padding: 12px calc(var(--seal-size) + 20px) 11px 14px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c3) 42%, var(--c9)), var(--c9));
  box-shadow: 0 8px 22px var(--sunken);
}
/* 구절 하나가 방향 하나다 — 친 만큼 점등되고 남은 구절은 흐려진다 (REQ-841). */
.verse {
  display: flex; align-items: baseline; gap: 11px; padding: 3px 0;
  font-size: 15px; font-weight: 800; color: var(--c1); opacity: .32;
}
.verse.lit { opacity: 1; }
.verse-dir { flex: none; width: 17px; text-align: center; font-style: normal; font-size: 16px; color: var(--c5); }
/* 낙관은 주사(C5)의 자리다 (REQ-811). */
.scroll .stamp {
  position: absolute; right: 12px; bottom: 10px;
  width: var(--seal-size); height: var(--seal-size); background: var(--c5);
  display: flex; align-items: center; justify-content: center;
}
.scroll .stamp .hj { color: var(--c3); font-size: 9px; letter-spacing: 0; }

/* ══ 수련 진척 (REQ-845) ══ S2 도장의 계단 언어를 상속한다 — 세는 것만 성이 아니라 그 성까지의
   완주 횟수다. 칸 수는 계단 비용이 정하므로 폭만 여기서 못박는다. */
.progress { position: absolute; left: var(--scroll-x); bottom: 22px; z-index: 5; display: flex; align-items: center; gap: 8px; }
.steps.visits { flex: none; }
.steps.visits .st { flex: none; width: var(--visit-w); }
.progress .cap { font-size: 11px; color: var(--dim); }
.progress .cap b { color: var(--gold); font-weight: 800; }

/* ══ 초식 해설 (REQ-844) ══ 파해 1:1 대응이 그동안 비급 구결에만 있었고, 수련은 그 초식만 보는
   유일한 화면이라 해설의 제자리다. 죽간이 1매뿐이라 비는 그 옆에 선다. */
.detail {
  flex: 1; min-width: 0; padding: 10px 11px;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, color-mix(in srgb, var(--c2) 92%, var(--c3)), var(--c2));
  display: flex; flex-direction: column; justify-content: center; gap: 8px;
}
.detail .ln { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
.detail .k { flex: none; width: 26px; font-size: 10px; letter-spacing: 2px; color: var(--hj-tone); }
.detail .v {
  min-width: 0; display: flex; align-items: baseline; gap: 3px;
  white-space: nowrap; overflow: hidden; font-size: 13px;
}
.detail .v b { font-weight: 800; }
.detail .sub { font-weight: 400; font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; }

/* ══ 관전 손자리 (REQ-851·852·857) ══ 십자가 있던 자리를 비우고 제자의 판단으로 채운다 —
   빈자리가 결손이 아니라 의미인 유일한 화면이다. */
.judge {
  flex: 1; min-height: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 7px; text-align: center; padding: 0 8px;
}
.judge-cap { font-size: 10px; letter-spacing: 3px; color: var(--hj-tone); }
.judge-now { margin: 0; font-size: 15px; font-weight: 800; }
.judge-now b { color: var(--gold); }
.judge-now .mark { margin-left: 4px; }
/* 지난 초는 자리를 늘 차지한다 — 첫 초에만 비면 그 아래 안내가 한 번 튄다. */
.judge-prev { margin: 0; min-height: 16px; font-size: 11px; color: var(--hj-tone); }
/* 선택이라는 사실은 바닥에 조용히 있어야 관전을 재촉하지 않는다 (REQ-857 · REQ-407). */
.handoff {
  flex: none; height: 32px; display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--dim); border-top: 1px solid var(--line);
}
.handoff b { color: var(--c6); font-weight: 800; }

/* 판정은 흐름 밖에서 뜬다 — 자리를 차지하면 문구 등장마다 아래 형제가 밀린다 (#40). */
.verdict-overlay { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
/* 위치가 승패 축이다 (REQ-814) — 오버레이 중심이 상쇄이고, 등급마다 그만큼 위·아래로 민다. */
.verdict-pop {
  position: absolute; left: 0; right: 0; top: 50%; padding: 0 12px; text-align: center;
  transform: translateY(calc(-50% + var(--vd-shift, 0px)));
  text-shadow: 0 2px 16px var(--shadow), 0 0 32px var(--shadow);
  animation: verdict-pop var(--vd-dur, .5s) ease-out forwards;
}
/* 히트스톱 — 충격 순간 문자가 늦게 뜨는 것이 그 정지다. 늦은 만큼 재생을 줄여 총 길이가
   `--vd-dur` 를 넘지 않게 한다: 넘기면 판정이 다음 예고 위로 흘러든다 (spec § build-Plan 결정 사항). */
.verdict-pop.punched {
  animation-delay: var(--juice-hitstop);
  animation-duration: calc(var(--vd-dur, .5s) - var(--juice-hitstop));
}
/* 한글이 주 표기이고 한자는 그 위 낙관 격이라 크기·농도가 함께 내려간다 (REQ-813). */
.verdict-pop .hj {
  display: block; font-size: var(--vd-mark-size); font-weight: 800;
  letter-spacing: 6px; text-indent: 6px; color: inherit; opacity: .55;
}
.verdict-label {
  display: block; font-size: var(--vd-size, var(--vd-size-clash)); font-weight: 800;
  line-height: .98; letter-spacing: 4px; text-indent: 4px;
}
/* 크기·색·위치의 3축을 등급마다 갈라 두는 자리 — 자형(한자) 축은 theme.mjs 의 마크가 진다.
   완파↔역파는 같은 수치의 부호만 달라 상하 대칭이 규칙으로 고정된다 (REQ-814). */
.verdict-pop.crush { --vd-size: var(--vd-size-extreme); --vd-shift: calc(-1 * var(--vd-shift-extreme)); color: var(--c4); }
.verdict-pop.advantage { --vd-size: var(--vd-size-mid); --vd-shift: calc(-1 * var(--vd-shift-mid)); color: var(--c6); }
.verdict-pop.clash { --vd-size: var(--vd-size-clash); --vd-shift: var(--vd-shift-clash); color: color-mix(in srgb, var(--c3) 82%, transparent); }
.verdict-pop.disadvantage { --vd-size: var(--vd-size-mid); --vd-shift: var(--vd-shift-mid); color: color-mix(in srgb, var(--c7) 80%, var(--c1)); }
.verdict-pop.reversal { --vd-size: var(--vd-size-extreme); --vd-shift: var(--vd-shift-extreme); color: var(--c7); }
.verdict-pop.struck { --vd-size: var(--vd-size-struck); --vd-shift: var(--vd-shift-struck); color: color-mix(in srgb, var(--c7) 60%, var(--c1)); }
/* 수련 성공에는 등급이 없다 — 마크를 빌리면 「우세 판정」으로 오학습되므로 자리와 색만 상속한다 (#46). */
.verdict-pop.train-done { --vd-size: var(--vd-size-struck); --vd-shift: 0px; color: var(--c8); }
/* 위 .5s 는 폴백이고 실제 재생 시간은 show 가 인라인으로 덮는다 — 주입이 비어도 판정은 보여야 한다. */
@keyframes verdict-pop {
  0% { opacity: 0; transform: translateY(calc(-50% + var(--vd-shift, 0px))) scale(.6) }
  20% { opacity: 1; transform: translateY(calc(-50% + var(--vd-shift, 0px))) scale(1.1) }
  36% { transform: translateY(calc(-50% + var(--vd-shift, 0px))) scale(1) }
  100% { opacity: 0; transform: translateY(calc(-50% + var(--vd-shift, 0px))) scale(1); visibility: hidden }
}

/* 3단의 마지막 칸 (REQ-820·851) — 대련·수련은 여기에 손을 놓고(`.pad`), 파견은 손을 빼고
   제자의 판단을 놓는다(`.deck`). 껍데기가 같아야 그 비움이 결손이 아니라 의미로 읽힌다. */
.pad, .deck {
  flex: none; height: var(--input-h); border-top: 1px solid var(--line);
  padding: 0 13px 12px; display: flex; flex-direction: column;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 70%, var(--shadow)), var(--panel) 40%, var(--c1));
}
.pad.idle { opacity: .4; }
.pad.idle .cross button, .pad.idle .undo { pointer-events: none; }
/* 봇 점유 중 사람 입력은 무시되므로, 눌러도 되는 것처럼 보이지 않게 한다. */
.pad.bot { box-shadow: inset 0 2px 0 var(--gold); }
.pad.bot .cross button, .pad.bot .undo, .pad.bot .tablets { pointer-events: none; opacity: .6; }
/* 진행형 후보 색 — 입력부 상단 전폭 발광 띠 (REQ-828). JS 는 `color` 하나만 주고 발광은 그 파생이다. */
.pad-color {
  flex: none; height: 3px; margin: 0 -13px 11px;
  background: currentColor; box-shadow: 0 0 18px 1px currentColor; transition: color .18s;
}
.pad-color.none { color: var(--line); box-shadow: none; }
/* 입력 트레일 (REQ-828) — 「몇 번째 글자를 받고 있는가」가 화면에서 가장 중요한 피드백이다. */
.pad-trail { flex: none; height: 38px; margin-top: 11px; display: flex; align-items: center; justify-content: center; }
.pad-trail .arrows { gap: 16px; margin: 0; }
.pad-trail .arrows i { font-size: var(--trail-size); width: auto; }
/* 키패드는 화면 정중앙 (REQ-829) — 되돌리기는 이 십자 밖에 선다. */
.keys { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; }
.cross {
  display: grid; grid-template-columns: repeat(3, var(--key-w));
  grid-template-rows: repeat(2, var(--key-h)); gap: var(--key-gap);
}
.cross .key { width: 100%; height: 100%; min-width: var(--hit); min-height: var(--hit); padding: 0; font-size: 22px; }
.cross [data-dir="U"] { grid-area: 1 / 2; }
.cross [data-dir="L"] { grid-area: 2 / 1; }
.cross [data-dir="D"] { grid-area: 2 / 2; }
.cross [data-dir="R"] { grid-area: 2 / 3; }
/* 되돌리기는 오른쪽 화살표와 같은 행·같은 크기이고, 키 간격의 3배만큼 떨어져 별개 그룹으로
   읽힌다 — 오조작 비용이 정반대인 두 조작을 한 flex 행에 묶지 않는다 (REQ-829). */
.undo {
  position: absolute; top: calc(50% + var(--key-gap) / 2);
  left: calc(50% + (var(--key-w) * 3 + var(--key-gap) * 2) / 2 + var(--key-sep));
  width: var(--key-w); height: var(--key-h); min-width: var(--hit); min-height: var(--hit);
  padding: 0; display: flex; align-items: center; justify-content: center;
}
/* 무시가 쌓이면 되돌리기를 지목한다 — 유도가 아니라 막힘의 해소라 속성색으로 숨쉰다. */
.undo.urge { border-color: var(--gold); color: var(--gold); animation: urge .8s ease-in-out infinite; }
@keyframes urge { 0%, 100% { box-shadow: none } 50% { box-shadow: 0 0 14px 3px var(--gold) } }
.cross button.down, .undo:active { background: color-mix(in srgb, var(--c3) 14%, var(--c2)); transform: scale(.96); }
.shake { animation: shake .2s linear 1; }
@keyframes shake {
  0%, 100% { transform: translateX(0) } 25% { transform: translateX(-5px) }
  75% { transform: translateX(5px) }
}
</style>
</head>
<body>
<div id="frame">
  <div id="tools">
    <button id="exportBtn" class="ghost">로그 내보내기</button>
    <button id="botBtn" class="ghost">봇 v2 실행</button>
    <button id="cheatBtn" class="ghost" aria-pressed="false" aria-controls="cheat">개발자 치트</button>
    <section id="cheat" class="cheat" hidden aria-label="개발자 치트"></section>
  </div>

  <div id="stagebox">
    <div id="stage">
      <div id="shell" class="shell"><div id="app"></div></div>
      <div id="live" class="sr-only" role="status" aria-live="polite"></div>
    </div>
  </div>
</div>
<script>
// 모듈 그래프 로드 실패(밸런스 JSON 구문 오류·검증 throw)는 화면에 백지로만 드러나므로 문면을 남긴다.
(() => {
  function showFatal(text) {
    // 부팅에 성공한 뒤의 런타임 예외까지 덮으면 플레이 중 화면이 통째로 날아간다 — 백지일 때만 쓴다.
    const el = document.getElementById('app');
    if (!el || el.childNodes.length > 0) return;
    el.style.whiteSpace = 'pre-wrap';
    el.style.padding = '16px';
    el.textContent = text;
  }
  addEventListener('error', (e) => showFatal(e.error ? e.error.message
    : `모듈 로드 실패 — ${(e.target && e.target.src) || location.href}\n의존 모듈이 원인일 수 있다 — 로컬 서버로 열었는지, .json 이 application/json 으로 오는지 확인한다.`), true);
  addEventListener('unhandledrejection', (e) => showFatal(String((e.reason && e.reason.message) || e.reason)));
})();
</script>
<script type="module" src="src/ui/app.mjs"></script>
</body>
</html>
