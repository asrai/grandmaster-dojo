<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>전수 v2 — 일대종사</title>
<style>
@font-face{font-family:'Dojo';src:url('assets/fonts/NanumMyeongjo-Regular.ttf') format('truetype');
  font-weight:400;font-display:block;
  unicode-range:U+0020-024F,U+2000-206F,U+20A0-20BF,U+1100-11FF,U+2190-21FF,U+3130-318F,U+AC00-D7AF,U+FF00-FFEF}
@font-face{font-family:'Dojo';src:url('assets/fonts/NanumMyeongjo-ExtraBold.ttf') format('truetype');
  font-weight:800;font-display:block;
  unicode-range:U+0020-024F,U+2000-206F,U+20A0-20BF,U+1100-11FF,U+2190-21FF,U+3130-318F,U+AC00-D7AF,U+FF00-FFEF}
@font-face{font-family:'Dojo';src:url('assets/fonts/NotoSerifKR-hanja-400.woff2') format('woff2');
  font-weight:400;font-display:block;unicode-range:U+3400-9FFF,U+F900-FAFF}
@font-face{font-family:'Dojo';src:url('assets/fonts/NotoSerifKR-hanja-800.woff2') format('woff2');
  font-weight:800;font-display:block;unicode-range:U+3400-9FFF,U+F900-FAFF}

:root{
  --ink-deep:#12100e; --ink-mid:#1e1a16; --paper:#e8dcc8;
  --gold:#c9a227; --seal:#a8332a;
  --swift:#5fb3e8; --force:#e05a4d; --still:#4fbf7f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#3a3632;display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:24px 0;font-family:'Dojo',serif}
.phone{position:relative;width:393px;height:852px;overflow:hidden;
  background:var(--ink-deep);color:var(--paper);
  box-shadow:0 18px 60px rgba(0,0,0,.55);display:flex;flex-direction:column}
.hj{font-size:11px;font-weight:400;color:rgba(232,220,200,.34);letter-spacing:2px}

/* ══ E1 상단 띠 ══ */
.topband{flex:0 0 50px;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:#0a0908;border-bottom:1px solid rgba(232,220,200,.07);z-index:8}
/* I13 — 시각 크기는 두고 히트 영역만 44px 로 넓힌다 */
.leave{position:relative}
.leave::after{content:'';position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.leave{width:28px;height:28px;flex:0 0 28px;border:none;background:none;cursor:pointer;
  color:rgba(232,220,200,.45);font-size:19px;line-height:1;font-family:'Dojo',serif}
.topband .cap{font-size:12px;color:rgba(232,220,200,.45);letter-spacing:2px}
.topband .kr{font-size:16px;font-weight:800;letter-spacing:.5px}

/* ══ E2 도장 무대 — 전수는 도장에서 일어난다 ══ */
.stage{position:relative;flex:0 0 440px;overflow:hidden}
.layer{position:absolute;inset:0;pointer-events:none}
.hall{background:radial-gradient(112% 70% at 50% 40%, #241d15 0%, #1a150f 48%, #12100d 78%, var(--ink-deep) 100%)}
.halo{background:radial-gradient(30% 20% at 50% 46%, rgba(201,162,39,.13), rgba(201,162,39,0) 74%)}
.vignette{background:radial-gradient(104% 76% at 50% 48%, rgba(0,0,0,0) 26%, rgba(0,0,0,.88) 100%)}
.ground{position:absolute;left:0;right:0;bottom:0;height:104px;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.5) 55%,rgba(0,0,0,.88))}

.fig{position:absolute;bottom:34px;pointer-events:none}
.fig svg{display:block;width:100%;height:auto}
.fig .body{fill:#0a0908;stroke:rgba(232,220,200,.16);stroke-width:1}
/* 둘 다 좌향 — 제자는 사부의 등 뒤에서 같은 자세를 잡는다 */
.fig{transform:scaleX(-1)}
.fig.master{left:36px;width:140px}
.fig.pupil{right:38px;width:100px;bottom:36px}
.fig .arm{transform-box:fill-box;transition:transform .3s}
.fig.pupil .arm{transform:rotate(9deg)}
/* 잔상 — 정지 시안에서 「동작 중」을 말하는 유일한 수단 */
.ghost{position:absolute;pointer-events:none;opacity:.14}
.ghost svg{display:block;width:100%;height:auto}
.ghost .body{fill:#c6b391;stroke:none}
.ghost.master{left:18px;bottom:34px;width:138px;transform:scaleX(-1)}
.ghost.pupil{right:26px;bottom:36px;width:98px;transform:scaleX(-1)}
.backlight{position:absolute;border-radius:50%;pointer-events:none}
.backlight.master{left:6px;bottom:30px;width:180px;height:198px;
  background:radial-gradient(closest-side, rgba(214,196,164,.15), rgba(214,196,164,0) 72%)}
.backlight.pupil{right:26px;bottom:30px;width:140px;height:156px;
  background:radial-gradient(closest-side, rgba(214,196,164,.13), rgba(214,196,164,0) 72%)}

/* E6 무공 인장 — 세로 조판, 두 사람 사이에 선다 */
.sigil{position:absolute;left:0;right:0;top:26px;z-index:4;
  display:flex;justify-content:center;align-items:flex-start;gap:8px}
.sigil .kr{writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;
  font-size:24px;font-weight:800;letter-spacing:5px;color:#e9dcc4;
  text-shadow:0 0 22px rgba(201,162,39,.5),0 3px 0 rgba(0,0,0,.6)}
.sigil .hjv{writing-mode:vertical-rl;text-orientation:upright;white-space:nowrap;
  font-size:13px;letter-spacing:5px;color:rgba(232,220,200,.4);padding-top:4px}

/* ══ 하단 명세 ══ */
.panel{flex:1 1 auto;overflow:hidden;padding:11px 13px 12px;
  background:linear-gradient(180deg,#0a0908,#161210 40%,#0f0d0b);
  display:flex;flex-direction:column}

/* E7 초식 이관 명세 — diff 두 컬럼이 아니라 초식마다 한 줄 */
.moves{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:8px}
.mv{position:relative;padding:9px 10px 9px 12px;
  background:rgba(232,220,200,.028);border:1px solid rgba(232,220,200,.08)}
.mv-top{display:flex;align-items:center;gap:8px}
.mv-bot{display:flex;align-items:center;gap:10px;margin-top:8px}
.mv .seq{flex:0 0 auto;display:flex;gap:9px;font-size:15px;color:rgba(232,220,200,.42);line-height:1}
/* 제자가 앞으로 밀어야 할 길 — S2 도장의 계단 언어 그대로 */
.mv .steps{flex:1 1 auto;display:flex;gap:2px;height:8px}
.mv .st{flex:1;background:rgba(0,0,0,.55);box-shadow:0 0 0 1px rgba(232,220,200,.1) inset}
.mv .st.on{background:linear-gradient(180deg,#8fd0f5,#2f6f9c);box-shadow:none}
.mv::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.mv.swift::before{background:var(--swift)}
.mv.force::before{background:var(--force)}
.mv.still::before{background:var(--still)}
.mv .nm{font-size:15px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.mv .hj{font-size:10px}
.mv .rk{margin-left:auto;display:flex;align-items:center;gap:7px;white-space:nowrap}
.mv .from{font-size:13px;font-weight:800;color:var(--gold)}
.mv .arrow{font-size:13px;color:rgba(232,220,200,.3)}
.mv .to{font-size:13px;font-weight:800;color:var(--swift)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.gl{display:inline-block;flex:0 0 auto}
.gl.swift{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid var(--swift)}
.gl.force{width:12px;height:12px;border-radius:50%;background:var(--force)}
.gl.still{width:11px;height:11px;background:var(--still)}

/* E10 도장으로 */
.back{flex:0 0 52px;border:1px solid var(--gold);background:rgba(201,162,39,.14);
  color:var(--gold);font-family:'Dojo',serif;font-size:17px;font-weight:800;letter-spacing:3px;
  cursor:pointer}

/* ── UI 요소 ID 주석 레이어 (/gamedev-ui v0.5 공용 스니펫) ── */
.ui-annotate-toggle{position:fixed;top:14px;right:14px;z-index:9999;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:13px;font-weight:700;color:#fff;background:#2563eb;border:none;border-radius:8px;padding:9px 14px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3)}
.ui-annotate-toggle:hover{background:#1d4ed8}
.ui-annotate-overlay{position:absolute;inset:0;z-index:999;pointer-events:none;display:none}
.ui-annotate-on .ui-annotate-overlay{display:block}
.ui-annotate-box{position:absolute;border:1.5px solid #2563eb;border-radius:4px;box-shadow:0 0 0 1px rgba(255,255,255,.55)}
.ui-annotate-chip{position:absolute;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:11px;font-weight:800;line-height:1;color:#fff;background:#2563eb;border:1px solid rgba(255,255,255,.75);border-radius:4px;padding:3px 5px}
.ui-annotate-box.sub{border-color:#60a5fa;border-width:1px;border-style:dashed}
.ui-annotate-chip.sub{background:#60a5fa;font-size:9px;padding:2px 4px}
.ui-annotate-legend{margin-top:16px;width:393px;font-family:-apple-system,'Apple SD Gothic Neo',sans-serif;font-size:12px;color:#333;background:rgba(255,255,255,.72);border:1px solid #bbb;border-radius:10px;padding:10px 14px;display:none;column-count:2;column-gap:18px}
.ui-annotate-on-page .ui-annotate-legend{display:block}
.ui-annotate-legend div{break-inside:avoid;padding:2px 0}
.ui-annotate-legend b{color:#2563eb}
.ui-annotate-legend .sub b{color:#60a5fa}
.ui-annotate-legend .sub{padding-left:12px}
.ui-annotate-legend h4{column-span:all;font-size:11px;letter-spacing:1px;color:#888;margin:8px 0 4px;border-bottom:1px solid #ccc;padding-bottom:3px}
.ui-annotate-legend h4:first-child{margin-top:0}
.ui-annotate-swatch{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.2);vertical-align:-2px;margin-right:4px}
.ui-annotate-legend code{font-size:11px;color:#666}
body.ui-capture .ui-annotate-toggle,body.ui-capture .ui-annotate-legend{display:none!important}
body.ui-capture{display:block;min-height:0;padding:0}
body.ui-capture [data-artboard]{box-shadow:none}
</style>
</head>

<script>
/* ?state=follow|done — 제자가 따라 하는 중 / 자세가 맞아떨어진 순간 */
(function(){
  var st = new URLSearchParams(location.search).get('state') || 'done';
  if (st !== 'follow') return;
  document.querySelector('.fig.pupil .arm').style.transform = 'rotate(34deg)';

  /* 아직 익히지 못했다 — 제자 자세가 사부와 어긋나 있고 성은 비어 있다 */
  document.querySelectorAll('.mv .to').forEach(function(e){
    e.textContent = '—'; e.style.color = 'rgba(232,220,200,.28)';
  });
  document.querySelectorAll('.mv .st.on').forEach(function(e){ e.classList.remove('on'); });
  document.querySelector('.backlight.pupil').style.opacity = '.3';
  /* 연출 중에도 버튼 자리는 비우지 않는다 — 빈 바닥은 결손으로 읽힌다 */
  var b = document.querySelector('.back');
  b.textContent = '건너뛰기';
  b.style.borderColor = 'rgba(232,220,200,.2)';
  b.style.background = 'rgba(232,220,200,.04)';
  b.style.color = 'rgba(232,220,200,.5)';
})();
</script>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var captureMode = params.has('capture');
  var startOn = params.has('annotate');
  if (captureMode) document.body.classList.add('ui-capture');

  var board = document.querySelector('[data-artboard]');
  var overlay = document.createElement('div');
  overlay.className = 'ui-annotate-overlay';
  board.appendChild(overlay);

  function buildBadges() {
    overlay.innerHTML = '';
    var legend = document.getElementById('uiLegend');
    legend.innerHTML = '';
    var h = document.createElement('h4'); h.textContent = 'UI 요소'; legend.appendChild(h);
    var boardRect = board.getBoundingClientRect();
    document.querySelectorAll('[data-ui]').forEach(function (el) {
      var parts = el.getAttribute('data-ui').split(':');
      var id = parts[0], name = parts[1] || '';
      var isSub = id.indexOf('-') > -1;
      var r = el.getBoundingClientRect();
      var top = r.top - boardRect.top, left = r.left - boardRect.left;
      var box = document.createElement('div');
      box.className = 'ui-annotate-box' + (isSub ? ' sub' : '');
      box.style.cssText = 'top:'+top+'px;left:'+left+'px;width:'+r.width+'px;height:'+r.height+'px;';
      overlay.appendChild(box);
      var chip = document.createElement('div');
      chip.className = 'ui-annotate-chip' + (isSub ? ' sub' : '');
      chip.textContent = id; chip.title = name;
      chip.style.cssText = 'top:'+Math.max(2,top-8)+'px;left:'+Math.max(2,left-6)+'px;';
      overlay.appendChild(chip);
      var row = document.createElement('div');
      if (isSub) row.className = 'sub';
      row.innerHTML = '<b>'+id+'</b> '+name;
      legend.appendChild(row);
    });
    var ledgerEl = document.getElementById('uiStyleLedger');
    if (ledgerEl) {
      var ledger = JSON.parse(ledgerEl.textContent);
      if (ledger.colors && ledger.colors.length) {
        var hc = document.createElement('h4'); hc.textContent = '배경·색상'; legend.appendChild(hc);
        ledger.colors.forEach(function (c) {
          var row = document.createElement('div');
          row.innerHTML = '<b>'+c.id+'</b> <span class="ui-annotate-swatch" style="background:'+c.value+'"></span>'+c.name+' <code>'+c.value+'</code>';
          legend.appendChild(row);
        });
      }
      if (ledger.fonts && ledger.fonts.length) {
        var hf = document.createElement('h4'); hf.textContent = '폰트'; legend.appendChild(hf);
        ledger.fonts.forEach(function (f) {
          var row = document.createElement('div');
          row.innerHTML = '<b>'+f.id+'</b> '+f.name+' — '+f.surface;
          legend.appendChild(row);
        });
      }
    }
  }

  var btn = document.createElement('button');
  btn.className = 'ui-annotate-toggle';
  function setState(on) {
    document.body.classList.toggle('ui-annotate-on', on);
    document.body.classList.toggle('ui-annotate-on-page', on);
    btn.textContent = on ? '요소 번호 숨기기' : '요소 번호 표시';
    btn.dataset.on = on ? '1' : '0';
  }
  btn.addEventListener('click', function () { setState(btn.dataset.on !== '1'); });
  document.body.appendChild(btn);

  window.addEventListener('load', function () { buildBadges(); setState(startOn); });
})();
</script>
</body>
</html>
