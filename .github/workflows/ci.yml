name: CI

# 이 repo 의 유일한 검증 잡. `main protection` ruleset 의 required status check
# 로 등록되므로 **경로 필터를 두지 않는다** — 필터에 걸린 PR 은 `ci` 를 영원히
# 보고하지 않아 무음 차단된다 (#6).
# python3 은 러너 이미지에 딸린 것을 그대로 쓴다 — comment-lint 는 stdlib 전용이라
# 버전 고정의 이득이 setup-python 한 스텝의 비용을 넘지 않는다.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main 푸시는 취소하지 않는다 — 중간 커밋이 완결된 `ci` 없이 남는다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # ruleset `main protection` 의 required context 문자열 — 개명하면 이후 모든 PR 이
    # 없는 검사를 기다리며 무음 차단된다 (ruleset 을 같은 세션에서 함께 고칠 것).
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # comment-lint 의 ratchet base 를 resolve 하려면 base 커밋이 있어야 한다
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 구문 검사 (ESM 모듈 전량)
        run: |
          set -o pipefail
          count=$(git ls-files '*.mjs' | wc -l | tr -d ' ')
          echo "대상 .mjs ${count}건"
          # 대상 0건은 통과가 아니라 검사가 사라진 것이다
          [ "$count" -gt 0 ] || { echo "::error::.mjs 대상 0건 — 구문 검사가 무음 통과했다"; exit 1; }
          git ls-files -z '*.mjs' | xargs -0 -r -n1 node --check

      - name: import 해석 검사
        # 위 구문 검사가 못 보는 상대 경로·named export 파손을 잡는다. 별도 잡이 아니라
        # 이 잡의 스텝인 것은 ruleset `main protection` 의 required context 가 `ci` 하나뿐이라
        # 잡을 늘리면 그 등록을 다시 손대야 하기 때문이다.
        run: node scripts/check-imports.mjs

      - name: 헤드리스 하네스
        # 판정은 파일 존재가 아니라 exit code 다. green 경로의
        # `단정 N건 · 실패 0건` stdout 이 "안 걸렸다" 와 "안 돌았다" 를 가른다.
        run: node tests/harness.mjs

      - name: kill 판독기
        # 자체 생성 → 파일 판독의 두 형태를 모두 태운다. 종료 코드는 **판독 가능성**이라
        # kill 미달은 red 가 아니고, 필드 결손·스키마 위반·전 종류 미방출만 잡의 실패다.
        run: |
          # RUNNER_TEMP 는 GitHub 러너에만 있다 — act·커스텀 러너에서 빈 값이면 `/cycle-log.json` 이 된다
          OUT="${RUNNER_TEMP:-.}/cycle-log.json"
          node tests/kill-readout.mjs --emit "$OUT"
          node tests/kill-readout.mjs "$OUT"

      - name: 폰트 커버리지 게이트
        # 서브셋 문자 집합은 사람이 손으로 관리하므로, 새 문구가 두부(□)로 렌더되는 것을
        # 잡을 층이 이것뿐이다 (REQ-804). 생성기(`subset-fonts.sh`)는 개발자 수동 실행이라
        # `pyftsubset` 은 러너에 올리지 않는다 — 여기서는 커밋된 woff2 만 읽는다.
        run: node scripts/check-font-coverage.mjs

      - name: comment-lint self-test
        run: python3 scripts/comment-lint.py --self-test

      - name: comment-lint 코퍼스 스캔 (advisory)
        # ratchet 스텝은 변경 파일만 보므로 `.mjs` 를 안 건드린 PR 에서는 추출기가
        # 실파일에 한 번도 돌지 않는다. 이 스텝이 매 run 전량을 파싱해 계수를 로그에
        # 남기고, 위반이 아니라 **추출기 비정상 종료**만 잡의 실패로 올린다.
        run: |
          set -o pipefail
          rc=0
          python3 scripts/comment-lint.py --root . > lint-full.log 2>&1 || rc=$?
          cat lint-full.log
          grep -q '^## comment-lint:' lint-full.log \
            || { echo "::error::comment-lint 가 코퍼스에서 비정상 종료했다 (rc=$rc)"; exit 1; }

      - name: comment-lint (ratchet)
        env:
          # base 를 싣는 필드가 이벤트마다 다르다 — workflow_dispatch 는 아예 없다
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) BASE="$PR_BASE" ;;
            merge_group)  BASE="$MG_BASE" ;;
            push)         BASE="$PUSH_BASE" ;;
            *)            BASE="" ;;
          esac
          if [ -z "$BASE" ] || ! git rev-parse --verify "$BASE^{commit}" >/dev/null 2>&1; then
            # PR 에서 base 가 없으면 lint 가 fail-open 으로 무음 스킵된다 —
            # required check 가 스스로 꺼지는 대신 여기서 죽는다.
            [ "$GITHUB_EVENT_NAME" != "pull_request" ] \
              || { echo "::error::ratchet base '$BASE' 미해결 — comment-lint 가 무음 스킵된다"; exit 1; }
            BASE=$(git rev-parse --verify HEAD^ 2>/dev/null || git rev-parse HEAD)
            echo "::notice::$GITHUB_EVENT_NAME 에는 base 필드가 없다 — $BASE 로 대체"
          fi
          # lint 는 base/diff 실패를 fail-open(rc 0)으로 접는다 — 공유 스크립트의
          # 계약이라 여기서 바꾸지 않고, required check 쪽에서 리포트 헤더 부재를
          # 실패로 승격해 "아무것도 검사하지 않고 green" 을 막는다.
          rc=0
          python3 scripts/comment-lint.py --root . --changed-only --base "$BASE" \
            > lint-ratchet.log 2>&1 || rc=$?
          cat lint-ratchet.log
          [ "$rc" -eq 0 ] || exit "$rc"
          grep -q '^## comment-lint:' lint-ratchet.log \
            || { echo "::error::ratchet 이 무음 스킵됐다 (fail-open) — 검사 0건으로 green 이 될 뻔했다"; exit 1; }
