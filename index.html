<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>일대종사 一代宗師</title>
<style>
:root {
  --bg: #0e1116; --panel: #161b23; --line: #262d38; --fg: #e6eaf0; --dim: #8d97a5;
  --gold: #ffd166; --hit: 56px; --letterbox: #05070a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100dvh; overflow: hidden; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, "Noto Sans KR", sans-serif;
  overscroll-behavior: none;
}
/* 스케일 계수는 무단위 비율이어야 하는데 min() 은 길이와 수를 못 섞는다 — tan(atan2()) 가 길이비를 수로 환산한다. */
#frame {
  --k: min(tan(atan2(100vw, 393px)), tan(atan2(100dvh, 852px)), 1);
  position: relative; width: 100vw; height: 100dvh;
  display: grid; place-content: center; overflow: hidden;
  background: var(--letterbox);
}
/* 논리 해상도를 393x852 로 못박고 창에는 축소로만 맞춘다 — 내부 좌표가 창·기기와 무관해진다. */
#stage {
  position: relative; z-index: 1; width: 393px; height: 852px;
  transform: scale(var(--k)); transform-origin: center;
  background: var(--bg); border-radius: 18px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--line);
}
#app { display: flex; flex-direction: column; height: 100%; }
/* 플렉스 자식의 기본 min-width:auto 가 긴 한글 줄을 뷰포트 밖으로 밀어낸다. */
#app, #screen, .card, .row, .row-head, .row-name, .telegraph, .head, .meter-line > *, .tip-anchor { min-width: 0; }

/* 폭에 따라 줄 수가 바뀌면 헤더 높이가 흔들리므로 2줄 구조를 마크업으로 못박는다. */
#top {
  display: flex; flex-direction: column; justify-content: center; gap: 3px;
  height: 56px; padding: 0 14px; border-bottom: 1px solid var(--line); font-size: 13px;
  overflow: hidden;
}
.top-row { display: flex; gap: 10px; align-items: center; min-width: 0; white-space: nowrap; }
.top-row > span { overflow: hidden; text-overflow: ellipsis; }
#top #label { font-weight: 700; color: var(--gold); }
#top #coins { margin-left: auto; }
#top label { display: flex; gap: 4px; align-items: center; color: var(--dim); }
/* 검증 도구는 게임 UI 가 아니라 레터박스 여백에 산다 — 스테이지 스크린샷에 잡히면 안 된다. */
#tools { position: absolute; top: 8px; left: 8px; z-index: 0; display: flex; gap: 6px; }
#tools button { padding: 4px 8px; font-size: 12px; }
#tools button.urge { border-color: var(--gold); color: var(--gold); }

#screen { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }

/* 바닥 밴드의 주인과 높이는 화면이 정한다 — 비워 두는 화면에서는 자리도 남지 않는다. */
#band {
  position: relative; border-top: 1px solid var(--line); background: var(--panel);
  padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;
}
#band:not(:has(*)) { display: none; }
/* 밴드는 화면 맨 아래라 말풍선을 위로 띄우고, 기준 상자를 밴드로 올려 좁은 칸에서 접히지 않게 한다. */
#band .tip-anchor { position: static; }
#band .tip { top: auto; bottom: calc(100% + 4px); }
.band-actions { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.band-cell { display: flex; flex-direction: column; gap: 4px; }
.band-actions button { width: 100%; min-height: var(--hit); padding: 8px 4px; font-weight: 700; }
/* 부제는 잠금 여부와 무관하게 한 줄을 차지한다 — 밴드가 높이를 바꾸면 위 스크롤 영역이 함께 흔들린다. */
.band-sub {
  height: 16px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font-size: 11px; line-height: 16px; color: var(--dim); text-align: center;
}
.band-sim { width: 100%; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.card h2 { margin: 0 0 8px; font-size: 15px; }
.card p { margin: 6px 0; }
.head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.head button { margin-left: auto; }
.hanja, .dim { color: var(--dim); font-size: 12px; }
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--gold); color: var(--gold); font-size: 12px;
}
.badge.max { background: var(--gold); color: #1a1206; font-weight: 700; }
.tag { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

button {
  font: inherit; color: var(--fg); background: #202836; border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px; cursor: pointer;
}
button:disabled { opacity: .35; cursor: default; }
button.primary { width: 100%; padding: 12px; font-weight: 700; }
button.small { padding: 5px 10px; font-size: 13px; }
button.ghost { background: transparent; }
.actions { display: flex; flex-direction: column; gap: 8px; }

.rows { display: flex; flex-direction: column; gap: 8px; }
.row {
  /* 말풍선의 기준 상자 — 헤더에 걸면 말풍선이 바로 아래 시퀀스 화살표를 덮는다. */
  position: relative;
  border: 1px solid var(--line); border-left: 3px solid var(--attr); border-radius: 8px; padding: 6px 8px;
}
.row.locked { opacity: .55; }
.row-head { display: flex; gap: 6px; align-items: center; min-height: 44px; }
.row-head button { min-height: 40px; }
/* 접기 토글은 진짜 버튼이라야 키보드로 닿는다 — 줄 이름 전체가 그 히트 영역이다. */
.row-name {
  flex: 1; display: flex; gap: 6px; align-items: center;
  text-align: left; background: transparent; border: 0; padding: 0;
}
.row-name::before { content: '\25B8'; color: var(--dim); font-size: 11px; }
.row.open .row-name::before { content: '\25BE'; }
.meter-line { display: flex; gap: 8px; align-items: center; }
.meter-line .meter { flex: 1; }

/* 흐름 밖 말풍선을 담을 뿐이라 앵커 자신의 크기는 안내 유무로 변하지 않는다. */
.tip-anchor { position: relative; display: flex; }
.row .tip-anchor { position: static; }
.tip {
  /* 아래 형제 위로 겹치므로, 포인터를 통과시켜야 그 형제의 탭을 가로채지 않는다. */
  position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 1;
  pointer-events: none; font-size: 12px;
  color: var(--gold); background: #201a0c; border: 1px solid var(--gold);
  border-radius: 6px; padding: 2px 8px;
}
/* 지목의 주 신호 — 말풍선이 가려져도 어느 버튼을 누르라는 것인지는 테두리로 읽힌다. */
.tip-target { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.meter { height: 5px; background: #0b0e13; border-radius: 3px; margin: 6px 0; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--gold); }

.mark { font-size: 15px; line-height: 1; }
.mark.big { font-size: 24px; }
.arrows { display: flex; gap: 6px; margin: 4px 0; }
.arrows i { font-style: normal; font-size: 20px; width: 24px; text-align: center; color: #39424f; }
.arrows i.on { color: var(--gold); }
.arrows i.hint { color: #5d6a7c; animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }

.hpbar { height: 10px; background: #0b0e13; border-radius: 5px; overflow: hidden; margin: 6px 0; }
.hpbar i { display: block; height: 100%; background: linear-gradient(90deg, #ff5a5a, #ffd166); transition: width .25s; }

/* 판정은 오버레이가 지므로 남는 세로는 빈 칸으로 남긴다 — 아래 절반의 자리를 그대로 유지한다. */
.arena { display: flex; flex-direction: column; flex: 1; }
.arena .tg-slot { min-height: 74px; }
.arena .arena-gap { flex: 1; }
.telegraph { border: 1px solid var(--attr, var(--line)); border-radius: 8px; padding: 8px; display: flex; gap: 10px; align-items: center; }
.telegraph.open { border-color: var(--gold); color: var(--gold); justify-content: center; font-weight: 700; }
.tg-foe { display: flex; gap: 6px; align-items: center; flex: 1; }
.tg-win { display: flex; gap: 4px; align-items: center; border-left: 1px solid var(--line); padding-left: 10px; color: var(--attr); }
.window { height: 6px; background: #0b0e13; border-radius: 3px; overflow: hidden; margin: 8px 0; }
.window i { display: block; height: 100%; background: #4aa8ff; }

.icons { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
.cand {
  display: flex; gap: 6px; align-items: center; padding: 8px 10px; min-height: 44px;
  border: 2px solid var(--attr); border-radius: 10px; background: #131922; color: var(--fg);
}
.cand.top { background: #1d2735; box-shadow: 0 0 0 2px var(--attr) inset; }
.cand.mini, .cand.big-icon { pointer-events: none; }
.cand.big-icon { font-size: 18px; padding: 14px 18px; }
.cand.picked { outline: 2px solid var(--gold); }
.cand.lit { animation: pop .3s ease-out; }
.cand.flash { animation: flash .6s ease-in-out 1; }
@keyframes flash { 0%, 100% { box-shadow: none } 50% { box-shadow: 0 0 14px 3px var(--attr) } }
.cand-name { font-size: 13px; }

.transmit .sides { display: flex; gap: 10px; }
.transmit .side { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.transmit .side.dark { opacity: .25; transition: opacity .6s; }
.transmit .side.dark.arrived { opacity: 1; border-color: var(--gold); }
.result h2.win { color: var(--gold); }
.result h2.lose { color: #ff5a5a; }
.result ul { margin: 6px 0; padding-left: 18px; }

.toast { min-height: 20px; text-align: center; color: var(--gold); opacity: 0; transition: opacity .2s; }
.toast.show { opacity: 1; }

/* 판정은 흐름 밖에서 뜬다 — 자리를 차지하면 문구 등장마다 아래 형제가 밀린다 (#40). */
#verdictOverlay {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
}
.verdict-pop { text-align: center; text-shadow: 0 2px 16px #000, 0 0 32px #000; animation: verdict-pop .5s ease-out forwards; }
.verdict-mark { display: block; font-size: 88px; font-weight: 800; line-height: 1; }
.verdict-label { display: block; margin-top: 8px; font-size: 22px; font-weight: 800; letter-spacing: 3px; }
/* 응수 창(500ms)이 다시 열리기 전에 스스로 사라진다 — 다음 판정과 겹쳐 읽히지 않게. */
@keyframes verdict-pop {
  0% { opacity: 0; transform: scale(.6) }
  20% { opacity: 1; transform: scale(1.1) }
  36% { transform: scale(1) }
  100% { opacity: 0; transform: scale(1) }
}

#pad { border-top: 1px solid var(--line); padding: 8px 12px; background: var(--panel); height: calc(var(--hit) * 2 + 160px); }
/* 자리째 접는다 — 패드를 쓰는 화면은 진입부터 이탈까지 붙여 두므로 화면 안에서 높이가 튀지 않는다. */
#pad.detached { display: none; }
#pad.idle { opacity: .4; }
#pad.idle #dpad button { pointer-events: none; }
/* 봇 점유 중 사람 입력은 무시되므로, 눌러도 되는 것처럼 보이지 않게 한다. */
#pad.bot { box-shadow: inset 0 2px 0 var(--gold); }
#pad.bot #dpad button, #pad.bot #candidates { pointer-events: none; opacity: .6; }
.pad-color { display: flex; gap: 6px; align-items: center; min-height: 28px; font-size: 16px; font-weight: 700; }
.pad-color.none { color: var(--dim); }
.pad-name { color: var(--dim); font-size: 12px; font-weight: 400; }
.candidates { display: flex; gap: 6px; overflow-x: auto; min-height: 46px; padding-bottom: 2px; }
.candidates.solo .cand { font-size: 17px; padding: 10px 16px; }
.candidates.solo .cand-name { font-size: 16px; }
#seq { min-height: 30px; }
#dpad {
  display: grid; grid-template-columns: repeat(3, var(--hit)) 1fr;
  grid-template-rows: repeat(2, var(--hit)); gap: 6px; align-items: center; margin-top: 6px;
}
#dpad button { width: 100%; height: 100%; min-height: var(--hit); font-size: 22px; }
#dpad [data-dir="U"] { grid-area: 1 / 2; }
#dpad [data-dir="L"] { grid-area: 2 / 1; }
#dpad [data-dir="D"] { grid-area: 2 / 2; }
#dpad [data-dir="R"] { grid-area: 2 / 3; }
#dpad #resetBtn { grid-area: 1 / 4 / 3 / 5; font-size: 14px; }
#dpad #resetBtn.urge { --attr: var(--gold); border-color: var(--gold); color: var(--gold); animation: flash .8s ease-in-out infinite; }
#dpad button.down { background: #2d3a4d; transform: scale(.96); }
.shake { animation: shake .2s linear 1; }
@keyframes shake {
  0%, 100% { transform: translateX(0) } 25% { transform: translateX(-5px) }
  75% { transform: translateX(5px) }
}
</style>
</head>
<body>
<div id="frame">
  <div id="stage">
    <div id="app">
      <header id="top">
        <div class="top-row">
          <span id="label">문하생</span>
          <span id="rank" class="dim">유운검법 1성</span>
          <span id="coins">元 0</span>
        </div>
        <div class="top-row">
          <label><input type="checkbox" id="a11y">응수 창 ×1.3 (쉬움)</label>
        </div>
      </header>

      <main id="screen"></main>

      <nav id="band" aria-label="주요 행동"></nav>

      <footer id="pad" class="detached">
        <div id="padColor" class="pad-color none"></div>
        <div id="candidates" class="candidates"></div>
        <div id="seq"></div>
        <div id="dpad">
          <button data-dir="U" aria-label="위">↑</button>
          <button data-dir="L" aria-label="왼쪽">←</button>
          <button data-dir="D" aria-label="아래">↓</button>
          <button data-dir="R" aria-label="오른쪽">→</button>
          <button id="resetBtn">리셋<br><span class="dim">Space</span></button>
        </div>
      </footer>
    </div>
    <div id="verdictOverlay" aria-live="polite"></div>
  </div>

  <div id="tools">
    <button id="exportBtn" class="ghost">로그 내보내기</button>
    <button id="botBtn" class="ghost">봇 v2 실행</button>
  </div>
</div>
<script type="module" src="src/ui/app.mjs"></script>
</body>
</html>
