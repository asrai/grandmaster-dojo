name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      # Claude Code Action은 PR 브랜치의 workflow 파일이 main과 동일하지 않으면
      # 401 Workflow validation failed로 거부 (보안 메커니즘). propagate.yml이
      # 여는 템플릿 동기화 PR이나 workflow 튜닝 PR은 이 경로로만 바뀌므로 review
      # skip하는 것이 맞음. (세션 F 후속-3에서 추가)
      - '.github/workflows/**'

jobs:
  review:
    # 4-단 가드 (asrai-adk A7 Phase 2 본 적용 — 2026-04-27, 작업 16):
    #   1. paths-ignore (위 on:) — workflow 단독 변경 PR 차단 (1차)
    #   2. draft == false — Draft PR 차단 (writer 가 ready 전환 후에만 동작)
    #   3. chore/sync 라벨 negative 가드 — propagate.py 자동 PR 차단. agent/writer
    #      positive 가드만으로도 chore/sync 는 막히므로 redundant defense-in-depth
    #      이지만 가시성 / 의도 표현용 + propagate.py 라벨 부착 race 시 fallback 으로
    #      유지 (정리 시점에 잘못 빼지 말 것).
    #   4. agent/writer 라벨 positive 가드 — Writer Draft PR (claude.yml post-step 부착)
    #      한정 측정 채널. collaborator-only 라벨이므로 자체 collaborator 본인의
    #      직접 PR + 외부 contributor PR 모두 차단됨 (정책 의도). CI 비용 절감 +
    #      운영 모드 정합 측정 채널 보존. 사용자 직접 PR 의 frontend UX axis 등
    #      잔여 catch 는 Plan-driven Flow step 6 L4 manual UI primary sweep 가
    #      1차 catch 책임 layer (Skill github-workflow 참조).
    if: github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'chore/sync') && contains(github.event.pull_request.labels.*.name, 'agent/writer')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          allowed_bots: "dependabot,dotfiles-propagator"
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr edit:*),Bash(gh label create:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            당신은 독립적인 코드 리뷰어입니다. 이 PR을 처음 보는 관점에서 리뷰하세요.

            PR 정보는 `gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }}` 와 `gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }}` 로 확인 가능합니다. 저장소 루트의 `CLAUDE.md` 를 먼저 읽어 프로젝트 규칙을 파악하세요.

            ## 프로젝트 컨텍스트
            <!--
              ▼▼▼ 프로젝트별로 이 블록을 교체하세요. 예시:

              - 프로젝트: <한 줄 요약>
              - 스택: <언어/프레임워크/주요 라이브러리>
              - 아키텍처 원칙: <예: thin client, 외부 API 직접 호출 금지, 도메인 분리 등>
              - 특이 제약: <예: 특정 파일 수정 금지, 데이터 마이그레이션 규칙 등>
            -->

            ## 저장소 공통 규약 (수정하지 말 것)
            - `docs/plan_YYYYMMDD_*.md`는 글로벌 CLAUDE.md의 `Plan File Preservation` 규칙에 의한 **의도적 영속화**. 해당 파일의 제거·이동·재배치·요약화를 제안하지 말 것. 로컬 머신 절대 경로(`/Volumes/...`, `/Users/...`)가 포함된 경우는 추상화(`<repo-root>/`) 제안만 허용.

            ## 리뷰 관점 (우선순위 순)
            1. 정확성: 연결된 이슈/PR 본문의 요구사항 충족 여부
            2. 아키텍처: 위 프로젝트 컨텍스트 및 저장소 공통 규약 위반 여부
            3. 언어/프레임워크 베스트 프랙티스 (타입 안정성, 비동기 패턴, 에러 처리 등)
            4. 스타일 일관성 (lint 이상의 코드 관례)
            5. 접근성 (UI 프로젝트의 경우 시맨틱 태그/ARIA/색상 대비)
            6. 확장성: 실제 통합/데이터 연결 시 리팩터링 부담
            7. 보안: 환경변수 노출, 외부 링크 rel 속성, 의존성 취약점

            ## 출력 형식 (PR 코멘트로 작성, 300단어 이내)

            ```
            ### Blocker (머지 전 수정 필수)
            - ...  또는 "없음"

            ### Suggestion (개선 제안)
            - ...  또는 "없음"

            ### Nit (스타일/사소)
            - ...  또는 "없음"

            ### 전체 의견
            (LGTM / 조건부 LGTM / 수정 요청) + 한 줄 요약
            ```

            제약:
            - 전체 저장소 감사 금지, PR의 diff 범위 내 파일만
            - Blocker 없으면 "없음" 명시
            - 모두 문제 없으면 "LGTM"으로 깔끔히 마무리
            - 과장된 칭찬/정리/사족 금지

            ## 게시 방법 (반드시 준수)
            - 최종 리뷰는 heredoc + stdin 방식으로 PR 탑레벨 코멘트에 게시하세요. 임시 파일 생성(`/tmp/*`, `./*.md`, `.claude-pr/*` 등)은 액션 환경에서 권한 거부되므로 금지합니다. 예시:

              gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body-file - <<'EOF'
              ### Blocker (머지 전 수정 필수)
              ...
              (전체 본문)
              EOF

            - 코드 특정 라인 지적은 `mcp__github_inline_comment__create_inline_comment` 로 인라인 코멘트 게시 (`confirmed: true`).
            - 리뷰 텍스트를 응답 메시지로만 반환하지 마세요. 반드시 GitHub 코멘트로 게시해야 합니다.

            ## 리뷰어 라벨 부착 (코멘트 게시 직후, 블로커 판정과 독립)

            리뷰 코멘트 게시가 완료된 **직후** `agent/reviewer` 라벨을 부착합니다. 블로커 유무와 무관하게 매 리뷰 run마다 실행(멱등). 이 라벨은 "리뷰어 에이전트가 이 PR을 본 적 있음"의 감사 표식입니다.

              gh label create agent/reviewer --color "0366d6" --description "Reviewer 에이전트(claude-review.yml)가 리뷰한 PR" -f --repo ${{ github.repository }} || true
              gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-label "agent/reviewer" || true

            제약:
            - 반드시 코멘트 게시 완료 **이후**에 실행. 라벨만 붙고 코멘트 없으면 감사 의미가 없음.
            - 실패해도 다음 블로커 라벨링 단계는 계속 진행(`|| true`로 멱등성 + non-fatal 보장).

            ## 블로커 라벨링 (리뷰어 라벨 이후 실행)

            코멘트 게시가 완료된 **다음** 단계로 Blocker 리스트 상태에 따라 PR 라벨을 조정합니다. 이 라벨은 Fire-and-forget Automation의 auto-merge gate로 사용됩니다 (Skill `github-workflow` references/fire-and-forget.md + `reference.md#fire-and-forget-automation-details` § Safeguards 참조).

            - Blocker 리스트가 "없음"이 아닌 경우 — 라벨 추가:

              gh label create review/blocker --color "d73a4a" --description "리뷰어 에이전트가 Blocker 발견" -f --repo ${{ github.repository }} || true
              gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-label "review/blocker"

            - Blocker 리스트가 "없음"인 경우 — 라벨 제거 (재실행/수정 후 재리뷰 대응, 멱등):

              gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label "review/blocker" 2>/dev/null || true

            제약:
            - 라벨 조정은 반드시 코멘트 게시 **이후**에. 라벨만 붙고 코멘트 없으면 사용자가 블로커 내용을 확인할 수 없음.
            - `gh label create`의 `-f` 플래그는 이미 존재 시 color/description 업데이트 + 실패 미발생 보장. `|| true`로 추가 방어.
            - `--remove-label`은 라벨 없을 때 실패할 수 있으므로 `2>/dev/null || true`로 멱등성 확보.
